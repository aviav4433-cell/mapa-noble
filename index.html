  if(r){ var g=await api('getAll'); if(g&&g.ok)DB=g.db; render(); }
}

/* ===== B5: Driver-Lite — דשבורד נהג: מסלול, ניווט, תיעוד שיחות, סטטוס ללקוח (D12/D13/D14) ===== */
var B5_OPEN_STATUSES = ['מתוכנן','בדרך'];
/* B29: המסלול מציג רק את מה שרלוונטי להיום. איסוף שתאריכו בעתיד לא יופיע יחד עם האספקה
   של אותה הזמנה — כך הנהג לא רואה את אותו לקוח פעמיים באותו יום. */
/* B44: איסוף שההזמנה שלו כבר נקלטה חזרה במכבסה יורד מהמסלול של הנהג —
   בדיוק כמו במסך המשלוחים (rDeliveries), שכבר סינן כך מ-B41. בלי הסינון הזה
   הרשומה נשארה ב"היום" לנצח בזמן שרשומה מקבילה כבר הופיעה בהיסטוריה.
   סינון תצוגה בלבד — אף סטטוס בגיליון לא משתנה. */
function b5MyRoute(){
  var t = todayYMD();
  return DB.deliveries.filter(d=>d.driver===USER && B5_OPEN_STATUSES.includes(d.status) && !b41PickupReceived(d) && dYmd(d.date)!=='' && dYmd(d.date)<=t)
    .sort((a,b)=>{ var ra=Number(a.route_order)||999999, rb=Number(b.route_order)||999999; return ra!==rb?ra-rb:(a.id<b.id?-1:1); });
}
function b5MyFuture(){
  var t = todayYMD();
  return DB.deliveries.filter(d=>d.driver===USER && B5_OPEN_STATUSES.includes(d.status) && !b41PickupReceived(d) && dYmd(d.date)>t)
    .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
}
var DRV_TAB = 'today';
/* B32: עצירות שכבר בוצעו היום נשארות בתצוגה — מכווצות ומועמות — כדי שהנהג
   יראה מה נסגר ומה עוד נותר. סינון תצוגה בלבד; אין שינוי בנתונים או בסטטוסים. */
function b5DoneToday(){
  var t = todayYMD();
  return DB.deliveries.filter(d=>d.driver===USER && !B5_OPEN_STATUSES.includes(d.status) && dYmd(d.date)===t)
    .sort((a,b)=>(String(a.id)<String(b.id)?-1:1));
}
function rDriverRoute(){
  var mine = b5MyRoute();
  var doneT = b5DoneToday();
  var future = b5MyFuture();
  var history = DB.deliveries.filter(d=>d.driver===USER && !B5_OPEN_STATUSES.includes(d.status))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,40);
  var tb = function(k,l,n){ return '<button class="btn '+(DRV_TAB===k?'':'ghost')+' grow" onclick="DRV_TAB=\''+k+'\';rDriverRoute()">'+l+(n?' ('+n+')':'')+'</button>'; };
  var body, head;
  if(DRV_TAB==='future'){
    body = future.length? future.map(d=>driverStopCard(d,-1,0,'plain')).join('') : '<div class="card empty">אין נסיעות עתידיות משובצות לך</div>';
    head = '';
  } else if(DRV_TAB==='history'){
    body = history.length? history.map(d=>driverStopCard(d,-1,0,'plain')).join('') : '<div class="card empty">אין היסטוריית נסיעות</div>';
    head = '';
  } else {
    var tot = mine.length + doneT.length;
    head = tot? '<div class="route-prog"><i style="width:'+Math.round(doneT.length/tot*100)+'%"></i></div>' : '';
    /* B34: אם יש נסיעות מתוכננות להיום — המסלול מוצג מקובץ לפי נסיעות */
    var grouped = mine.length? b34GroupByTrips(mine) : null;
    body = (grouped!==null&&grouped!==''? grouped : (mine.length? mine.map((d,i)=>driverStopCard(d,i,mine.length,'open')).join('') : (doneT.length?'<div class="card empty">כל העצירות להיום הושלמו</div>':'<div class="card empty">אין משלוחים להיום במסלול שלך</div>')))+
      (doneT.length? '<div class="muted" style="margin:16px 0 8px;font-size:13px;font-weight:600">הושלמו היום</div>'+doneT.map(d=>driverStopCard(d,-1,0,'done')).join('') : '');
  }
  var cnt = DRV_TAB==='today'? (doneT.length+' מתוך '+(mine.length+doneT.length)+' הושלמו') : (mine.length+' עצירות להיום');
  el('main').innerHTML = '<div class="section-title"><h2>המסלול שלי</h2><span class="muted">'+cnt+'</span></div>'+
    '<div class="row" style="margin:8px 0;gap:6px">'+tb('today','היום',mine.length)+tb('future','עתידי',future.length)+tb('history','היסטוריה','')+'</div>'+head+body;
}
/* B32: כרטיס עצירה לפי שפת העיצוב האחידה.
   mode: 'open' = עצירה פעילה (רצועת סטטוס + פעולות), 'done' = בוצעה היום (מכווץ ומועם),
   'plain' = עתידי/היסטוריה (בלי פעולות). */
function driverStopCard(d,idx,total,mode){
  if(typeof mode!=='string') mode = mode? 'plain' : 'open';
  var o = DB.orders.find(x=>x.id===d.order_id)||{};
  var c = o.customer_id? DB.customers.find(x=>x.id===o.customer_id) : null;
  var addr = c? (c.address||'') : '';
  var wazeUrl = addr? 'https://waze.com/ul?q='+encodeURIComponent(addr)+'&navigate=yes' : '';
  var gmapUrl = addr? 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr) : '';
  var pick = isPickup(d);

  if(mode==='done')
    return '<div class="card stop-done" style="cursor:pointer;padding:11px 15px" onclick="openDelivery(\''+d.id+'\')">'+
      '<div class="row" style="gap:9px;align-items:center"><span style="color:var(--ok);font-size:17px;font-weight:700">✓</span>'+
      '<div class="grow"><div class="lead" style="margin:0">'+esc(c?c.name:'—')+'</div>'+
      '<div class="muted" style="font-size:12.5px">'+esc(d.status)+' · '+esc(pick?'איסוף':'אספקה')+(addr?' · '+esc(addr):'')+'</div></div></div></div>';

  if(mode==='plain')
    return '<div class="card banded"><div class="hdr-band calm"><span class="hb-t">'+esc(d.status)+'</span><span class="hb-s">'+esc(pick?'איסוף':'אספקה')+'</span></div>'+
      '<div class="bd"><div class="lead">'+esc(c?c.name:'—')+'</div>'+
      '<div class="sub">'+esc(d.date||'')+(addr?'<br>'+esc(addr):'')+(d.note?'<br>'+esc(d.note):'')+'</div></div></div>';

  var isNext = idx===0;
  var band = d.status==='בדרך'? '' : 'calm';
  var bandTxt = (d.status==='בדרך'?'בדרך':'מתוכנן')+(isNext?' · העצירה הבאה':'');
  /* פעולה ראשית אחת לפי מצב העצירה — זו הפעולה של הרגע הזה */
  var pri;
  if(d.status!=='בדרך') pri = '<button class="btn pri" onclick="driverMarkTransit(\''+d.id+'\')">יצאתי לדרך</button>';
  else if(!pick) pri = '<button class="btn pri" style="background:var(--ok)" onclick="driverMarkDelivered(\''+d.id+'\')">סימון כנמסר</button>';
  else if(d.photo_url||d.status==='בוצע') pri = '<span class="chip" style="background:var(--ok);color:#fff;flex:1;text-align:center;padding:10px">✔ נאסף — נקלט בשקילה במשרד</span>';
  else pri = '<button class="btn pri" style="background:var(--amber);color:#fff" onclick="driverCollectPickup(\''+d.id+'\')">איסוף — צילום חובה</button>';

  return '<div class="card banded"'+(isNext?' style="border-color:#C3CCD9"':'')+'>'+
    '<div class="hdr-band '+band+'"><span class="hb-t">'+esc(bandTxt)+'</span><span class="hb-s">'+esc(pick?'איסוף':'אספקה')+'</span></div>'+
    '<div class="bd">'+
      '<div class="lead" style="cursor:pointer" onclick="openDelivery(\''+d.id+'\')">'+esc(c?c.name:'—')+'</div>'+
      '<div class="sub">'+esc(addr||'אין כתובת רשומה בכרטיס הלקוח')+
        (d.note?'<br>'+esc(d.note):'')+(d.eta_text?'<br>'+esc(d.eta_text):'')+
        b44ScanLineHtml(d)+'</div>'+
      '<div class="actrow">'+pri+b44ScanBtnHtml(d)+
        (wazeUrl?'<a class="btn ghost sm ico" href="'+wazeUrl+'" target="_blank" rel="noopener" title="ניווט Waze" aria-label="ניווט Waze">➤</a>':'')+
        (c&&c.phone?'<a class="btn ghost sm ico" href="tel:'+encodeURIComponent(c.phone)+'" title="חייג ללקוח" aria-label="חייג ללקוח">✆</a>':'')+
        moreMenu([
          gmapUrl?'<a class="btn" href="'+gmapUrl+'" target="_blank" rel="noopener">ניווט Google Maps</a>':'',
          d.status==='בדרך'?'<button class="btn" onclick="closeMore();driverMarkTransit(\''+d.id+'\')">עדכן סטטוס ללקוח</button>':'',
          '<button class="btn" onclick="closeMore();openDelivery(\''+d.id+'\')">פרטי המשלוח</button>',
          '<button class="btn" onclick="closeMore();driverLogCallForm(\''+d.id+'\')">תיעוד שיחה</button>',
          d.photo_url?'<a class="btn" href="'+esc(d.photo_url)+'" target="_blank">צפה בצילום מסירה</a>':'<button class="btn" onclick="closeMore();deliveryPhoto(\''+d.id+'\')">צילום מסירה</button>',
          d.signature_url?'<a class="btn" href="'+esc(d.signature_url)+'" target="_blank">צפה בחתימה</a>':'',
          total>1&&idx>0?'<button class="btn" onclick="closeMore();driverMove(\''+d.id+'\',-1)">הזז למעלה במסלול</button>':'',
          total>1&&idx<total-1?'<button class="btn" onclick="closeMore();driverMove(\''+d.id+'\',1)">הזז למטה במסלול</button>':'',
          '<button class="btn dng" onclick="closeMore();driverRemoveForm(\''+d.id+'\')">הסר מהמסלול</button>'
        ])+
      '</div>'+
    '</div></div>';
}
/* ============================================================
   B34+B44: סריקת העמסה של הנהג — מארז / חבילה / ברקוד הזמנה / מזהה משלוח.
   לא חוסמת: אפשר לצאת לדרך גם בסריקה חלקית או בלי סריקה בכלל.
   B44: כשיש מארזים משויכים להזמנה — החלון הופך לסריקה מרובה עם מונה "X מתוך Y",
   והחלון נשאר פתוח עד שהנהג סוגר אותו. הסימון 'נסרק' נקבע בשרת בלבד
   (b34LoadScan סופר את המארזים) — הממשק לעולם לא מסמן בעצמו.
   אין מארזים משויכים → סריקה בודדת, בדיוק כמו קודם.
   ============================================================ */
/* המארזים שההזמנה מצפה להם. איסוף מוחרג — כמו בשרת (b44ScanProgress). */
function b44ExpectedCases(d){
  if(!d || !d.order_id || isPickup(d)) return [];
  return (DB.cases||[]).filter(function(c){ return c.active!=='לא' && String(c.order_id||'')===String(d.order_id); });
}
function b44CaseScanned(d, c){ return String(c.delivery_id||'')===String(d.id); }
function b44ScanCounts(d){
  var all = b44ExpectedCases(d);
  return {total: all.length, done: all.filter(function(c){ return b44CaseScanned(d,c); }).length, cases: all};
}
/* שורת מצב הסריקה בתוך כרטיס העצירה */
function b44ScanLineHtml(d){
  var k = b44ScanCounts(d);
  if(d.scan_status==='נסרק')
    return '<br><span style="color:var(--ok);font-weight:600">✓ העמסה נסרקה'+(k.total?' ('+k.total+' מארזים)':'')+'</span>';
  if(k.total && k.done)
    return '<br><span style="color:var(--amber);font-weight:600">סריקה חלקית — '+k.done+' מתוך '+k.total+' מארזים</span>';
  return '';
}
/* כפתור סריקה גלוי בכרטיס העצירה, לצד הפעולה הראשית */
function b44ScanBtnHtml(d){
  if(d.scan_status==='נסרק') return '';
  var k = b44ScanCounts(d);
  return '<button class="btn ghost sm" onclick="b34DriverScanForm(\''+d.id+'\')" title="סריקת העמסה">'+
    'סריקה'+(k.total? ' '+k.done+'/'+k.total : '')+'</button>';
}

function b34DriverScanForm(did){
  var d = (DB.deliveries||[]).find(function(x){ return x.id===did; });
  if(!d) return toast('משלוח לא נמצא', true);
  openModal('<h2>סריקת העמסה</h2><div id="ds_box"></div>');
  b44RenderScan(did);
  setTimeout(function(){ var i=el('ds_bc'); if(i) i.focus(); },100);
}
function b44RenderScan(did){
  var box = el('ds_box'); if(!box) return;
  var d = (DB.deliveries||[]).find(function(x){ return x.id===did; }) || {};
  var k = b44ScanCounts(d);
  var head = k.total
    ? '<div class="row" style="align-items:center;margin-bottom:8px"><b class="grow" style="font-size:16px">'+
        k.done+' מתוך '+k.total+' מארזים</b>'+
        (k.done>=k.total?'<span class="chip" style="background:var(--ok);color:#fff">הושלם</span>':'')+'</div>'+
      '<div style="margin-bottom:10px">'+k.cases.map(function(c){
        var on = b44CaseScanned(d,c);
        return '<div class="row" style="gap:8px;padding:5px 0;align-items:center">'+
          '<span style="font-size:16px;width:18px;color:'+(on?'var(--ok)':'var(--muted)')+'">'+(on?'✓':'○')+'</span>'+
          '<span style="font-weight:'+(on?'600':'400')+'">'+esc(c.barcode)+'</span>'+
          '<span class="muted grow" style="font-size:12.5px">'+esc(c.status||'')+'</span></div>';
      }).join('')+'</div>'+
      '<p class="muted" style="font-size:12.5px">אפשר לצאת לדרך גם בסריקה חלקית — הסריקה אינה חוסמת.</p>'
    : '<p class="muted" style="font-size:13px">סרוק את המארז, חבילה מתוכו, או את ברקוד ההזמנה/המשלוח — לאישור שהמשלוח הנכון עלה לרכב.</p>';
  box.innerHTML = head +
    '<div class="frow"><input id="ds_bc" class="scanbox" placeholder="סרוק או הקלד ברקוד" onkeydown="if(event.key===\'Enter\')b34DoDriverScan(\''+did+'\')"></div>'+
    '<div id="ds_msg" style="min-height:20px;font-size:13px;margin-bottom:6px"></div>'+
    '<div class="row" style="gap:6px">'+
    '<button class="btn grow" onclick="window.FLOOR_CAM=function(t){el(\'ds_bc\').value=t;b34DoDriverScan(\''+did+'\');};startCam()">סרוק במצלמה</button>'+
    '<button class="btn ghost grow" onclick="b34DoDriverScan(\''+did+'\')">אשר</button>'+
    (k.total?'<button class="btn ghost grow" onclick="closeModal();render()">סיום</button>':'')+'</div>';
}
function b44ScanMsg(txt, bad){
  var m = el('ds_msg'); if(!m) return;
  m.innerHTML = '<span style="color:'+(bad?'var(--danger)':'var(--ok)')+';font-weight:600">'+esc(txt)+'</span>';
}
async function b34DoDriverScan(did){
  var inp = el('ds_bc');
  var bc = inp? inp.value.trim() : '';
  if(!bc) return toast('סרוק או הקלד ברקוד', true);
  var d0 = (DB.deliveries||[]).find(function(x){ return x.id===did; }) || {};
  var multi = b44ScanCounts(d0).total > 0;
  /* אזהרה גלויה על סריקה חוזרת של אותו מארז — לא כפילות שקטה */
  var dupe = b44ExpectedCases(d0).find(function(c){
    return (String(c.barcode)===bc || String(c.id)===bc) && b44CaseScanned(d0,c);
  });
  if(dupe){
    if(inp){ inp.value=''; inp.focus(); }
    b44ScanMsg('⚠ המארז '+dupe.barcode+' כבר נסרק למשלוח הזה', true);
    return;
  }
  var r = await api('b34LoadScan',{delivery_id:did, barcode:bc});
  if(inp){ inp.value=''; inp.focus(); }
  if(!r || !r.ok){
    /* ברקוד לא מוכר לא שובר את רצף הסריקה — הודעה בחלון והמשך */
    b44ScanMsg('✕ '+((r&&r.error)||'שגיאת רשת'), true);
    if(!multi) toast((r&&r.error)||'שגיאת רשת', true);
    return;
  }
  /* מצב הסטטוס נקבע בשרת בלבד — כאן רק משקפים אותו כדי שהמסך לא יסתור את הגיליון */
  var d = (DB.deliveries||[]).find(function(x){ return x.id===did; });
  if(d && r.delivery){ d.scan_status = r.delivery.scan_status; d.scan_ack = r.delivery.scan_ack||''; d.scan_by = r.delivery.scan_by||''; }
  var cs = (DB.cases||[]).find(function(c){ return String(c.barcode)===bc || String(c.id)===bc; });
  if(cs && d){ cs.delivery_id = d.id; if(d.order_id && !cs.order_id){ cs.order_id = d.order_id; cs.status='משויך'; } }
  if(!multi){ closeModal(); toast('✓ נסרק: '+(r.label||'')); render(); return; }
  b44ScanMsg('✓ '+(r.label||'נסרק')+(r.expected? ' · '+r.scanned+' מתוך '+r.expected : ''));
  b44RenderScan(did);
  var i2 = el('ds_bc'); if(i2) i2.focus();
  if(r.complete) toast('✓ כל המארזים נסרקו');
}
/* B34: קיבוץ מסלול הנהג לפי נסיעות מתוכננות (delivery_trips) */
function b34TripHeader(tr){
  var v = tr.vehicle_id? (DB.vehicles||[]).find(x=>x.id===tr.vehicle_id) : null;
  return '<div class="muted" style="margin:14px 0 6px;font-size:13.5px;font-weight:700">🚚 נסיעה '+esc(tr.seq||'')+
    (tr.planned_time?' · יציאה '+esc(tr.planned_time):'')+(v?' · '+esc(v.plate||''):'')+
    (tr.status && tr.status!=='מתוכננת'?' · '+esc(tr.status):'')+'</div>';
}
function b34GroupByTrips(mine){
  var t = todayYMD();
  var myTrips = (DB.deliveryTrips||[]).filter(x=>String(x.date)===t && x.status!=='בוטלה')
    .sort((a,b)=>Number(a.seq||0)-Number(b.seq||0));
  if(!myTrips.length || !mine.some(d=>d.trip_id)) return null;
  var html = '';
  myTrips.forEach(function(tr){
    var stops = mine.filter(d=>String(d.trip_id)===String(tr.id))
      .sort((a,b)=>(Number(a.trip_order)||999)-(Number(b.trip_order)||999));
    if(!stops.length) return;
    html += b34TripHeader(tr) + stops.map((d,i)=>driverStopCard(d,mine.indexOf(d)===0?0:1,stops.length,'open')).join('');
  });
  var loose = mine.filter(d=>!d.trip_id || !myTrips.some(tr=>String(tr.id)===String(d.trip_id)));
  if(loose.length) html += '<div class="muted" style="margin:14px 0 6px;font-size:13.5px;font-weight:700">ללא נסיעה</div>'+
    loose.map((d,i)=>driverStopCard(d,mine.indexOf(d)===0?0:1,loose.length,'open')).join('');
  return html;
}
async function driverMove(did,delta){
  var mine = b5MyRoute();
  var idx = mine.findIndex(d=>d.id===did), swapIdx = idx+delta;
  if(idx<0||swapIdx<0||swapIdx>=mine.length) return;
  var tmp = mine[idx]; mine[idx]=mine[swapIdx]; mine[swapIdx]=tmp;
  await act('b5SetRoute',{ids:mine.map(d=>d.id)},'סדר המסלול עודכן');
}
async function driverMarkTransit(did){
  var r = await act('b5MarkInTransit',{delivery_id:did},'הסטטוס עודכן — הלקוח קיבל התראה');
}
/* B30: איסוף מפות אצל הלקוח — צילום חובה לפני העמסה, ואז המשלוח מסומן "נאסף — בדרך חזרה".
   הקליטה הסופית נשארת במשרד עם שקילה (receiveReturn) — כאן רק תיעוד האיסוף בשטח. */
function driverCollectPickup(did){
  var d = DB.deliveries.find(x=>x.id===did); if(!d) return;
  var inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.onchange = async function(){
    var f = inp.files[0]; if(!f) return;
    if(f.size > 4*1024*1024) return toast('הקובץ גדול מ-4MB — צלם באיכות נמוכה יותר', true);
    toast('מעלה צילום איסוף...');

function sigInit(){
  var cv = el('sigPad');
  var rect = cv.getBoundingClientRect();
  cv.width = Math.max(280, Math.round(rect.width));
  cv.height = 220;
  SIG_CTX = cv.getContext('2d');
  SIG_CTX.lineWidth = 2.4; SIG_CTX.lineCap = 'round'; SIG_CTX.lineJoin = 'round'; SIG_CTX.strokeStyle = '#1F2A44';
  SIG_HAS_INK = false; SIG_DRAWING = false; SIG_LAST = null;
  function pos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  cv.onpointerdown = function(e){ SIG_DRAWING=true; SIG_LAST=pos(e); try{cv.setPointerCapture(e.pointerId);}catch(ex){} };
  cv.onpointermove = function(e){
    if(!SIG_DRAWING) return;
    var p = pos(e);
    SIG_CTX.beginPath(); SIG_CTX.moveTo(SIG_LAST.x,SIG_LAST.y); SIG_CTX.lineTo(p.x,p.y); SIG_CTX.stroke();
    SIG_LAST = p; SIG_HAS_INK = true;
  };
  cv.onpointerup = function(){ SIG_DRAWING=false; };
  cv.onpointerleave = function(){ SIG_DRAWING=false; };
}
function sigClear(){
  if(!SIG_CTX) return;
  var cv = el('sigPad');
  SIG_CTX.clearRect(0,0,cv.width,cv.height);
  SIG_HAS_INK = false;
}
async function sigSave(did){

/* ================= B43: מועדי תשלום · תזרים דו-כיווני =================
   תמונת מצב אחת: מה אמור להיכנס ומה אמור לצאת, ומתי — עם הבלטה של מה שכבר עבר את המועד.
   כל החישוב מקומי מנתונים שכבר טעונים ב-DB; לא נוספה שום קריאת שרת.
   ⚠ לוגיקת התנאים כאן חייבת להישאר זהה ל-b43NormTerms/b43DueFrom שבשרת. */
var B43_TERMS_PRESETS = ['מזומן','שוטף','שוטף+30','שוטף+60','שוטף+90'];
var B43_RANGE = '30';   // 'due' = באיחור והיום · '7' · '30' · 'all'

function b43IsYmd(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v||'')); }
function b43NormTerms(v){
  var s = String(v==null?'':v).replace(/\s+/g,'');
  if(!s) return '';
  if(s==='מזומן'||s==='מיידי') return 'מזומן';
  if(s==='שוטף') return 'שוטף';
  var m = s.match(/^שוטף\+?(\d{1,3})$/);
  if(m) return 'שוטף+'+Number(m[1]);
  m = s.match(/^(?:נטו|net)?\+?(\d{1,3})(?:יום|ימים|days?)?$/i);
  if(m) return 'שוטף+'+Number(m[1]);
  return '';
}
function b43FmtD(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
/* מועד פירעון = תאריך המסמך + תנאי התשלום. מזומן=אותו יום · שוטף=סוף החודש · שוטף+N=סוף החודש+N ימים */
function b43DueFrom(docDate, terms){
  var ds = String(docDate||'').slice(0,10);
  if(!b43IsYmd(ds)) return '';
  var t = b43NormTerms(terms) || 'שוטף+30';
  if(t==='מזומן') return ds;
  var pr = ds.split('-');
  var d = new Date(Number(pr[0]), Number(pr[1]), 0);   // יום 0 של החודש הבא = סוף החודש הנוכחי
  var m = t.match(/^שוטף\+(\d+)$/);
  if(m) d.setDate(d.getDate()+Number(m[1]));
  return b43FmtD(d);
}
function b43DefaultTerms(){ return b43NormTerms(setting('default_payment_terms')) || 'שוטף+30'; }
function b43CustTerms(cid){
  var c = (DB.customers||[]).find(x=>x.id===cid);
  return b43NormTerms(c && c.payment_terms) || b43DefaultTerms();
}

/* ---- בורר תנאי תשלום: רשימה סגורה + "אחר" עם מספר ימים חופשי ---- */
function b43TermsField(idBase, cur, label){
  var t = b43NormTerms(cur) || b43DefaultTerms();
  var isPreset = B43_TERMS_PRESETS.indexOf(t) > -1;

}

/* ---- שני הצדדים ---- */
/* נכנס: כל יתרה פתוחה של לקוח עם מועד הפירעון שלה.
   דריסה ידנית של מנהל יושבת על החשבונית אם קיימת, אחרת על ההזמנה. */
function b43ReceivablesFE(){
  var rows = [];
  (DB.orders||[]).filter(o=>!['בוטלה','טיוטה','הצעת מחיר'].includes(o.status)).forEach(function(o){
    var bal = Math.round(orderBalance(o.id)*100)/100;
    if(!(bal>0.01)) return;
    var inv = (DB.invoices||[]).find(v=>v.order_id===o.id && v.status!=='בוטלה');
    var host = inv||o;
    var docDate = String((inv? inv.date : (o.end_date||o.start_date||o.created_at))||'').slice(0,10);
    var terms = b43CustTerms(o.customer_id), over = b43IsYmd(host.due_date);
    rows.push({ side:'in', entity_type: inv?'invoice':'order', entity_id: host.id,
      label: inv? ('חשבונית '+inv.number) : ('הזמנה '+(o.order_number||o.id)),
      who: cust(o.customer_id), customer_id: o.customer_id, order_id: o.id, invoice_id: inv?inv.id:'',
      doc_date: docDate, terms: terms, overridden: over,
      due_date: over? String(host.due_date) : b43DueFrom(docDate, terms), amount: bal });
  });
  (DB.invoices||[]).filter(v=>!v.order_id && v.status!=='בוטלה').forEach(function(v){
    var paid = (DB.payments||[]).filter(p=>p.invoice_id===v.id).reduce((s,p)=>s+Number(p.amount||0),0);
    var bal = Math.round((Number(v.total||0)-paid)*100)/100;
    if(!(bal>0.01)) return;
    var docDate = String(v.date||'').slice(0,10);
    var terms = b43CustTerms(v.customer_id), over = b43IsYmd(v.due_date);
    rows.push({ side:'in', entity_type:'invoice', entity_id: v.id,
      label:'חשבונית '+v.number, who: cust(v.customer_id), customer_id: v.customer_id, order_id:'', invoice_id: v.id,
      doc_date: docDate, terms: terms, overridden: over,
      due_date: over? String(v.due_date) : b43DueFrom(docDate, terms), amount: bal });
  });
  return rows;
}
/* יוצא: ההוצאות העתידיות הפתוחות — אותו מקור בדיוק שמסך "הוצאות עתידיות" עובד מולו */
function b43PayablesFE(){
  return fexpOpen().map(function(x){
    var emp = x.employee_id? (DB.employees||[]).find(e=>e.id===x.employee_id) : null;
    return { side:'out', entity_type:'future_expense', entity_id:x.id, source:x.source||'',
      label: x.description || (x.source==='payroll'?'יתרת שכר לתשלום':(x.category||'')),
      who: x.supplier_id? supp(x.supplier_id) : (emp? emp.name : (x.category||'')),
      urgency: x.urgency||'רגיל', overridden:false, terms:'',
      due_date: b43IsYmd(x.due_date)? String(x.due_date):'', amount: fexpRemain(x) };
  }).filter(r=>r.amount>0.01);
}
function b43Bucket(due, t, wk, m30){
  if(!due) return 'nodate';
  if(due < t) return 'overdue';
  if(due === t) return 'today';
  if(due <= wk) return 'week';
  if(due <= m30) return 'month';
  return 'later';
}
function b43Split(rows){
  var t = ymdLocal(), wk = ymdLocal(new Date(Date.now()+6*864e5)), m30 = ymdLocal(new Date(Date.now()+30*864e5));
  var out = {overdue:[],today:[],week:[],month:[],later:[],nodate:[]};
  rows.forEach(function(r){ out[b43Bucket(r.due_date,t,wk,m30)].push(r); });
  return out;
}
function b43Sum(list){ return Math.round(list.reduce((s,r)=>s+Number(r.amount||0),0)*100)/100; }
function b43InRange(r){
  var t = ymdLocal();
  if(B43_RANGE==='all') return true;
  if(!r.due_date) return false;
  if(B43_RANGE==='due') return r.due_date<=t;
  return r.due_date <= ymdLocal(new Date(Date.now()+Number(B43_RANGE)*864e5));
}
function setB43Range(v){ B43_RANGE=v; render(); }

/* ---- שינוי מועד (מנהל בלבד, סיבה חובה, נרשם ביומן ובאודיט) ---- */
function b43FindRec(etype,id){
  if(etype==='future_expense') return fexpAll().find(x=>x.id===id);
  if(etype==='invoice') return (DB.invoices||[]).find(x=>x.id===id);
  return (DB.orders||[]).find(x=>x.id===id);
}
function b43DueForm(etype,id){
  if(ROLE!=='מנהל') return toast('שינוי מועד תשלום מותר למנהל בלבד', true);
  var rec = b43FindRec(etype,id); if(!rec) return toast('רשומה לא נמצאה', true);
  var cur = '', ttl = '', sub = '';
  if(etype==='future_expense'){
    cur = b43IsYmd(rec.due_date)? rec.due_date : '';
    ttl = 'שינוי מועד תשלום לספק';
    sub = (rec.category||'')+' · '+(rec.description||'')+(rec.supplier_id?' · '+supp(rec.supplier_id):'')+' · '+ils(fexpRemain(rec));
  } else {
    var docDate = etype==='invoice'? String(rec.date||'').slice(0,10) : String(rec.end_date||rec.start_date||rec.created_at||'').slice(0,10);
    var terms = b43CustTerms(rec.customer_id);
    cur = b43IsYmd(rec.due_date)? rec.due_date : b43DueFrom(docDate, terms);
    ttl = 'שינוי מועד פירעון';
    sub = (etype==='invoice'? 'חשבונית '+(rec.number||'') : 'הזמנה '+(rec.order_number||rec.id))+' · '+cust(rec.customer_id)+
      ' · תאריך מסמך '+esc(docDate)+' · תנאי תשלום '+esc(terms)+(b43IsYmd(rec.due_date)?'':' (מועד מחושב)');
  }
  openModal('<h2>'+esc(ttl)+'</h2>'+
    '<div class="muted" style="margin-bottom:8px">'+esc(sub)+'</div>'+
    '<div class="frow"><label>מועד נוכחי</label><input value="'+esc(cur||'—')+'" disabled></div>'+
    '<div class="frow"><label>מועד חדש</label><input id="b43_due" type="date" value="'+esc(cur||ymdLocal())+'"></div>'+
    '<div class="frow"><label>סיבת השינוי (חובה)</label><input id="b43_reason" placeholder="למשל: סוכם טלפונית עם הלקוח על דחייה לחודש הבא"></div>'+
    '<div class="muted" style="font-size:11.5px;margin:6px 0">השינוי נרשם ביומן שינויי המועד עם שמך, המועד הקודם והסיבה, וגם ביומן הפעולות.</div>'+
    '<button class="btn" onclick="b43SaveDue(\''+etype+'\',\''+id+'\')">שמור מועד</button>');
}
async function b43SaveDue(etype,id){
  var d = el('b43_due').value, rsn = (el('b43_reason').value||'').trim();
  if(!b43IsYmd(d)) return toast('חובה לבחור תאריך', true);
  if(!rsn) return toast('חובה לפרט סיבה', true);
  var r = await act('b43SetDueDate',{entity_type:etype, id:id, due_date:d, reason:rsn},'המועד עודכן');
  if(r) closeModal();
}

/* ---- הבאנר בלוח הבקרה ---- */
function b43DashBanner(t){
  if(!allowedViews().some(v=>v[0]==='finance')) return '';
  var rec = b43ReceivablesFE(), pay = b43PayablesFE();
  var payOver = pay.filter(r=>r.due_date && r.due_date<t), payToday = pay.filter(r=>r.due_date===t);
  var recOver = rec.filter(r=>r.due_date && r.due_date<t), recToday = rec.filter(r=>r.due_date===t);
  if(!payOver.length && !payToday.length && !recOver.length && !recToday.length) return '';
  var names = function(list){
    var seen = {}, out = [];
    list.forEach(function(x){ var n=x.who||''; if(n && !seen[n]){ seen[n]=1; out.push(n); } });
    return out.slice(0,3).join(' · ') + (out.length>3? ' ועוד '+(out.length-3) : '');
  };
  var seg = function(icon,label,list,color){
    if(!list.length) return '';
    return '<div class="row" style="padding:4px 0;align-items:baseline;gap:6px">'+
      '<span style="color:'+color+';font-weight:800">'+icon+' '+label+'</span>'+
      '<b style="color:'+color+'">'+ils(b43Sum(list))+'</b>'+
      '<span class="muted" style="font-size:12px">'+esc(names(list))+'</span></div>';
  };
  return '<div class="card" style="border-right:6px solid var(--danger);background:#FFF8F8;margin-bottom:14px;cursor:pointer" '+
      'onclick="goFin(\'flow\')" title="לחץ למסך תזרים ותשלומים">'+
    '<div class="row" style="align-items:center;margin-bottom:4px"><h3 class="grow" style="margin:0">מה דורש טיפול כספי היום</h3>'+
      '<span class="muted" style="font-size:12px">לחץ לפירוט מלא</span></div>'+
    seg('⚠','תשלומים באיחור:',payOver,'var(--danger)')+
    seg('📅','לשלם היום:',payToday,'#8a5a1f')+
    seg('⚠','חובות לקוחות שעברו מועד:',recOver,'var(--danger)')+
    seg('📅','אמור להתקבל היום:',recToday,'#8a5a1f')+
    '</div>';
}

/* ---- המסך ---- */
function b43FlowHtml(){
  var t = ymdLocal();
  var rec = b43ReceivablesFE(), pay = b43PayablesFE();
  var sIn = b43Split(rec), sOut = b43Split(pay);
  var line = function(l,list,color){
    if(!list.length) return '';
    return '<div class="row" style="padding:6px 2px;border-bottom:1px solid #EEF1F5">'+
      '<span class="grow"'+(color?' style="color:'+color+';font-weight:700"':'')+'>'+l+
      ' <span class="muted" style="font-weight:400;font-size:11.5px">('+list.length+')</span></span>'+
      '<b'+(color?' style="color:'+color+'"':'')+'>'+ils(b43Sum(list))+'</b></div>';
  };
  var sideCard = function(title, sp, tone){
    var all = sp.overdue.concat(sp.today,sp.week,sp.month,sp.later,sp.nodate);
    var tot = b43Sum(all);
    return '<div class="card" style="border-right:5px solid '+tone+'">'+
      '<div class="row" style="align-items:center;margin-bottom:6px"><h3 class="grow" style="margin:0">'+title+'</h3>'+
      '<span class="tot" style="font-size:20px">'+ils(tot)+'</span></div>'+
      (all.length?
        line('באיחור', sp.overdue, 'var(--danger)')+
        line('היום', sp.today, '#8a5a1f')+
        line('7 הימים הקרובים', sp.week, '')+
        line('עד 30 יום', sp.month, '')+
        line('מאוחר יותר', sp.later, '')+
        line('ללא מועד', sp.nodate, 'var(--amber)')
        : '<div class="empty">אין יתרות פתוחות</div>')+'</div>';
  };
  var net30 = Math.round((b43Sum(sIn.overdue.concat(sIn.today,sIn.week,sIn.month)) -
                          b43Sum(sOut.overdue.concat(sOut.today,sOut.week,sOut.month)))*100)/100;

  var ranges = [['due','באיחור והיום'],['7','7 ימים'],['30','30 יום'],['all','הכל']];
  var bar = '<div class="card"><div class="row" style="flex-wrap:wrap;gap:6px;align-items:center">'+
    '<b style="margin-left:4px">טווח בטבלאות:</b>'+
    ranges.map(r=>'<button class="btn '+(B43_RANGE===r[0]?'':'ghost ')+'sm" onclick="setB43Range(\''+r[0]+'\')">'+r[1]+'</button>').join('')+
    '</div></div>';

  var rowHtml = function(r){
    var late = !!(r.due_date && r.due_date<t), isToday = r.due_date===t;
    var col = late? 'var(--danger)' : (isToday? '#8a5a1f' : '');
    var days = r.due_date? Math.round((new Date(r.due_date).getTime()-new Date(t).getTime())/864e5) : 0;
    var when = !r.due_date? '<span style="color:var(--amber)">ללא מועד</span>'
      : esc(r.due_date)+(late? '<div style="font-size:11px;color:var(--danger)">⚠ '+Math.abs(days)+' ימי איחור</div>'
        : (isToday? '<div style="font-size:11px;color:#8a5a1f">היום</div>' : ''));
    var acts = '';
    if(r.side==='in'){
      if(CAN_EDIT) acts += '<button class="btn sm" onclick="collectPayForm(\''+r.customer_id+'\',\''+(r.order_id?'order':'invoice')+'\',\''+(r.order_id||r.invoice_id)+'\')">גבה</button>';
    } else {
      acts += (r.source==='payroll'? '<button class="btn ghost sm" onclick="go(\'payroll\')">מסך שכר</button>'
        : '<button class="btn sm" onclick="payFexpForm(\''+r.entity_id+'\')">תשלום</button>');
    }
    if(ROLE==='מנהל') acts += '<button class="btn ghost sm" onclick="b43DueForm(\''+r.entity_type+'\',\''+r.entity_id+'\')">שנה מועד</button>';
    acts += b43HistBtn(r.entity_type, r.entity_id);
    var note = r.overridden? ' <span class="muted" style="font-size:11px">· מועד נקבע ידנית</span>'
      : (r.terms? ' <span class="muted" style="font-size:11px">· '+esc(r.terms)+'</span>' : '');
    return '<tr'+(late?' style="background:#FFF5F5"':'')+'>'+
      '<td style="white-space:nowrap;color:'+col+';font-weight:'+(late||isToday?'700':'400')+'">'+when+'</td>'+
      '<td>'+esc(r.who||'')+'</td>'+
      '<td>'+esc(r.label||'')+note+'</td>'+
      '<td class="tot" style="white-space:nowrap">'+ils(r.amount)+'</td>'+
      '<td><div class="row" style="gap:4px;flex-wrap:nowrap">'+acts+'</div></td></tr>';
  };
  var table = function(title, rows, empty){
    var list = rows.filter(b43InRange).slice()
      .sort(function(a,b){ return String(a.due_date||'9999-12-31').localeCompare(String(b.due_date||'9999-12-31')); });
    return '<h3 style="margin:14px 0 8px">'+title+
      ' <span class="muted" style="font-weight:400;font-size:12.5px">· '+list.length+' רשומות · '+ils(b43Sum(list))+'</span></h3>'+
      (list.length? '<div class="card"><table><tr><th>מועד</th><th>מי</th><th>מסמך / תיאור</th><th>סכום</th><th></th></tr>'+
        list.map(rowHtml).join('')+'</table></div>' : '<div class="card empty">'+esc(empty)+'</div>');
  };

  return '<div class="chartgrid" style="margin-bottom:12px">'+
      sideCard('צפוי להיכנס — חובות לקוחות', sIn, 'var(--teal,#1f7a6b)')+
      sideCard('צפוי לצאת — ספקים, שכר והוצאות', sOut, 'var(--danger)')+
    '</div>'+
    '<div class="card" style="margin-bottom:12px"><div class="row" style="align-items:center;flex-wrap:wrap;gap:8px">'+
      '<div class="grow"><b>מאזן צפוי ל-30 הימים הקרובים</b>'+
      '<div class="muted" style="font-size:12px">כולל את מה שכבר עבר את המועד. אינו כולל יתרות ללא מועד.</div></div>'+
      '<div style="font-size:22px;font-weight:800;color:'+(net30>=0?'var(--ink)':'var(--danger)')+'">'+ils(net30)+'</div>'+
    '</div></div>'+
    bar+
    table('לגבייה — לפי מועד פירעון', rec, 'אין יתרות לגבייה בטווח שנבחר')+
    table('לתשלום — לפי מועד היעד', pay, 'אין תשלומים בטווח שנבחר')+
    '<div class="muted" style="font-size:12px;margin-top:8px">מועד הפירעון של חוב לקוח מחושב מתאריך המסמך ומתנאי התשלום שבכרטיס הלקוח. מנהל רשאי לדחות או להקדים מועד — כל שינוי נרשם עם שם המשנה, המועד הקודם והסיבה, וניתן לצפייה בכפתור 🕘 שבשורה.</div>';
}

// הכנסות החודש — החשבוניות שמרכיבות את הסכום (לפני מע"מ)

      '<td class="tot">'+ils(x.b)+'</td></tr>').join(''),
    tot, 'אין יתרות פתוחות לספקים');
}

function isCashMethod(m){ return String(m||'').indexOf('מזומן')>-1; }
function cashBalanceFE(){
  var inn = (DB.payments||[]).reduce((s,x)=>s+(isCashMethod(x.method)?Number(x.amount||0):0),0);
  var outE = (DB.expensePayments||[]).reduce((s,x)=>s+(isCashMethod(x.method)?Number(x.amount||0):0),0);
  var outP = (DB.payrollPayments||[]).reduce((s,x)=>s+(isCashMethod(x.method)?Number(x.amount||0):0),0);
  var outC = (DB.cashMoves||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  return Math.round((inn-outE-outP-outC)*100)/100;
}
var COL_MONTH = '';

    '<div class="gridkpi" style="margin-bottom:12px">'+

      box(ils(sum(bank)),'בנק / אשראי / העברות',"colPayList('bank')",'var(--teal,#1f7a6b)')+
      box(ils(sum(cash)),'מזומן שנגבה החודש',"colPayList('cash')",'#8a5a1f')+
    '</div>'+

      '<div style="font-size:22px;font-weight:800;color:'+(bal>0?'var(--ink)':'var(--muted)')+'">'+ils(bal)+'</div>'+

/* B30: פירוט הגביה — רשימת הקבלות שמרכיבות את הסכום. לחיצה על שורה פותחת את הקבלה. */
function colPayList(which){
  var pays = colPays().filter(p=> which==='all' || (which==='cash'?isCashMethod(p.method):!isCashMethod(p.method)));

        var pcid=p.customer_id||(o?o.customer_id:(vI?vI.customer_id:''));
        return '<tr style="cursor:pointer" onclick="closeModal();openReceipt(\''+p.id+'\')"><td><b style="color:var(--navy2);text-decoration:underline">'+esc(p.receipt_number)+'</b></td><td>'+esc(p.date)+'</td><td>'+esc(cust(pcid))+'</td><td>'+ils(p.amount)+'</td><td>'+esc(p.method)+'</td></tr>';
      }).join('')+
      '<tr><td colspan="3"><b>סה"כ</b></td><td colspan="2"><b>'+ils(tot)+'</b></td></tr></table></div>'
      +'<div class="muted" style="font-size:12px;margin-top:6px">לחיצה על שורה פותחת את הקבלה.</div>'

/* B30: תנועת קופה — הפקדה לבנק / תשלום מהקופה (מנהל בלבד, אכיפה גם בשרת) */
function cashMoveForm(type){
  var bal = cashBalanceFE();
  if(bal<=0) return toast('אין יתרת מזומן בקופה', true);

async function saveCashMove(type){

  if(r){ if(r.row) (DB.cashMoves=DB.cashMoves||[]).push(r.row); closeModal(); render(); }

/* B20: הוצאות עתידיות — שכר שאושר וטרם שולם + הוצאות מתוכננות אחרות.
   B28: תאריך יעד חובה, פילטרים לפי טווח זמן, פירוט הסכום הכולל, ומחיקה רכה עם סיבה. */
var FEXP_RANGE = 'all', FEXP_UNTIL = '', FEXP_SHOWDEL = false;

// כל ההוצאות העתידיות שאינן מחוקות (מחיקה רכה מסתירה מכל תצוגה וחישוב)
function fexpAll(){ return (DB.futureExpenses||[]).filter(x=>String(x.deleted||'')!=='כן'); }
function fexpDeleted(){ return (DB.futureExpenses||[]).filter(x=>String(x.deleted||'')==='כן'); }
function fexpOpen(){ return fexpAll().filter(x=>x.status!=='שולם'); }
// האם רשומה נכנסת לטווח הזמן שנבחר. רשומה בלי תאריך יעד לא נכנסת לאף טווח.
function fexpInRange(x){
  if(FEXP_RANGE==='all') return true;
  if(!x.due_date) return false;
  var lim;
  if(FEXP_RANGE==='until'){ if(!FEXP_UNTIL) return true; lim = FEXP_UNTIL; }
  else lim = ymdLocal(new Date(Date.now()+Number(FEXP_RANGE)*864e5));
  return x.due_date <= lim;
}
function fexpRangeLabel(){
  if(FEXP_RANGE==='all') return 'הכל';
  if(FEXP_RANGE==='until') return FEXP_UNTIL? 'עד '+FEXP_UNTIL : 'עד תאריך';
  return 'עד '+FEXP_RANGE+' יום';
}
function setFexpRange(r){ FEXP_RANGE=r; if(r!=='until') FEXP_UNTIL=''; render(); }
function setFexpUntil(v){ FEXP_UNTIL=v; FEXP_RANGE='until'; render(); }

function futureExpensesHtml(){
  var URG_ORDER = {'קריטי':0,'דחוף':1,'רגיל':2};
  var URG_COLOR = {'קריטי':'var(--danger)','דחוף':'var(--amber)','רגיל':'var(--muted)'};
  var openAll = fexpOpen();
  // B31: "הכל" מציג את כל הסכום, כולל רשומות ללא תאריך יעד. הסינון מתחיל רק לאחר בחירת טווח/תאריך.
  var allMode = (FEXP_RANGE==='all');
  var noDate  = allMode? [] : openAll.filter(x=>!x.due_date);
  var withDate= allMode? openAll.slice() : openAll.filter(x=>x.due_date && fexpInRange(x));
  var paid = fexpAll().filter(x=>x.status==='שולם');
  withDate.sort(function(a,b){
    var u = (URG_ORDER[a.urgency]||9)-(URG_ORDER[b.urgency]||9);

        /* B43: דחייה/הקדמה של מועד קיים — מנהל בלבד, עם סיבה, ונרשם ביומן */
        (x.due_date&&ROLE==='מנהל'&&x.status!=='שולם'?' <button class="btn ghost sm" onclick="b43DueForm(\'future_expense\',\''+x.id+'\')">שנה</button>':'')+

        (ROLE==='מנהל' && fexpPaid(x.id)<=0 ?'<button class="btn danger sm" onclick="fexpDeleteForm(\''+x.id+'\')">מחק</button>':''))+
      '</div></td>'+

  var HEAD = '<tr><th>דחיפות</th><th>קטגוריה</th><th>תיאור</th><th>תאריך יעד</th><th>סכום</th><th>שולם</th><th>יתרה</th><th></th></tr>';
  var totalRange = withDate.reduce((s,x)=>s+fexpRemain(x),0);
  var totalNoDate = noDate.reduce((s,x)=>s+fexpRemain(x),0);

  var ranges = [['all','הכל'],['30','עד 30 יום'],['60','עד 60 יום'],['90','עד 90 יום']];
  var filterBar = '<div class="card"><div class="row" style="flex-wrap:wrap;gap:6px;align-items:center">'+
    '<b style="margin-left:4px">טווח זמן:</b>'+
    ranges.map(r=>'<button class="btn '+(FEXP_RANGE===r[0]?'':'ghost ')+'sm" onclick="setFexpRange(\''+r[0]+'\')">'+r[1]+'</button>').join('')+
    '<span style="margin-right:6px">עד תאריך:</span>'+
    '<input type="date" value="'+esc(FEXP_UNTIL)+'" onchange="setFexpUntil(this.value)" style="max-width:165px">'+
    '</div></div>';

  var totalCard = '<div class="card" style="cursor:pointer" onclick="fexpTotalBreakdown()" title="לחץ לפירוט">'+
    '<div class="row" style="align-items:center;flex-wrap:wrap">'+
    '<b class="grow">סה"כ צפוי לתשלום · '+esc(fexpRangeLabel())+'</b>'+
    '<span class="tot" style="font-size:20px;text-decoration:underline">'+ils(totalRange)+'</span></div>'+
    '<div class="muted" style="font-size:12px;margin-top:4px">'+withDate.length+' רשומות · לחץ לפירוט מלא</div></div>';

  var noDateCard = noDate.length?

    '<div class="card"><div class="muted" style="font-size:12px;margin-bottom:6px">רשומות שנוצרו לפני שהתאריך הפך לשדה חובה. הן אינן נכנסות לאף טווח זמן עד שיושלם התאריך.</div>'+
    '<table>'+HEAD+noDate.map(row).join('')+'</table></div>' : '';

  var delCard = '';
  if(FEXP_SHOWDEL){

    delCard = '<h3 style="margin:14px 0 8px">הוצאות שנמחקו</h3>'+

        dl.map(x=>'<tr style="opacity:.6"><td>'+esc(x.category)+'</td><td>'+esc(x.description||'')+'</td><td>'+ils(x.amount)+'</td>'+

        '</table></div>' : '<div class="card empty">אין הוצאות שנמחקו</div>');
  }

  return filterBar + totalCard +
    (withDate.length? '<div class="card"><table>'+HEAD+withDate.map(row).join('')+'</table></div>'

    noDateCard +
    (paid.length? '<h3 style="margin:14px 0 8px">שולמו</h3><div class="card"><table><tr><th>קטגוריה</th><th>תיאור</th><th>סכום</th><th></th></tr>'+

// B28: פירוט מלא של הסכום "סה"כ צפוי לתשלום" — שורה לכל רשומה שמרכיבה אותו

    (list.length? '<div class="card"><table><tr><th>תאריך יעד</th><th>קטגוריה</th><th>תיאור</th><th>יתרה</th><th></th></tr>'+
      list.map(function(x){
        var overdue = x.due_date && x.due_date < today;
        return '<tr><td'+(overdue?' style="color:var(--danger);font-weight:700"':'')+'>'+esc(x.due_date||'ללא תאריך')+(overdue?' ⚠':'')+'</td>'+
          '<td>'+esc(x.category)+(x.supplier_id?'<div class="muted" style="font-size:11.5px">'+esc(supp(x.supplier_id))+'</div>':'')+'</td>'+

// פירוט הוצאה עתידית — מה מרכיב את הסכום, מה שולם, ומה נשאר
function fexpBreakdown(id){
  var fe = fexpAll().find(x=>x.id===id); if(!fe) return;
  var paid = fexpPaid(id), rem = fexpRemain(fe);
  var pays = (DB.expensePayments||[]).filter(x=>x.fexp_id===id).slice().reverse();
  var net = Math.round((Number(fe.amount||0)-Number(fe.vat_amount||0))*100)/100;
  var pur = fe.source==='purchase' ? (DB.purchases||[]).find(x=>x.id===fe.ref_id) : null;
  var lines = pur ? (DB.purchaseLines||[]).filter(l=>l.purchase_id===pur.id) : [];
  var rows = '';
  if(lines.length){
    rows += lines.map(function(l){
      return '<tr><td>'+esc(item(l.item_id))+' <span class="muted">× '+esc(l.qty)+'</span>'+
        '<div class="muted" style="font-size:11.5px">'+ils(l.unit_cost)+' ליחידה</div></td>'+
        '<td>'+ils(Number(l.qty)*Number(l.unit_cost))+'</td></tr>';
    }).join('');
    rows += '<tr><td>סה"כ לפני מע"מ</td><td>'+ils(net)+'</td></tr>';
  } else {
    rows += '<tr><td>'+esc(fe.description||fe.category)+'</td><td>'+ils(net)+'</td></tr>';
  }
  if(Number(fe.vat_amount)) rows += '<tr><td>מע"מ</td><td>'+ils(fe.vat_amount)+'</td></tr>';
  openModal('<h2>פירוט — '+esc(fe.category||'')+'</h2>'+
    '<div class="muted" style="margin-bottom:8px">'+esc(fe.description||'')+
      (fe.supplier_id?' · ספק '+esc(supp(fe.supplier_id)):'')+' · סטטוס '+esc(fe.status||'')+'</div>'+
    '<div class="card"><table><tr><th>רכיב</th><th>סכום</th></tr>'+rows+
      '<tr><td><b>סה"כ לתשלום</b></td><td class="tot"><b>'+ils(fe.amount)+'</b></td></tr>'+
      '<tr><td>שולם</td><td>'+ils(paid)+'</td></tr>'+
      '<tr><td><b>יתרה</b></td><td'+(rem>0.01?' style="color:var(--danger);font-weight:700"':'')+'>'+ils(rem)+'</td></tr>'+
      '</table></div>'+
    (pays.length?'<h3 style="margin:12px 0 6px">תשלומים שבוצעו</h3><div class="card"><table><tr><th>תאריך</th><th>סכום</th><th>אמצעי</th><th>פירוט</th><th>אסמכתאות</th></tr>'+
      pays.map(function(x){
        var d = payDocsOf('expense',x.id);
        return '<tr><td>'+esc(x.paid_at)+'</td><td>'+ils(x.amount)+'</td><td>'+esc(x.method||'')+'</td><td>'+esc(x.note||'')+'</td>'+
          '<td><button class="btn ghost sm" onclick="payDocsForm(\'expense\',\''+x.id+'\',\'fexp\',\''+id+'\')">'+(d.length?d.length+' מצורפות':'הוסף')+'</button></td></tr>';
      }).join('')+'</table></div>':'')+
    '<div class="row" style="margin-top:10px;gap:6px">'+
      (rem>0.01?'<button class="btn" onclick="payFexpForm(\''+id+'\')">רשום תשלום</button>':'<span class="muted">שולם במלואו.</span>')+
      (fe.supplier_id?'<button class="btn ghost sm" onclick="supBalanceCard(\''+fe.supplier_id+'\')">כרטיס הספק</button>':'')+
    '</div>');
}

async function addPayDoc(kind, payId, backKind, backId){
  var name = el('f_pdname').value, note = el('f_pdnote').value;
  var f = el('f_pdfile').files[0];
  if(!f && !note && !name) return toast('צרף קובץ או כתוב פירוט', true);
  var b64 = '', mime = '';
  if(f){
    if(f.size > 4*1024*1024) return toast('הקובץ גדול מ-4MB', true);
    toast('מעלה קובץ...');
    b64 = await new Promise(function(res){ var rd=new FileReader(); rd.onload=function(){res(rd.result.split(',')[1]);}; rd.readAsDataURL(f); });
    mime = f.type || 'application/octet-stream';
  }
  var r = await act('uploadPaymentDoc',{pay_kind:kind, pay_id:payId, base64:b64, mime:mime, name:name, note:note||name}, 'האסמכתא נוספה');
  if(r) payDocsForm(kind, payId, backKind, backId);
}

function finLaundryHtml(){
  var open = (DB.laundryIntakes||[]).filter(i=>i.internal!=='כן' && i.status==='נמסר' && !String(i.invoice_id||'').trim() && Number(i.total_charge)>0);
  var byCust = {};
  open.forEach(function(i){ (byCust[i.customer_id]=byCust[i.customer_id]||[]).push(i); });
  var ids = Object.keys(byCust);
  var h = '<div class="muted" style="font-size:12.5px;margin-bottom:8px">כל קליטה שנשקלה ונמסרה נרשמת כאן כחיוב פתוח על חשבון הלקוח. בסוף התקופה מפיקים חשבונית מרוכזת אחת בלחיצה.</div>';

/* B44: הצגה חיה של הפיצול, כדי שלא תהיה אי-הבנה לגבי מה נכנס לספרים */
function b44SplitVat(gross){
  var g = Math.round((Number(gross)||0)*100)/100;
  if(!(g>0)) return {gross:0, net:0, vat:0};
  var rate = vatRateFE();
  var net = Math.round((g/(1+rate))*100)/100;
  return {gross:g, net:net, vat:Math.round((g-net)*100)/100, rate:rate};
}
function b44ExpSplit(){
  var box = el('f_esplit'); if(!box) return;
  var sp = b44SplitVat((el('f_eamt')||{}).value);
  box.innerHTML = sp.gross>0
    ? 'מתוך '+ils(sp.gross)+' — נטו <b>'+ils(sp.net)+'</b> · מע\u0022מ <b>'+ils(sp.vat)+'</b> ('+Math.round(sp.rate*100)+'%)'
    : 'הסכום מוזן כולל מע\u0022מ והמערכת מפצלת אותו לנטו + מע\u0022מ.';
}
/* B44 (תיקון): עד כה הסכום המוזן טופל כנטו ונוסף עליו מע"מ בשיעור קשיח 0.18.
   הכלל במערכת (וכבר ב-B42) הוא שכל סכום מוזן כולל מע"מ — כאן הוא מפוצל
   לנטו + מע"מ לפי vat_rate שבהגדרות. חל על רישומים חדשים בלבד. */
async function saveExp(){
  var amt = Number(el('f_eamt').value);
  if(!(amt>0)) return toast('סכום חובה', true);
  var sp = b44SplitVat(amt);
  var r = await act('create',{table:'expenses',row:{date:ymdLocal(),category:el('f_ecat').value,supplier_id:el('f_esup').value,amount:sp.net,vat:sp.vat,note:el('f_enote').value}},'ההוצאה נרשמה — נטו '+ils(sp.net)+' + מע\u0022מ '+ils(sp.vat));
  if(!r) return;
  var f = el('f_efile').files[0];
  if(f){
    if(f.size > 4*1024*1024) toast('הקובץ גדול מ-4MB — ההוצאה נשמרה בלי צרופה', true);
    else {
      toast('מעלה קבלה...');
      var b64 = await new Promise(function(res){ var rd=new FileReader(); rd.onload=function(){res(rd.result.split(',')[1]);}; rd.readAsDataURL(f); });
      var u = await api('uploadReceipt',{expense_id:r.row.id,base64:b64,mime:f.type,name:f.name});
      if(u.ok){ toast('הקבלה צורפה'); var g=await api('getAll'); if(g.ok){DB=g.db;render();} }
      else toast(u.error, true);
    }
  }
  closeModal();
}

function checkDupeCustomer(){
  var box = el('dupeHint'); if(!box) return;
  var name = (el('f_name')? el('f_name').value : '').trim();
  var phone = (el('f_cphone')? el('f_cphone').value : '').replace(/\D/g,'');
  if(name.length<2 && phone.length<7){ box.innerHTML=''; return; }
  var norm = function(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); };
  var nName = norm(name);
  var seen = {};
  var matches = DB.customers.filter(function(x){
    var xName = norm(x.name), xPhone = String(x.phone||'').replace(/\D/g,'');
    var nameHit = nName.length>=2 && xName && (xName===nName || xName.indexOf(nName)>-1 || nName.indexOf(xName)>-1);
    var phoneHit = phone.length>=7 && xPhone && xPhone===phone;
    return nameHit || phoneHit;
  }).filter(function(x){ return seen[x.id]? false : (seen[x.id]=1); }).slice(0,3);
  if(!matches.length){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="dupe-hint">אולי התכוונת ל: '+matches.map(function(m){
    return '<b onclick="closeModal();openCust(\''+m.id+'\')">'+esc(m.name)+(m.phone?' ('+esc(m.phone)+')':'')+'</b>';
  }).join(' · ')+' ? (לחיצה פותחת את הכרטיס הקיים)</div>';
}

/* טאב: ציר זמן — איחוד קריאה של יומן (פגישות מקושרות), הערות ותשלומים לפי הלקוח */
function custTabTimeline(cid){
  var items = [];
  (DB.notes||[]).filter(n=>n.entity_type==='customer'&&String(n.entity_id)===String(cid)).forEach(function(n){
    items.push({ts:n.ts||'', type:'תרשומת', text:esc(n.user)+': '+esc(String(n.text).substring(0,90)), onclick:"notesModal('customer','"+cid+"')"});
  });
  linksOf('customer',cid).filter(l=>l.otherType==='meeting').forEach(function(L){
    var m=(DB.meetings||[]).find(x=>x.id===L.otherId)||{};
    items.push({ts:(m.date||'')+' 00:00', type:'פגישה', text:esc(m.title||''), onclick:"openMeeting('"+L.otherId+"')"});
  });
  custPayments(cid).forEach(function(p){
    items.push({ts:(p.date||'')+' 00:00', type:'תשלום', text:ils(p.amount)+' · '+esc(p.method||''), onclick:"openReceipt('"+p.id+"')"});
  });
  items.sort(function(a,b){ return String(b.ts||'').localeCompare(String(a.ts||'')); });
  return '<div class="section-title"><h3>ציר זמן ('+items.length+')</h3></div>'+
    (items.length? items.slice(0,50).map(function(it){ return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="'+it.onclick+'"><div class="grow"><span class="chip">'+esc(it.type)+'</span> '+it.text+'</div><span class="muted">'+esc(fmtTs(it.ts))+'</span></div>'; }).join('') : '<div class="muted">אין פעילות עדיין</div>');
}
/* עזר: כל התשלומים ששייכים ללקוח — דרך הזמנותיו או חשבוניותיו */
function custPayments(cid){
  var oids = {}; DB.orders.filter(o=>o.customer_id===cid).forEach(function(o){ oids[o.id]=1; });
  var vids = {}; DB.invoices.filter(v=>v.customer_id===cid).forEach(function(v){ vids[v.id]=1; });
  return (DB.payments||[]).filter(function(p){ return (p.order_id && oids[p.order_id]) || (p.invoice_id && vids[p.invoice_id]); })
    .slice().sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
}

function b3ToggleFields(){
  var t = el('f_b3type').value;
  el('b3_check_box').style.display = t==='שיק'?'grid':'none';
  el('b3_guar_box').style.display = t==='ערב'?'block':'none';
}
async function saveB3Guarantee(cid){
  var t = el('f_b3type').value;
  var row = {customer_id:cid, guarantee_type:t};
  if(t==='שיק'){
    if(!el('f_b3checkno').value){ el('b3formErr').textContent='חסר מספר שיק'; return; }
    row.check_number = el('f_b3checkno').value; row.check_bank = el('f_b3checkbank').value;
  } else {
    if(!el('f_b3gname').value){ el('b3formErr').textContent='חסר שם ערב'; return; }
    row.guarantor_name = el('f_b3gname').value; row.guarantor_phone = el('f_b3gphone').value; row.guarantor_id = el('f_b3gid').value;
  }
  var r = await act('b3SaveGuarantee', row, 'הערבות נרשמה — ממתינה לאישור מנהל');
  if(r) openCust(cid);
}

/* ================= B40: איפה נמצא הפריט + היסטוריה מלאה =================
   שתי שאלות שלא הייתה להן תשובה במסך המלאי:
   (1) יש 100 מפות ורק 25 זמינות — איפה השאר? אצל מי? באיזו מכונה?
   (2) מי החזיק את הפריט הזה לאורך הזמן?
   שני המסכים נבנים מהנתונים שכבר טעונים בדפדפן — אפס פעולת שרת חדשה. */
var B40_OUT_STATUSES = ['סופקה'];          // אצל הלקוח בפועל
var B40_RESERVED_STATUSES = ['מאושרת'];     // משוריין, טרם יצא
/* B40b (תיקון): החישוב יושר מול מנוע הזמינות בשרת (availableQty).
   שלושה פערים תוקנו:
   (1) תנועות מלאי אינן נגרעות כשהזמנה מסופקת — הפריטים אצל הלקוח עדיין
       נספרים ב-total. לכן חובה להפחית גם את outQ, אחרת "זמין" מנופח.
       בשרת RESERVING_STATUSES = ['מאושרת','סופקה'] — שניהם תופסים מלאי.
   (2) רק הזמנות מסוג השכרה תופסות את המלאי שלנו. הזמנת כביסה (NOBLE) היא
       על הכביסה של הלקוח — בשרת reservedQty מדלגת עליה, וכך גם כאן.
   (3) פחת זמינות (avail_depreciation_pct) — רזרבה שהשרת מפחית ולא הופחתה כאן.
   הבדל מכוון מהשרת — שתי שאלות שונות, ולכן שני מספרים לגיטימיים:
   · availableQty בשרת סופר רק הזמנות שחופפות לטווח התאריכים שנבדק, ועונה
     על "כמה אפשר להזמין לתאריכים האלה".
   · המסך הזה עונה על "כמה מונחות אצלי עכשיו ואינן מובטחות לאף אחד" — ולכן
     סופר כל הזמנה מאושרת גם אם היא לעתיד, וכל הזמנה שסופקה גם אם מועד
     ההחזרה שלה עבר.
   התוצאה כאן תמיד קטנה או שווה למספר של השרת. זה הכיוון הבטוח: המסך לעולם
   לא מבטיח מלאי שכבר התחייבנו עליו. */
function b40ItemBreakdown(iid){
  var total = (DB.stockMoves||[]).filter(m=>m.item_id===iid).reduce((s,m)=>s+Number(m.qty||0),0);
  var out = [], reserved = [], laundry = [];
  (DB.orderLines||[]).filter(l=>l.item_id===iid).forEach(function(l){
    var o = (DB.orders||[]).find(x=>x.id===l.order_id); if(!o) return;
    if(String(o.type)!=='השכרה') return;
    if(B40_OUT_STATUSES.indexOf(String(o.status))>-1) out.push({line:l, order:o});
    else if(B40_RESERVED_STATUSES.indexOf(String(o.status))>-1) reserved.push({line:l, order:o});
  });
  (DB.laundryTasks||[]).filter(t=>t.item_id===iid && t.stage!=='מוכן').forEach(t=>laundry.push(t));
  var ready = (DB.laundryTasks||[]).filter(t=>t.item_id===iid && t.stage==='מוכן' &&
    String(t.done_date||'')>=ymdLocal(new Date(Date.now()-7*864e5)));
  var sum = a=>a.reduce((s,x)=>s+Number((x.line?x.line.qty:x.qty)||0),0);
  var outQ=sum(out), resQ=sum(reserved), washQ=sum(laundry);
  var pct = Number(setting('avail_depreciation_pct')||0);
  var deprQ = (pct>0 && total>0)? Math.ceil(total*pct/100) : 0;
  return {total:total, out:out, reserved:reserved, laundry:laundry, ready:ready,
          outQ:outQ, resQ:resQ, washQ:washQ, deprQ:deprQ,
          availQ: total-outQ-resQ-washQ-deprQ};
}

      b.reserved.map(function(x){ return '<tr style="cursor:pointer" onclick="closeModal();openOrder(\''+esc(x.order.id)+'\')">'+

    (b.ready.length?'<h3 style="margin-top:14px">סיימו כביסה בשבוע האחרון — איפה הונחו</h3>'+

/* B25: הצעת קידומת ליחידות מתוך שם עברי — תעתיק פונטי בסיסי, ניתן לעריכה תמיד */
function suggestPrefixFromName(nm){
  var MAP = {'א':'A','ב':'B','ג':'G','ד':'D','ה':'A','ו':'O','ז':'Z','ח':'H','ט':'T','י':'I','כ':'K','ך':'K','ל':'L','מ':'M','ם':'M','נ':'N','ן':'N','ס':'S','ע':'A','פ':'P','ף':'P','צ':'TZ','ץ':'TZ','ק':'K','ר':'R','ש':'SH','ת':'T'};
  var out=''; nm=String(nm||'');
  for(var i=0;i<nm.length;i++){ out += MAP[nm[i]]||''; }
  return out.slice(0,6).toUpperCase();
}
/* B25: הקלדת שם — אם תואם וריאציה קיימת, שואב קידומת/ספק/מיקום/מחירים ממנה כברירת מחדל; אם שם חדש, מציע קידומת */
/* B26: רשימת ערכים ייחודיים לעמודת פריט (לבניית תפריטי סוג/תת-סוג/צבע) */
function distinctVals(field){
  var seen={}, out=[];
  (DB.items||[]).forEach(function(i){ var v=String(i[field]||'').trim(); if(v && !seen[v]){ seen[v]=1; out.push(v); } });
  return out.sort(function(a,b){ return a.localeCompare(b,'he'); });
}

}

}

async function saveItem(){
  if(!el('f_iname').value) return toast('שם חובה', true);
  if(!el('f_iprefix').value) return toast('קידומת ליחידות חובה', true);
  var id = el('f_iid').value;
  var w = (el('f_iw').value||'').trim(), h = (el('f_ih').value||'').trim();
  var size = (w && h) ? (w+'×'+h) : (w||h||'');
  var row = {name:el('f_iname').value,category:el('f_icat').value,subtype:el('f_isub').value,size:size,color:el('f_icolor').value,
    rent_price:Number(el('f_irent').value)||0,wash_price:Number(el('f_iwash').value)||0,min_stock:el('f_imin').value,
    supplier_id:el('f_isup').value,purchase_cost:Number(el('f_icost').value)||'',location:el('f_ishelf').value,notes:el('f_inotes').value,
    weight_kg:el('f_iweight').value,deviation_pct:el('f_idev').value,replacement_price:el('f_irepl').value};
  if(!id){ row.prefix = el('f_iprefix').value.toUpperCase().replace(/[^A-Z0-9]/g,''); row.active='כן'; }
  var r = id ? await act('update',{table:'items',id:id,row:row},'הפריט עודכן') : await act('create',{table:'items',row:row},'הפריט נוסף');
  if(!r) return;
  var savedId = id || (r.row && r.row.id);
  var f = el('f_iimg').files[0];
  if(f){
    if(f.size > 4*1024*1024) toast('התמונה גדולה מ-4MB — לא הועלתה', true);
    else{
      toast('מעלה תמונה...');
      var b64 = await new Promise(function(res){ var rd=new FileReader(); rd.onload=function(){res(rd.result.split(',')[1]);}; rd.readAsDataURL(f); });
      var u = await api('uploadItemImage',{item_id:savedId, base64:b64, mime:f.type});
      if(u.ok){ var itm=(DB.items||[]).find(x=>x.id===savedId); if(itm) itm.image_url=u.url; }
      else toast(u.error, true);
    }
  }
  closeModal(); render();
}

/* ===== סריקה במצלמה: BarcodeDetector מובנה, ואם אין — ZXing ===== */
var CAM_STREAM = null, CAM_STOP = false, ZX_READER = null;
async function startCam(){
  var ov = el('camOverlay');
  if(!ov){
    ov = document.createElement('div'); ov.id='camOverlay';
    ov.innerHTML = '<video id="camVideo" autoplay playsinline muted></video>'+
      '<p style="color:#fff;margin:12px">כוון את הברקוד למרכז המסך</p>'+
      '<button class="btn danger" onclick="stopCam()">סגור</button>';
    document.body.appendChild(ov);
  }
  ov.style.display='flex'; CAM_STOP=false;
  try{
    CAM_STREAM = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){ stopCam(); return toast('אין גישה למצלמה — אשר הרשאה בדפדפן', true); }
  var video = el('camVideo');
  video.srcObject = CAM_STREAM;
  if('BarcodeDetector' in window){
    var det = new BarcodeDetector({formats:['code_128','ean_13','qr_code']});
    (async function loop(){
      if(CAM_STOP) return;
      try{ var codes = await det.detect(video); if(codes.length) return camFound(codes[0].rawValue); }catch(e){}
      setTimeout(loop, 250);
    })();
  } else {
    if(!window.ZXing){
      await new Promise(function(res){ var s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.21.3/index.min.js';
        s.onload=res; s.onerror=res; document.head.appendChild(s); });
    }
    if(!window.ZXing){ stopCam(); return toast('הדפדפן לא תומך בסריקה — הקלד ידנית', true); }
    ZX_READER = new ZXing.BrowserMultiFormatReader();
    ZX_READER.decodeFromVideoDevice(null, 'camVideo', function(result){ if(result && !CAM_STOP) camFound(result.getText()); });
  }
}
function camFound(text){
  stopCam();
  if(navigator.vibrate) navigator.vibrate(80);
  if(window.FLOOR_CAM){ var fc=FLOOR_CAM; FLOOR_CAM=null; fc(text); return; }
  if(RET_CAM){ RET_CAM=false; if(VIEW!=='returns'){VIEW='returns';render();} setTimeout(function(){ el('retIn').value=text; findReturn(text); },150); return; }
  if(VIEW!=='scan'){ VIEW='scan'; render(); }
  setTimeout(function(){ el('scanIn').value = text; doScan(); }, 150);
}
function stopCam(){
  CAM_STOP = true;
  if(ZX_READER){ try{ ZX_READER.reset(); }catch(e){} ZX_READER=null; }
  if(CAM_STREAM){ CAM_STREAM.getTracks().forEach(t=>t.stop()); CAM_STREAM=null; }
  var ov = el('camOverlay'); if(ov) ov.style.display='none';
}

var AUDIT_FILTER = { q:'', user:'', action:'', from:'', to:'' };
var AUDIT_SHOW = 200; // כמות שורות מוצגות (טעינה הדרגתית — הנתונים כבר טעונים במלואם ב-DB)
function rAudit(){
  var all = (DB.auditLog||[]).slice().sort((a,b)=> a.ts>b.ts?-1:(a.ts<b.ts?1:0));
  var users = Array.from(new Set(all.map(x=>x.user).filter(Boolean))).sort();
  var actions = Array.from(new Set(all.map(x=>x.action).filter(Boolean))).sort();
  var f = AUDIT_FILTER;
  var rows = all.filter(function(r){
    if(f.user && r.user!==f.user) return false;
    if(f.action && r.action!==f.action) return false;
    if(f.from && String(r.ts).slice(0,10)<f.from) return false;
    if(f.to && String(r.ts).slice(0,10)>f.to) return false;
    if(f.q){
      var s=(r.user+' '+r.action+' '+r.details).toLowerCase();
      if(s.indexOf(f.q.toLowerCase())===-1) return false;
    }
    return true;
  });
  var shown = rows.slice(0, AUDIT_SHOW);
  el('main').innerHTML = '<div class="section-title"><h2>יומן פעולות</h2><span class="muted">'+rows.length+' רשומות (מתוך '+all.length+' סה"כ)</span></div>'+
    '<div class="card"><div class="grid3">'+
    '<div class="frow"><label>חיפוש חופשי</label><input id="au_q" value="'+esc(f.q)+'" placeholder="משתמש / פעולה / פרטים" oninput="auditSetFilter()"></div>'+
    '<div class="frow"><label>משתמש</label><select id="au_user" onchange="auditSetFilter()"><option value="">הכל</option>'+users.map(u=>'<option'+(f.user===u?' selected':'')+'>'+esc(u)+'</option>').join('')+'</select></div>'+
    '<div class="frow"><label>פעולה</label><select id="au_action" onchange="auditSetFilter()"><option value="">הכל</option>'+actions.map(a=>'<option'+(f.action===a?' selected':'')+'>'+esc(a)+'</option>').join('')+'</select></div>'+
    '<div class="frow"><label>מתאריך</label><input id="au_from" type="date" value="'+esc(f.from)+'" onchange="auditSetFilter()"></div>'+
    '<div class="frow"><label>עד תאריך</label><input id="au_to" type="date" value="'+esc(f.to)+'" onchange="auditSetFilter()"></div>'+
    '</div></div>'+

    '<div class="card"><table><tr><th>תאריך ושעה</th><th>משתמש</th><th>פעולה</th><th>פרטים</th></tr>'+
    (shown.length? shown.map(function(r){
      return '<tr><td class="muted" style="white-space:nowrap">'+esc(r.ts)+'</td><td>'+esc(r.user)+'</td><td>'+esc(r.action)+'</td><td style="max-width:520px;word-break:break-word">'+esc(r.details)+'</td></tr>';
    }).join('') : '<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">אין רשומות תואמות</td></tr>')+
    '</table></div>'+
    (rows.length>AUDIT_SHOW? '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" onclick="AUDIT_SHOW+=200;rAudit()">טען עוד ('+(rows.length-AUDIT_SHOW)+' נוספות)</button></div>' : '');
}

/* גרף עמודות SVG גנרי — משמש לכל תצוגות ההכנסות (חודש/לקוח/סוג) */
function biBarChartSvg(items){
  var max = Math.max.apply(null, items.map(x=>x.value));
  if(!(max>0)) return '<div class="empty">אין נתונים עדיין</div>';
  var n = items.length, W = Math.max(480, n*68), H = 210, pad = 10, bw = Math.floor((W-2*pad)/n);
  var bars = items.map(function(it,idx){
    var v = it.value, bh = Math.round((H-64)*v/max), x = pad+idx*bw+9, y = H-32-bh;
    var lbl = it.label.length>9? it.label.slice(0,8)+'…' : it.label;
    return '<g><title>'+esc(it.label)+': ₪'+Math.round(v).toLocaleString('he-IL')+'</title>'+
      '<rect x="'+x+'" y="'+y+'" width="'+(bw-18)+'" height="'+Math.max(bh,2)+'" rx="3" fill="var(--teal)" opacity="'+(idx===n-1?'1':'.75')+'"/>'+
      '<text x="'+(x+(bw-18)/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+(v?'₪'+Math.round(v).toLocaleString('he-IL'):'')+'</text>'+
      '<text x="'+(x+(bw-18)/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(lbl)+'</text></g>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="גרף עמודות">'+
    '<line x1="'+pad+'" y1="'+(H-32)+'" x2="'+(W-pad)+'" y2="'+(H-32)+'" stroke="var(--line)" stroke-width="1.5"/>'+bars+'</svg>';
}

function biRevenueBodyHtml(full){
  var rev = BI_DATA.revenue, items, colLbl;
  if(BI_REV_MODE==='month'){
    var HEB_M=['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];
    var list = full? rev.byMonth : rev.byMonth.slice(-6);

/* כרטיס תחזית תזרים מזומנים — יתרות פתוחות מקובצות לפי חלון גבייה חזוי */

/* B15: כרטיס ביצועי מכבסה בלוח הבקרה העסקי — אותו מקור אמת (DB.laundryEvents/DB.laundryIntakes) כמו במסך "דוחות", בלי לוגיקה חדשה. תקציר קליטות/משקל/הכנסות לתצוגת סקירה, והפירוט המלא (עובדים+מכונות) ע"י שימוש חוזר ב-renderNobleReports הקיים על container ייעודי. */
function nobleSummaryData(days){
  var since = Date.now() - days*864e5, incl = inclInternal();
  var kg=0, rev=0, del=0;
  (DB.laundryIntakes||[]).forEach(function(i){
    var t = new Date(String(i.delivered_ts||'').replace(' ','T'));
    if(isNaN(t.getTime()) || t.getTime()<since) return;
    del++;
    if(incl || i.internal!=='כן') kg+=Number(i.net_weight_kg)||0;
    rev+=Number(i.total_charge)||0;
  });
  return {kg:Math.round(kg*100)/100, rev:rev, del:del};
}
function biNobleMini(v,l){ return '<div style="flex:1;min-width:120px;text-align:center;padding:8px 4px"><div style="font-size:22px;font-weight:700;color:var(--navy)">'+v+'</div><div class="muted" style="font-size:12px">'+l+'</div></div>'; }
function biNobleToggle(){ renderNobleReports('biNobleBox'); }
function biNobleCard(full){
  if(full) return '<div id="biNobleBox"></div>';

/* ================= NC3: מכבסה — ביצועים (עובדים + מכונות, מחושב מקומית מיומן האירועים) ================= */
var NOBLE_REP_DAYS = 30;
function nobleRepRange(d, containerId){ NOBLE_REP_DAYS = d; renderNobleReports(containerId); }
/* NC3/B15: containerId מאפשר שימוש חוזר באותו רינדור גם בלוח הבקרה העסקי (B14) — ברירת מחדל 'repNoble' שומרת על ההתנהגות הקיימת במסך דוחות */
function renderNobleReports(containerId){
  containerId = containerId || 'repNoble';
  var box = el(containerId); if(!box) return;
  var evs = DB.laundryEvents||[];
  if(!evs.length){ box.innerHTML=''; return; }
  var parseT = function(x){ var d=new Date(String(x||'').replace(' ','T')); return isNaN(d.getTime())?null:d; };
  var ld = function(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); };
  var since = Date.now() - NOBLE_REP_DAYS*864e5;
  var inSet = internalIntakeSet(), incl = inclInternal();
  var E = []; evs.forEach(function(e){ var t=parseT(e.ts); if(t && t.getTime()>=since) E.push({e:e,t:t}); });
  E.sort(function(a,b){ return a.t-b.t; });

  /* --- סיכום תקופה: מהקליטות שנמסרו (השקילה האחרונה קובעת — בלי כפילויות משקילה חוזרת) --- */
  var kg=0, rev=0, del=0;
  (DB.laundryIntakes||[]).forEach(function(i){
    var t=parseT(i.delivered_ts); if(!t||t.getTime()<since) return;
    del++;
    if(incl || i.internal!=='כן') kg+=Number(i.net_weight_kg)||0;
    rev+=Number(i.total_charge)||0;
  });

  /* --- ניקוד עובדים: 'סיום' של עגלה → ה'התחלה' הבאה שלה; הפער נזקף לעובד שהתחיל את השלב הבא --- */
  var lastEnd={}, workers={};
  var W=function(n){ return workers[n]=workers[n]||{name:n,acts:0,moves:0,lag:0}; };
  E.forEach(function(x){
    var e=x.e, k=e.intake_id+'|'+e.cart_id;
    if(e.worker_name) W(e.worker_name).acts++;
    if(e.event_type==='סיום') lastEnd[k]=x.t;
    else if(e.event_type==='התחלה'){
      if(lastEnd[k] && e.worker_name){ var m=(x.t-lastEnd[k])/60000; if(m>=0 && m<=1440){ var w=W(e.worker_name); w.moves++; w.lag+=m; } }
      delete lastEnd[k];
    }
  });
  var lb = Object.keys(workers).map(function(n){return workers[n];}).filter(function(w){return w.moves>0;})
    .map(function(w){ return {name:w.name, acts:w.acts, moves:w.moves, avg:Math.round(w.lag/w.moves)}; })
    .sort(function(a,b){ return a.avg-b.avg; });

  /* --- ניצולת מכונות: זוגות התחלה→סיום למכונה. שלב פתוח נספר עד עכשיו (לכל היותר 24 שעות) --- */
  var openM={}, segs=[];
  E.forEach(function(x){
    var e=x.e; if(!e.machine_id) return;
    var k=e.intake_id+'|'+e.cart_id+'|'+e.machine_id;
    if(e.event_type==='התחלה') openM[k]={m:e.machine_id,t:x.t};
    else if(e.event_type==='סיום' && openM[k]){ if(x.t>openM[k].t) segs.push({m:e.machine_id,a:openM[k].t,b:x.t}); delete openM[k]; }
  });
  Object.keys(openM).forEach(function(k){ var o=openM[k], b=new Date(Math.min(Date.now(), o.t.getTime()+864e5)); if(b>o.t) segs.push({m:o.m,a:o.t,b:b}); });
  var busyTot={}, busyWin={}, dayAny={}, daySpan={};
  segs.forEach(function(sg){
    busyTot[sg.m]=(busyTot[sg.m]||0)+(sg.b-sg.a)/60000;
    var cur=new Date(sg.a);
    while(cur<sg.b){ /* פירוק ליממות + חיתוך לחלון 05:00–17:00 */
      var dayEnd=new Date(cur); dayEnd.setHours(24,0,0,0);
      var segEnd=sg.b<dayEnd?sg.b:dayEnd, day=ld(cur);
      dayAny[day]=1;
      if(!daySpan[day]) daySpan[day]={a:cur.getTime(),b:segEnd.getTime()};
      else { if(cur.getTime()<daySpan[day].a) daySpan[day].a=cur.getTime(); if(segEnd.getTime()>daySpan[day].b) daySpan[day].b=segEnd.getTime(); }
      var w1=new Date(cur); w1.setHours(5,0,0,0); var w2=new Date(cur); w2.setHours(17,0,0,0);
      var ca=Math.max(cur.getTime(),w1.getTime()), cb=Math.min(segEnd.getTime(),w2.getTime());
      if(cb>ca) busyWin[sg.m]=(busyWin[sg.m]||0)+(cb-ca)/60000;
      cur=dayEnd;
    }
  });
  var days=Object.keys(dayAny), winTotal=days.length*720, spanTotal=0;
  days.forEach(function(d){ spanTotal+=(daySpan[d].b-daySpan[d].a)/60000; });
  var maxBusy=0; Object.keys(busyTot).forEach(function(m){ if(busyTot[m]>maxBusy) maxBusy=busyTot[m]; });
  var pct=function(x,y){ return y>0?Math.min(100,Math.round(x/y*100)):0; };
  var bar=function(p,color){ return '<div style="background:var(--line);border-radius:6px;height:8px;overflow:hidden"><div style="width:'+p+'%;height:100%;background:'+color+'"></div></div>'; };
  var machRows = DB.machines.map(function(m){
    var bt=busyTot[m.id]||0;
    return {id:m.id, stage:m.auto_stage||'', bt:bt, a:pct(busyWin[m.id]||0,winTotal), b:pct(bt,spanTotal), c:pct(bt,maxBusy)};
  }).sort(function(x,y){ return y.bt-x.bt; });

  /* --- רינדור --- */
  var rng=function(d,l){ return '<button class="btn '+(NOBLE_REP_DAYS===d?'':'ghost')+' sm" onclick="nobleRepRange('+d+',\''+containerId+'\')">'+l+'</button>'; };
  var mini=function(v,l){ return '<div style="flex:1;min-width:120px;text-align:center;padding:8px 4px"><div style="font-size:22px;font-weight:700;color:var(--navy)">'+v+'</div><div class="muted" style="font-size:12px">'+l+'</div></div>'; };
  var medals=['🥇','🥈','🥉'];
  var h='<h3 style="margin:16px 0 8px">מכבסה — ביצועים</h3>'+
    '<div class="card"><div class="row" style="align-items:center;flex-wrap:wrap"><div class="row grow" style="gap:6px">'+rng(7,'7 ימים')+rng(30,'30 יום')+rng(90,'90 יום')+'</div>'+internalChk(containerId==='repNoble'?'renderNobleReports':'biNobleToggle')+'</div>'+
    '<div class="row" style="flex-wrap:wrap;margin-top:6px">'+mini(Math.round(kg*100)/100,'ק&quot;ג (קליטות שנמסרו)')+mini(ils(rev),'הכנסות מכבסה (לפני מע&quot;מ)')+mini(del,'קליטות נמסרו')+'</div></div>';
  h+='<div class="card"><h3>עובדים — מהירות מעבר בין שלבים</h3><div class="muted" style="font-size:12px;margin:2px 0 6px">כמה זמן עבר מסיום שלב של עגלה ועד שהעובד התחיל בה את השלב הבא. פחות = טוב יותר.</div>'+
    (lb.length?'<table><tr><th></th><th>עובד</th><th>מעברים</th><th>זמן מעבר ממוצע</th><th>פעולות בתקופה</th></tr>'+
      lb.map(function(w,i){ return '<tr><td>'+(medals[i]||(i+1))+'</td><td><b>'+esc(w.name)+'</b></td><td>'+w.moves+'</td><td>'+(w.avg?fmtMin(w.avg):'מיידי ⚡')+'</td><td>'+w.acts+'</td></tr>'; }).join('')+'</table>'
    :'<div class="empty">אין עדיין מעברי שלבים בתקופה</div>')+'</div>';
  h+='<div class="card"><h3>ניצולת מכונות</h3><div class="muted" style="font-size:12px;margin:2px 0 8px">'+days.length+' ימי עבודה בתקופה · שלושה מדדים: יום עבודה 05:00–17:00 · מהפעלה ראשונה עד עצירה אחרונה · יחסית למכונה העמוסה ביותר.</div>';
  if(!machRows.length) h+='<div class="empty">לא הוגדרו מכונות</div>';
  machRows.forEach(function(m){
    h+='<div style="padding:6px 0;border-top:1px solid var(--line)"><div class="row"><b class="grow">'+esc(m.id)+'</b><span class="muted" style="font-size:12px">'+esc(m.stage)+(m.stage?' · ':'')+Math.round(m.bt/6)/10+' שעות עבודה</span></div>'+
      '<div class="grid3" style="gap:8px;margin-top:4px">'+
      '<div><div class="muted" style="font-size:11px">יום עבודה (05:00–17:00): <b>'+m.a+'%</b></div>'+bar(m.a,'var(--teal)')+'</div>'+
      '<div><div class="muted" style="font-size:11px">מהתנעה עד עצירה: <b>'+m.b+'%</b></div>'+bar(m.b,'var(--navy)')+'</div>'+
      '<div><div class="muted" style="font-size:11px">יחסית לעמוסה ביותר: <b>'+m.c+'%</b></div>'+bar(m.c,'var(--amber)')+'</div>'+
      '</div></div>';
  });
  h+='</div>';
  box.innerHTML=h;
}

  if(kind==='cases') list = (DB.cases||[]).filter(c=>c.active!=='לא').map(c=>({code:String(c.barcode), label:'מארז', item_id:''}));

// B22: תצוגת שעות הנוכחות של החודש עבור רשומת שכר. צפייה בלבד.
function payrollHours(pid){
  var p = DB.payroll.find(x=>x.id===pid); if(!p) return;
  var e = DB.employees.find(x=>x.id===p.employee_id)||{};
  var glob = isGlobalPayroll(p,e);
  var rows = (DB.attendance||[]).filter(a=>a.employee_id===p.employee_id && String(a.date||'').substring(0,7)===p.month)
    .slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  var tot = Math.round(rows.reduce((s,a)=>s+(Number(a.hours)||0),0)*100)/100;
  var eff = Math.round(rows.reduce((s,a)=>s+attEff(a),0)*100)/100;
  var vd  = Math.round(rows.reduce((s,a)=>s+attVoid(a),0)*100)/100;
  openModal('<h2>שעות נוכחות — '+esc(e.name)+'</h2>'+
    '<div class="muted" style="margin-bottom:8px">חודש '+esc(monthLabel(p.month))+'</div>'+
    '<div class="card"><b>נרשמו: </b>'+tot+' · <b>מזכות: </b>'+eff+
      (vd>0?' · <span style="color:var(--danger)"><b>נפסלו: </b>'+vd+'</span>':'')+
      (glob?'<div class="muted" style="font-size:12px;margin-top:6px">עובד בשכר גלובלי — השעות נרשמות למעקב בלבד ואינן משפיעות על השכר.</div>'
           :'<div class="muted" style="font-size:12px;margin-top:6px">בסיס השכר: '+eff+' שעות × '+ils(p.hourly_rate)+' = '+ils(p.base_pay)+'</div>')+'</div>'+
    (rows.length?'<div class="card"><table><tr><th>תאריך</th><th>כניסה</th><th>יציאה</th><th>שעות</th><th>פסילה</th></tr>'+
      rows.map(function(a){
        var v = attVoid(a);
        var hc = (a.hours!==''&&a.hours!==undefined)?(v>0?'<span style="text-decoration:line-through;color:var(--muted)">'+(Number(a.hours)||0)+'</span> <b>'+attEff(a)+'</b>':String(a.hours)):'—';
        return '<tr><td>'+esc(a.date)+'</td><td>'+esc(a.in_time||'—')+'</td><td>'+esc(a.out_time||'—')+'</td><td>'+hc+'</td>'+
          '<td>'+(v>0?'<span class="chip" style="background:var(--danger)">'+v+'</span> <span class="muted" style="font-size:11px">'+esc(a.void_reason||'')+'</span>':'<span class="muted">—</span>')+'</td></tr>';
      }).join('')+'</table></div>'
      :'<div class="card empty">אין רישומי נוכחות לחודש זה</div>')+
    '<div style="margin-top:10px"><button class="btn ghost sm" onclick="payrollBreakdown(\''+pid+'\')">חזרה לפירוט</button></div>');
}

async function saveSettings(){
  var btn = el('setSaveBtn'), origTxt = btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.style.opacity='.6'; btn.textContent='שומר...'; }
  showBusy(true);
  try{
    var keys = SETTING_FIELDS.map(f=>f[0]).concat(['agreement_text','ui_theme']);
    for(var i=0;i<keys.length;i++){
      var fld = el('set_'+keys[i]);
      if(!fld) continue; // שדה שלא קיים במסך — לא מפילים את כל השמירה
      var r = await api('updateSetting',{key:keys[i],value:fld.value});
      if(!r || !r.ok){ toast((r&&r.error)||('שמירת ההגדרה "'+keys[i]+'" נכשלה'), true); return; }
    }
    var g = await api('getAll'); if(g.ok) DB=g.db;
    applyTheme(); toast('ההגדרות נשמרו ✓'); rSettings();
  }catch(e){
    toast('שגיאת תקשורת בשמירת ההגדרות — נסה שוב', true);
  }finally{
    showBusy(false);
    if(btn && document.body.contains(btn)){ btn.disabled=false; btn.style.opacity='1'; btn.textContent=origTxt; }
  }
}

    (ROLE==='מנהל'?' <button class="btn ghost sm" style="color:var(--danger)" title="מחיקת משימה כולל הערות ותיוגים (קוד מנהל)" onclick="delTaskFull(\''+tid+'\')">מחק משימה</button>':'')+'</div>'+
