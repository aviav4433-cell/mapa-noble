/* ================= יומן ================= */
var CAL_Y = new Date().getFullYear(), CAL_M = new Date().getMonth();
var HEBCAL_CACHE = {};
async function fetchHebcal(y, m){
  var key = y+'-'+m;
  if(HEBCAL_CACHE[key]) return HEBCAL_CACHE[key];
  try{
    var res = await fetch('https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=off&nx=off&mf=off&ss=off&c=on&M=on&i=on&lg=he&geonameid=293703&year='+y+'&month='+(m+1));
    var data = await res.json();
    HEBCAL_CACHE[key] = data.items||[];
  }catch(e){ HEBCAL_CACHE[key] = []; }
  return HEBCAL_CACHE[key];
}
function hebFmt(d, opts){ try{ return new Intl.DateTimeFormat('he-u-ca-hebrew', opts).format(d); }catch(e){ return ''; } }
function calEvents(){
  var events = [];
  /* B38: התוויות ביומן לפי סוג ההזמנה. בכביסה הכיוון הפוך מהשכרה —
     בתאריך ההתחלה אוספים מהלקוח ובתאריך ההחזרה מחזירים נקי.
     הזמנת כביסה באיסוף עצמי (בלי שינוע) מסומנת ככזו ואינה נסיעה. */
  DB.orders.filter(o=>['מאושרת','סופקה'].includes(o.status)).forEach(function(o){
    var nm = cust(o.customer_id);
    if(String(o.type)==='כביסה'){
      var ship = Number(o.delivery_fee||0) > 0;
      var suf = ship? '' : ' (איסוף עצמי)';
      events.push({date:o.start_date, label:(ship?'איסוף כביסה: ':'קליטת כביסה: ')+nm+suf, color:'var(--amber)', click:"openOrder('"+o.id+"')"});
      events.push({date:o.end_date, label:(ship?'מסירת כביסה: ':'מוכן לאיסוף: ')+nm+suf, color:'var(--teal)', click:"openOrder('"+o.id+"')"});
    } else {
      events.push({date:o.start_date, label:'אספקה: '+nm, color:'var(--teal)', click:"openOrder('"+o.id+"')"});
      events.push({date:o.end_date, label:'איסוף: '+nm, color:'var(--amber)', click:"openOrder('"+o.id+"')"});
    }
  });
  DB.tasks.filter(t=>t.status!=='הושלמה'&&t.due_date).forEach(function(t){
    events.push({date:t.due_date, label:'משימה: '+t.title, color:'var(--navy2)', click:"openTask('"+t.id+"')"});
  });
  DB.meetings.forEach(function(m){
    events.push({date:m.date, label:'פגישה'+(m.time?' '+m.time:'')+': '+m.title, color:'var(--danger)', click:"openMeeting('"+m.id+"')"});
  });
  DB.machines.filter(m=>m.next_service).forEach(function(m){
    events.push({date:m.next_service, label:'טיפול: '+m.id, color:'#94A3B8', click:"go('assets')"});
  });
  DB.vehicles.forEach(function(v){
    if(v.test_date) events.push({date:v.test_date, label:'טסט: '+(v.plate||v.id), color:'#94A3B8', click:"go('fleet')"});
    if(v.insurance_expiry) events.push({date:v.insurance_expiry, label:'ביטוח: '+(v.plate||v.id), color:'#94A3B8', click:"go('fleet')"});
    if(v.next_service_date) events.push({date:v.next_service_date, label:'טיפול רכב: '+(v.plate||v.id), color:'#94A3B8', click:"go('fleet')"});
  });
  return events;
}
function rCalendar(){ rCalendarDraw([]); fetchHebcal(CAL_Y, CAL_M).then(function(items){ rCalendarDraw(items); }); }
function rCalendarDraw(hebItems){
  var first = new Date(CAL_Y, CAL_M, 1);
  var today = ymdLocal();
  var byDate = {};
  calEvents().forEach(e=>{ if(e.date) (byDate[e.date]=byDate[e.date]||[]).push(e); });
  var holyDays = {};
  (hebItems||[]).forEach(function(it){
    var d = String(it.date).substring(0,10);
    if(it.category==='candles'){ (byDate[d]=byDate[d]||[]).push({date:d,label:it.title,color:'#B7791F',plain:true}); holyDays[d==d?ymdLocal(new Date(new Date(d).getTime()+864e5)):d]=1; }
    if(it.category==='havdalah') (byDate[d]=byDate[d]||[]).push({date:d,label:it.title,color:'#B7791F',plain:true});
    if(it.category==='holiday'){ (byDate[d]=byDate[d]||[]).push({date:d,label:it.title,color:'var(--danger)',plain:true}); if(it.yomtov) holyDays[d]=1; }
  });
  var startOffset = first.getDay(); // 0=ראשון
  var daysInMonth = new Date(CAL_Y, CAL_M+1, 0).getDate();
  var lastDate = new Date(CAL_Y, CAL_M, daysInMonth);
  var hebRange = hebFmt(first,{month:'long',year:'numeric'});
  var hebEnd = hebFmt(lastDate,{month:'long',year:'numeric'});
  if(hebEnd && hebEnd!==hebRange) hebRange = hebFmt(first,{month:'long'})+'–'+hebEnd;
  var gregTitle = new Intl.DateTimeFormat('he',{month:'long',year:'numeric'}).format(first);
  var overdue = DB.tasks.filter(t=>t.status!=='הושלמה'&&t.due_date&&t.due_date<today);
  var cells = '';
  ['א','ב','ג','ד','ה','ו','ש'].forEach(d=>{ cells += '<div class="calhead">'+d+'</div>'; });
  for(var i=0;i<startOffset;i++) cells += '<div></div>';
  for(var day=1;day<=daysInMonth;day++){
    var d = new Date(CAL_Y, CAL_M, day);
    var iso = CAL_Y+'-'+('0'+(CAL_M+1)).slice(-2)+'-'+('0'+day).slice(-2);
    var evs = byDate[iso]||[];
    var isSat = d.getDay()===6;
    cells += '<div class="calday'+(iso===today?' today':'')+'" style="'+((isSat||holyDays[iso])?'background:#FDF6E3;':'')+'" onclick="openDay(\''+iso+'\')">'+
      (isSat?'<span class="chip" style="background:#B8860B;font-size:9px;padding:1px 6px">שבת</span> ':'')+
      '<span class="dnum">'+day+'</span> <span class="dheb">'+esc(hebFmt(d,{day:'numeric'}))+' '+esc(hebFmt(d,{month:'long'}))+'</span>'+
      evs.slice(0,3).map(e=>e.plain?'<span class="calshab">'+esc(e.label)+'</span>':'<div class="calev" style="background:'+e.color+(e.click?';cursor:pointer':'')+'"'+(e.click?' title="לחץ לפתיחה" onclick="event.stopPropagation();'+e.click+'"':'')+'>'+esc(e.label)+'</div>').join('')+
      (evs.length>3?'<div class="muted">+'+(evs.length-3)+' נוספים</div>':'')+'</div>';
  }
  el('main').innerHTML = '<div class="section-title"><h2>יומן</h2><div class="row">'+
    '<button class="btn ghost sm" onclick="calNav(1)">◀ הבא</button>'+
    '<button class="btn ghost sm" onclick="CAL_Y=new Date().getFullYear();CAL_M=new Date().getMonth();rCalendar()">היום</button>'+
    '<button class="btn ghost sm" onclick="calNav(-1)">הקודם ▶</button></div></div>'+
    '<div class="card"><div style="text-align:center;margin-bottom:8px"><b style="font-size:17px">'+esc(gregTitle)+'</b><div class="muted">'+esc(hebRange)+'</div></div>'+
    '<div class="calgrid">'+cells+'</div></div>'+
    (overdue.length?'<div class="card" style="border-color:var(--danger)"><b style="color:var(--danger)">משימות באיחור:</b> '+overdue.map(t=>'<span style="cursor:pointer;text-decoration:underline" onclick="openTask(\''+t.id+'\')">'+esc(t.title)+'</span>').join(' · ')+'</div>':'');
}
function calNav(dir){ CAL_M += dir; if(CAL_M<0){CAL_M=11;CAL_Y--;} if(CAL_M>11){CAL_M=0;CAL_Y++;} rCalendar(); }
function openDay(iso){
  var evs = calEvents().filter(e=>e.date===iso);
  var d = new Date(iso);
  openModal('<h2>'+iso+'</h2><div class="muted" style="margin-bottom:10px">'+esc(hebFmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'</div>'+
    (evs.length? evs.map(e=>'<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)'+(e.click?';cursor:pointer':'')+'"'+(e.click?' onclick="closeModal();'+e.click+'"':'')+'><span class="chip" style="background:'+e.color+'">•</span><div class="grow">'+esc(e.label)+(e.click?' <span class="muted" style="font-size:11px">↗ פתח</span>':'')+'</div></div>').join(''):'<div class="muted">אין אירועים ביום זה</div>'));
}

  var exists = (e.list()||[]).some(function(x){ return String(x.id)===String(id); });
  if(!exists){ toast('הרשומה המקושרת נמחקה', true); return; }
  e.open(id);
}
// כל הקישורים של ישות — בשני הכיוונים
function linksOf(type,id){
  return (DB.links||[]).filter(function(l){
    return (l.from_type===type && String(l.from_id)===String(id)) || (l.to_type===type && String(l.to_id)===String(id));
  }).map(function(l){
    var isFrom = (l.from_type===type && String(l.from_id)===String(id));
    return {linkId:l.id, otherType:isFrom?l.to_type:l.from_type, otherId:isFrom?l.to_id:l.from_id, note:l.note||''};
  });
}
function tagBtn(type,id){

  return '<button class="btn ghost sm" onclick="tagDialog(\''+type+'\',\''+id+'\')">תיוג'+(n?' ('+n+')':'')+'</button>';
}

/* ================= @אזכורים בפרוטוקול פגישה ================= */
// סוגי הישויות שאפשר לתייג עם @ בתוך טקסט הפרוטוקול
var MENTION_TYPES = ['customer','contact','employee','supplier','item'];
var MENTION_CTX = null; // {start,end} — גבולות הקטע '@חלקי' בטקסט בזמן ההשלמה
// כל הישויות הניתנות לתיוג — שם לא ריק בלבד
function mentionEntities(){
  var out = [];
  MENTION_TYPES.forEach(function(t){
    var e = ENT[t]; if(!e) return;
    ((e.list && e.list())||[]).forEach(function(r){
      var n = String(e.name(r)||'').trim();
      if(n && r.id!=null && r.id!=='') out.push({type:t, id:r.id, name:n});
    });
  });
  return out;
}
// השלמה אוטומטית: מזהה '@קטע' שמסתיים בסמן ומציג עד 8 התאמות
function mentionAuto(ta){
  var dd = el('mentionDD'); if(!dd || !ta) return;
  var pos = ta.selectionStart, before = ta.value.slice(0, pos);
  var mm = before.match(/(^|[\s.,;:!?()"'-])@([^@\n]{0,40})$/);
  if(!mm){ dd.style.display='none'; MENTION_CTX=null; return; }
  var frag = mm[2], q = frag.trim().toLowerCase();
  var list = mentionEntities().filter(function(e){ return !q || e.name.toLowerCase().indexOf(q)>-1; }).slice(0,8);
  if(!list.length){ dd.style.display='none'; MENTION_CTX=null; return; }
  MENTION_CTX = {start: pos - frag.length - 1, end: pos};
  dd.innerHTML = list.map(function(e){
    var t = ENT[e.type]||{};
    return '<div style="padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)" onclick="pickMention(\''+e.type+'\',\''+e.id+'\')">'+(t.icon||'')+' <span class="muted" style="font-size:12px">'+esc(t.label||'')+'</span> <b>'+esc(e.name)+'</b></div>';
  }).join('');
  dd.style.display='block';
}
function hideMentionDD(){ var dd = el('mentionDD'); if(dd) dd.style.display='none'; MENTION_CTX=null; }
// בחירת שורה — מחליף את '@קטע' ב'@שם המלא ' ומחזיר פוקוס
function pickMention(type, id){
  var ta = el('f_mprotocol'), e = ENT[type];
  var r = e? ((e.list && e.list())||[]).find(function(x){return String(x.id)===String(id);}) : null;
  if(ta && r && MENTION_CTX){
    var name = String(e.name(r)), v = ta.value;
    ta.value = v.slice(0, MENTION_CTX.start) + '@' + name + ' ' + v.slice(MENTION_CTX.end);
    var np = MENTION_CTX.start + name.length + 2;
    ta.focus(); ta.setSelectionRange(np, np);
  }
  hideMentionDD();
}
// סגירת הרשימה בלחיצה מחוץ לה
document.addEventListener('click', function(ev){
  var dd = el('mentionDD');
  if(dd && dd.style.display!=='none' && !dd.contains(ev.target) && !(ev.target && ev.target.id==='f_mprotocol')) hideMentionDD();
});
// כל האזכורים המזוהים בטקסט — התאמה מדויקת לשם, השם הארוך ביותר קודם
function protocolMentionsIn(text){
  var found = [];
  text = String(text==null?'':text);
  if(text.indexOf('@')===-1) return found;
  var ents = mentionEntities().sort(function(a,b){ return b.name.length - a.name.length; });
  if(!ents.length) return found;
  var i = 0;
  while((i = text.indexOf('@', i)) > -1){
    var rest = text.slice(i+1), hit = null;
    for(var k=0;k<ents.length;k++){ if(rest.indexOf(ents[k].name)===0){ hit = ents[k]; break; } }
    if(hit){ found.push({index:i, len:hit.name.length+1, ent:hit}); i += hit.name.length + 1; }
    else i++;
  }
  return found;
}
// פרוטוקול כ-HTML: אזכור מזוהה הופך לתגית מודגשת (לחיצה = ניווט), השאר טקסט רגיל
function renderProtocolHTML(text, clickable){
  text = String(text==null?'':text);
  var ms = protocolMentionsIn(text);
  if(!ms.length) return esc(text);
  var html = '', pos = 0;
  ms.forEach(function(mm){
    html += esc(text.slice(pos, mm.index));
    var t = ENT[mm.ent.type]||{};
    var label = (t.icon||'')+' '+esc('@'+mm.ent.name);
    html += clickable
      ? '<span style="background:var(--navy2);color:#fff;border-radius:8px;padding:1px 7px;cursor:pointer;font-weight:600" title="'+esc(t.label||'')+'" onclick="entOpen(\''+mm.ent.type+'\',\''+mm.ent.id+'\')">'+label+'</span>'
      : '<b style="text-decoration:underline">'+label+'</b>';
    pos = mm.index + mm.len;
  });
  html += esc(text.slice(pos));
  return html;
}
// יצירת קישורי links מהאזכורים — כפולים מדולגים, שגיאות נבלעות, לעולם לא חוסם שמירה
async function syncProtocolMentions(mid, text){
  try{
    if(!mid) return;
    var ms = protocolMentionsIn(text), seen = {};
    for(var i=0;i<ms.length;i++){
      var e = ms[i].ent, key = e.type+'|'+e.id;
      if(seen[key]) continue; seen[key] = 1;
      var exists = (DB.links||[]).some(function(l){
        return l.from_type==='meeting' && String(l.from_id)===String(mid) && l.to_type===e.type && String(l.to_id)===String(e.id);
      });
      if(exists) continue;
      try{ await act('create',{table:'links',row:{from_type:'meeting',from_id:mid,to_type:e.type,to_id:e.id,note:'תויג בפרוטוקול'}}); }catch(err){}
    }
  }catch(err){}
}

var NOTE_TYPES = {customer:'לקוח',item:'פריט',order:'הזמנה',employee:'עובד',supplier:'ספק',vehicle:'רכב',machine:'מכונה',cart:'עגלה',task:'משימה',meeting:'פגישה',expense:'הוצאה'};
function noteEntityName(type,id){
  var m = {customer:['customers','name'],item:['items','name'],employee:['employees','name'],supplier:['suppliers','name'],
    vehicle:['vehicles','plate'],machine:['machines','id'],cart:['carts','id'],task:['tasks','title'],meeting:['meetings','title']};
  if(type==='order'){ var o=DB.orders.find(x=>x.id===id); return o?cust(o.customer_id)+' '+o.start_date:id; }
  if(type==='expense'){ var x=DB.expenses.find(e=>e.id===id); return x?x.category+' '+x.date:id; }
  var mm = m[type]; if(!mm) return id;
  var rec = DB[FE_MAP[mm[0]]||mm[0]].find(r=>r.id===id);
  return rec?(rec[mm[1]]||id):id;
}
/* ניווט הקשר מתרשומת — פתיחת ההורה שעליו נכתבה + הדגשת התרשומת שם */
var NOTE_SCREEN = {vehicle:'fleet', item:'items', employee:'staff', supplier:'purchasing', machine:'assets', cart:'assets', expense:'finance'};
function noteNav(noteId){
  var n = (DB.notes||[]).find(function(x){return String(x.id)===String(noteId);});
  if(!n) return;
  var t = n.entity_type, id = n.entity_id;
  if(!t || !id){ closeModal(); go('notes'); highlightNote(noteId); return; } // אין הקשר — פשוט מציגים את התרשומת
  if(t==='customer'){ // תצוגת 360 מציגה תרשומות בפנים — מדגישים שם, ואם לא נמצאה (ישנה) נפתח את מודל התרשומות
    openCust(id);
    highlightNote(noteId, function(){ notesModal('customer',id); highlightNote(noteId); });
    return;
  }
  if(t==='order') openOrder(id);
  else if(t==='task') openTask(id);
  else if(t==='meeting') openMeeting(id);
  else if(NOTE_SCREEN[t]){ closeModal(); go(NOTE_SCREEN[t]); }
  // ההורה לא מציג תרשומות בפנים — פותחים את מודל התרשומות שלו עם הדגשה
  notesModal(t,id);
  highlightNote(noteId);
}
function highlightNote(noteId, onMiss, tries){
  tries = (tries==null)? 12 : tries;
  // ייתכן ש-id="note-..." קיים גם ברשימה הראשית (מאחורי המודל) וגם בתוך מודל פתוח (תצוגת 360 / notesModal) —
  // getElementById עלול למצוא את ההעתק המוסתר; מעדיפים במפורש העתק שבתוך המודל הגלוי אם קיים
  var modalEl = el('modal');
  var sel = '#note-'+String(noteId).replace(/([^\w-])/g,'\\$1');
  var node = (modalEl && modalEl.querySelector(sel)) || document.getElementById('note-'+noteId);
  if(!node){
    if(tries>0) setTimeout(function(){ highlightNote(noteId, onMiss, tries-1); }, 150);
    else if(onMiss) onMiss();
    return;
  }
  try{ node.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){ node.scrollIntoView(); }
  node.classList.add('hl-fade');
  // הסרה מוקדמת בלחיצה כלשהי — נרשם באיחור קל כדי שהלחיצה שפתחה את הניווט לא תסיר מיד
  setTimeout(function(){
    document.addEventListener('click', function(){ node.classList.remove('hl-fade'); }, {once:true});
  }, 300);
}
function notesBtn(type,id){
  var n = DB.notes.filter(x=>x.entity_type===type&&String(x.entity_id)===String(id)).length;

    '<div style="max-height:320px;overflow-y:auto;margin-top:12px">'+
    (list.length? list.map(function(n){
      var parent = n.link_note_id? DB.notes.find(x=>x.id===n.link_note_id) : null;
      return '<div id="note-'+n.id+'" style="border-bottom:1px solid var(--line);padding:8px 0'+(parent?';margin-right:14px;border-right:3px solid var(--teal);padding-right:8px':'')+'">'+

    }).join(''):'<div class="muted">אין תרשומות עדיין</div>')+'</div>');

async function saveNote(type,id,replyTo){
  var txt = el('f_ntext').value;
  if(!txt.trim()) return toast('כתוב תרשומת', true);
  var r = await act('create',{table:'notes',row:{entity_type:type,entity_id:id,text:txt,link_note_id:replyTo||'',ts:nowTs()}});
  if(!r) return;
  var f = el('f_nfile').files[0];
  if(f){
    if(f.size > 4*1024*1024) toast('הקובץ גדול מ-4MB — התרשומת נשמרה בלי צרופה', true);
    else{
      toast('מעלה מסמך...');
      var b64 = await new Promise(function(res){ var rd=new FileReader(); rd.onload=function(){res(rd.result.split(',')[1]);}; rd.readAsDataURL(f); });
      var u = await api('attachNoteFile',{note_id:r.row.id,base64:b64,mime:f.type,name:f.name});
      if(u.ok){ var g=await api('getAll'); if(g.ok) DB=g.db; }
      else toast(u.error, true);
    }
  }
  toast('התרשומת נשמרה'); notesModal(type,id);
}

async function portalLogin(){

    renderPortal();

}

/* B5 (D14): שורת הזמנה בפורטל — כולל מעקב משלוח (סטטוס + ETA טקסטואלי, בלי GPS חי) */

      '</div>';
  }
  return '<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line);font-size:13px"><div class="grow">'+esc(o.start)+' — '+esc(o.end)+(o.total?' · '+ils(o.total):'')+(o.payment_status?'<br><span class="muted" style="font-size:11px">תשלום: '+esc(o.payment_status)+'</span>':'')+dHtml+'</div><span class="chip '+esc(o.status)+'">'+esc(o.status)+'</span></div>';
}
/* B2: תשלום חוב מהפורטל — הסליקה בפועל תחובר ב-B3; בינתיים קישור תשלום / מרכז הזמנות */

    '<p class="muted" style="font-size:12px">לאחר התשלום תופק קבלה מיידית ותופיע כאן בפורטל לצמיתות.</p>');

/* ===== B3-2 (D5/D10): פקדון בפורטל — אימות כרטיס ₪1 / ערבות חלופית ===== */
/* d.deposit מגיע מ-portalGetData: {exists,status,verified,has_token,guarantee_type,approval_pending,verified_at} — לעולם לא כולל token */
function portalDepositHtml(dep){
  dep = dep || {exists:false,status:'',verified:false,guarantee_type:'',approval_pending:false,verified_at:''};
  var box = '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13.5px">';
  if(dep.verified){
    return box+'<div class="row"><div class="grow"><b style="color:var(--ok)">✓ כרטיס אשראי מאומת</b>'+
      (dep.verified_at?'<div class="muted" style="font-size:12px">אומת בתאריך: '+esc(String(dep.verified_at).slice(0,10))+'</div>':'')+
      '</div></div><div class="muted" style="font-size:12px;margin-top:4px">האימות בוצע פעם אחת ואינו נדרש שוב.</div></div>';
  }
  if(dep.status==='מאושר'){
    return box+'<div class="row"><div class="grow"><b style="color:var(--ok)">✓ ערבות חלופית מאושרת</b>'+
      (dep.guarantee_type?' <span class="muted">('+esc(dep.guarantee_type)+')</span>':'')+'</div></div></div>';
  }
  if(dep.approval_pending || dep.status==='ממתין לאישור'){
    return box+'<div class="row"><div class="grow"><b style="color:var(--amber)">בקשת ערבות ממתינה לאישור המשרד</b>'+
      (dep.guarantee_type?' <span class="muted">('+esc(dep.guarantee_type)+')</span>':'')+'</div></div>'+
      '<div class="muted" style="font-size:12px;margin-top:4px">נציג ייצור איתך קשר טלפוני להשלמת האישור.</div></div>';
  }
  var pending = dep.status==='ממתין לאימות';
  return box+
    (pending?'<div style="color:var(--amber);font-weight:600;margin-bottom:6px">אימות הכרטיס טרם הושלם</div>'
            :'<div style="margin-bottom:6px">לצורך פתיחת מסגרת השכרה נדרש אימות אמצעי תשלום חד-פעמי.</div>')+
    '<div class="muted" style="font-size:12px;margin-bottom:8px">האימות מתבצע באתר מאובטח של חברת הסליקה בחיוב ₪1 בלבד. פרטי הכרטיס אינם נשמרים אצלנו.</div>'+
    '<button style="width:100%;background:var(--teal);color:#fff;padding:10px;border-radius:8px;font-weight:600" onclick="portalStartVerification()">'+(pending?'המשך אימות כרטיס':'אימות כרטיס אשראי (₪1)')+'</button>'+
    '<label class="row" style="gap:6px;margin-top:10px;font-size:13px;cursor:pointer"><input type="checkbox" id="p_guar_cb" style="width:auto" onchange="el(\'p_guar_box\').style.display=this.checked?\'block\':\'none\'">'+
    '<span>אין באפשרותי לאמת כרטיס — ברצוני ערבות חלופית</span></label>'+
    '<div id="p_guar_box" style="display:none;margin-top:8px;background:var(--bg,#F4F6F8);border-radius:8px;padding:9px">'+
      '<div style="font-size:13px;margin-bottom:6px">בחר סוג ערבות:</div>'+
      '<label style="margin-inline-end:14px;font-size:13.5px;cursor:pointer"><input type="radio" name="p_guar_type" value="שיק" style="width:auto" checked> שיק בטחון</label>'+
      '<label style="font-size:13.5px;cursor:pointer"><input type="radio" name="p_guar_type" value="ערב" style="width:auto"> ערב</label>'+
      '<button style="width:100%;background:var(--navy);color:#fff;padding:9px;border-radius:8px;font-weight:600;margin-top:8px" onclick="portalRequestGuarantee()">שלח בקשת ערבות לאישור</button>'+
      '<div class="muted" style="font-size:11.5px;margin-top:5px">הבקשה תועבר לאישור המשרד ונציג ייצור איתך קשר טלפוני.</div>'+
    '</div>'+
    '<div id="pDepErr" style="color:var(--danger);font-size:12.5px;margin-top:5px"></div></div>';
}
/* התחלת אימות: השרת מחזיר redirect_url (stub או ספק אמיתי) — נפתח בחלון חדש */
async function portalStartVerification(){
  if(BUSY) return;
  el('pDepErr') && (el('pDepErr').textContent = '');
  var r = await apiBusy('portalB3StartVerification',{code:PORTAL.code});
  if(!r){ return; }
  if(!r.ok){ el('pDepErr').textContent = r.error||'שגיאה'; return; }
  if(r.already_verified){ PORTAL.data.deposit = r.deposit; renderPortal(); return; }
  window.open(r.redirect_url, '_blank');
  openModal('<h2>אימות כרטיס אשראי</h2>'+
    '<p style="font-size:14px">נפתח חלון מאובטח לאימות בחיוב ₪1'+(r.stub?' <span class="muted">(מצב הדגמה — טרם חובר ספק סליקה)</span>':'')+'.</p>'+
    '<p style="font-size:14px">אם החלון לא נפתח — <a href="'+esc(r.redirect_url)+'" target="_blank"><b>לחץ כאן</b></a>.</p>'+
    '<p class="muted" style="font-size:12.5px">לאחר סיום האימות בחלון, חזור לכאן ולחץ על הכפתור:</p>'+
    '<button class="btn" style="width:100%" onclick="portalDepositRefresh()">סיימתי את האימות — רענן מצב</button>'+
    '<div id="pDepModalMsg" class="muted" style="font-size:12.5px;margin-top:6px"></div>');
}
/* בקשת ערבות חלופית (שיק/ערב) — עוברת לאישור מנהל (approval_pending) */
async function portalRequestGuarantee(){
  if(BUSY) return;
  var sel = document.querySelector('input[name="p_guar_type"]:checked');
  var gt = sel ? sel.value : '';
  if(!gt){ el('pDepErr').textContent = 'בחר סוג ערבות'; return; }
  el('pDepErr').textContent = '';
  var r = await apiBusy('portalB3RequestGuarantee',{code:PORTAL.code, guarantee_type:gt});
  if(!r){ return; }
  if(!r.ok){ el('pDepErr').textContent = r.error||'שגיאה'; return; }
  PORTAL.data.deposit = r.deposit;
  renderPortal();
}
/* רענון מצב הפקדון אחרי חזרה ממסך הסליקה */
async function portalDepositRefresh(){
  if(BUSY) return;
  var m = el('pDepModalMsg'); if(m) m.textContent = '';
  var r = await apiBusy('portalGetData',{code:PORTAL.code});
  if(!r){ return; }
  if(!r.ok){ if(m) m.textContent = r.error||'שגיאה'; return; }
  PORTAL.data = r;
  if(r.deposit && r.deposit.verified){ closeModal(); renderPortal(); }
  else if(m) m.textContent = 'האימות עדיין לא נקלט. ודא שסיימת את התהליך בחלון האימות ונסה שוב.';
}
/* NC2: כרטיס כביסה בפורטל — שלב נוכחי, זמן משוער, משקל וחיוב */
function portalLaundryHtml(lk){
  var idx=NOBLE_STAGES.indexOf(lk.status);
  var dots=NOBLE_STAGES.map(function(s,i){
    var on=i<=idx, cur=i===idx&&lk.status!=='נמסר';
    return '<div style="flex:1;text-align:center;min-width:0"><div style="height:7px;border-radius:4px;margin:0 1px;background:'+(on?(cur?'var(--amber)':'var(--teal)'):'var(--line)')+'"></div><div style="font-size:9px;color:'+(on?'var(--ink)':'var(--muted)')+';margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(s)+'</div></div>';
  }).join('');
  var eta = (lk.status!=='נמסר'&&lk.eta_min)? '<div class="muted" style="font-size:12px;margin-top:5px">זמן משוער לסיום: '+fmtMin(lk.eta_min)+'</div>' : '';
  var wt = lk.net? '<div class="muted" style="font-size:12px">נשקל: '+lk.net+' ק&quot;ג'+(lk.charge?' · לתשלום: '+ils(lk.charge):'')+'</div>' : '';
  return '<div style="border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px">'+
    '<div class="row" style="font-size:13px"><div class="grow"><b>'+esc(String(lk.ts||'').slice(0,10))+'</b> <span class="muted">· '+esc(lk.id)+'</span></div><span class="chip" style="background:'+(lk.status==='נמסר'?'var(--ok)':'var(--teal)')+'">'+esc(lk.status)+'</span></div>'+
    '<div class="row" style="gap:0;margin-top:8px;align-items:flex-end">'+dots+'</div>'+eta+wt+'</div>';
}
/* B19b (L2): אזור אזהרת זמינות בפורטל/חנות — פריט חסר באדום עם הכמות הזמינה, ואפשרות לשלוח בכל זאת */
function availWarnHtml(results, resubmitFn){
  var rows = results.map(function(r){
    var ok = r.status==='זמין';
    var txt = ok? 'זמין ✓' : (r.status==='חסר'? 'חסר — אין זמינות לתאריכים אלה' : 'זמין חלקית — עד '+r.available+' יח\'');
    return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;color:'+(ok?'var(--ok)':'var(--danger)')+'"><span>'+esc(r.name||'')+'</span><b>'+txt+'</b></div>';
  }).join('');
  return '<div style="background:#FDECEA;border:1px solid var(--danger);border-radius:8px;padding:10px;margin:8px 0;text-align:right">'+
    '<b style="font-size:13.5px">שים לב — חלק מהפריטים אינם זמינים במלואם לתאריכים שבחרת:</b>'+rows+
    '<div style="font-size:12.5px;margin-top:6px">אפשר לתקן כמות או תאריך למעלה — או לשלוח בכל זאת, והמשרד יבדוק חלופות עבורך.</div>'+
    '<button style="width:100%;background:var(--danger);color:#fff;padding:10px;border-radius:8px;margin-top:8px;font-weight:600" onclick="'+resubmitFn+'(true)">שלח בכל זאת</button></div>';
}
async function portalSubmit(force){
  if(BUSY) return;
  var lines = Array.from(document.querySelectorAll('.pqty')).map(x=>({item_id:x.dataset.item,qty:Number(x.value)||0})).filter(l=>l.qty>0);
  el('loginErr') && (el('loginErr').textContent = '');
  if(el('pAvailWarn')) el('pAvailWarn').innerHTML = '';
  /* B19b (L2): בדיקת זמינות לפני שליחה. פריט חסר לא חוסם — רק מציג אזהרה ברורה */
  if(force!==true && lines.length && el('p_start').value && el('p_end').value){
    var chk = await apiBusy('portalCheckAvail',{start_date:el('p_start').value,end_date:el('p_end').value,lines:lines});
    if(chk && chk.ok && !chk.all_ok){ el('pAvailWarn').innerHTML = availWarnHtml(chk.results,'portalSubmit'); return; }
  }
  var r = await apiBusy('portalCreateOrder',{code:PORTAL.code,start_date:el('p_start').value,end_date:el('p_end').value,lines:lines,notes:el('p_notes').value});
  if(!r){ return; }
  if(!r.ok){ el('loginErr').textContent = r.error; return; }
  portalCheckout(r);   // B2 (D2): הזמנה לא מושלמת בלי מעבר דרך מסך התשלום
}
/* B2: checkout פורטל — S1 (בתוך המסגרת עוברת ללא כסף) / D7 (שני מוצאים לחריגה) */
function portalCheckout(r){
  var cr = r.credit||{limit_ag:0,used_ag:0,available_ag:0,pct:0};
  var totalAg = r.total_ag!=null? r.total_ag : toAg(r.total);
  var within = totalAg <= cr.available_ag;
  el('login').innerHTML = '<div class="box" style="max-height:92vh;overflow-y:auto;text-align:right;width:min(480px,94vw)">'+
    '<div class="logo" style="text-align:center">MAPA<span>·</span>NOBLE</div>'+
    '<h3 style="color:var(--navy);margin:10px 0">השלמת הזמנה — תשלום</h3>'+
    '<div class="row" style="padding:4px 0;font-size:14px"><div class="grow">סכום ההזמנה (לפני מע"מ):</div><b>'+ils(fromAg(totalAg))+'</b></div>'+
    (cr.used_ag>0?'<div class="row" style="padding:4px 0;font-size:14px"><div class="grow">חוב קודם:</div><b style="color:var(--danger)">'+ils(fromAg(cr.used_ag))+'</b></div>':'')+
    creditBarHtml(cr)+
    (within?
      '<button style="width:100%;background:var(--teal);color:#fff;padding:12px;border-radius:8px;font-size:16px;font-weight:600" onclick="portalPayChoice(\''+r.order_id+'\',\'credit\')">אשר הזמנה במסגרת האשראי (ללא תשלום כעת)</button>'
      :
      '<div style="background:#FDECEA;border:1px solid var(--danger);border-radius:8px;padding:10px;margin:8px 0;font-size:13.5px">ההזמנה חורגת מיתרת האשראי ב-<b>'+ils(fromAg(totalAg-Math.max(0,cr.available_ag)))+'</b>. בחר אחת מהאפשרויות:</div>'+

  } else {
    html += '<h3 style="color:var(--navy);margin:14px 0">הבקשה הועברה לאישור</h3><p>ניצור איתך קשר בהקדם.</p>'+

/* התאמת אייקון למכונה: קודם לפי השלב האוטומטי, אחרת לפי מילות הסוג */
function b39MachineKind(m){
  var st = String((m&&m.auto_stage)||''), tp = String((m&&m.type)||'');
  if(st==='בכביסה') return 'wash';
  if(st==='בייבוש') return 'dry';
  if(st==='בגיהוץ וקיפול') return 'iron';
  if(st==='באריזה') return 'pack';
  if(/כביס/.test(tp)) return 'wash';
  if(/ייבוש|מייבש/.test(tp)) return 'dry';
  if(/גיהוץ|מעגיל|קיפול|מגהץ/.test(tp)) return 'iron';
  if(/אריז/.test(tp)) return 'pack';
  return 'other';
}
/* --- רשימות נשלטות --- */
function b39MachineTypes(){
  var raw = setting('machine_types') || 'מכונת כביסה|בכביסה,מייבש|בייבוש,מעגילה (גיהוץ)|בגיהוץ וקיפול,עמדת אריזה|באריזה';
  return raw.split(',').map(function(s){
    var q = String(s).split('|');
    return {name:String(q[0]||'').trim(), stage:String(q[1]||'').trim()};
  }).filter(function(x){ return x.name; });
}
function b39SimpleLocations(){
  return (setting('equipment_locations')||'').split(',').map(s=>String(s).trim()).filter(Boolean);
}
function b39AllLocations(){
  var out = (DB.warehouses||[]).filter(w=>w.active!=='לא').map(w=>String(w.name||'').trim()).filter(Boolean);
  b39SimpleLocations().forEach(function(l){ if(out.indexOf(l)===-1) out.push(l); });
  return out;
}

function b39SelectValue(selId, val){
  var s = el(selId); if(!s) return;
  if(!Array.prototype.some.call(s.options, o=>o.value===val)){
    var op = document.createElement('option'); op.value=val; op.textContent=val; s.insertBefore(op, s.options[1]||null);
  }
  s.value = val;
  var box = el(selId+'_add'); if(box){ box.style.display='none'; box.innerHTML=''; }
}
async function b39SaveMachType(){
  var nm = (el('f_mtype2_nm').value||'').trim(), st = el('f_mtype2_st').value;
  if(!nm) return toast('שם סוג חובה', true);
  var list = b39MachineTypes();
  if(list.some(x=>x.name===nm)) return toast('סוג בשם הזה כבר קיים', true);
  list.push({name:nm, stage:st});
  var val = list.map(x=>x.name+'|'+x.stage).join(',');
  var r = await apiBusy('updateSetting',{key:'machine_types', value:val});
  if(!r||!r.ok) return toast((r&&r.error)||'שמירה נכשלה', true);
  var s0=(DB.settings||[]).find(x=>x.key==='machine_types'); if(s0) s0.value=val; else DB.settings.push({key:'machine_types',value:val});
  b39SelectValue('f_mtype2', nm);
  var stSel = el('f_mstage'); if(stSel) stSel.value = st;
  toast('הסוג נוסף');
}
async function b39SaveLocation(selId){
  var nm = (el(selId+'_nm').value||'').trim();
  if(!nm) return toast('שם מיקום חובה', true);
  if(b39AllLocations().indexOf(nm)>-1) return toast('מיקום בשם הזה כבר קיים', true);
  if(el(selId+'_kind').value==='wh'){
    var r = await apiBusy('create',{table:'warehouses',row:{name:nm, city:el(selId+'_city').value, phone:el(selId+'_phone').value, address:el(selId+'_addr').value, active:'כן'}});
    if(!r||!r.ok) return toast((r&&r.error)||'יצירת המחסן נכשלה', true);
    (DB.warehouses=DB.warehouses||[]).push(r.row);
    toast('המחסן נוסף');
  } else {
    var list = b39SimpleLocations(); list.push(nm);
    var val = list.join(',');
    var r2 = await apiBusy('updateSetting',{key:'equipment_locations', value:val});
    if(!r2||!r2.ok) return toast((r2&&r2.error)||'שמירה נכשלה', true);
    var s1=(DB.settings||[]).find(x=>x.key==='equipment_locations'); if(s1) s1.value=val; else DB.settings.push({key:'equipment_locations',value:val});
    toast('המיקום נוסף');
  }
  b39SelectValue(selId, nm);
}

  };
  var machCard = function(m){

      '<div class="eq-b"><span class="eq-chip" style="background:'+stCol+'">'+esc(m.status||'')+'</span>'+
      (due?'<span class="eq-chip" style="background:var(--amber)">טיפול קרוב</span>':'')+'</div></div>';
  };
  var bad = (DB.carts||[]).filter(c=>String(c.condition||'תקינה')!=='תקינה');
  /* B42: שני טאבי ציוד ושני טאבי תחזוקה, מופרדים ויזואלית — תפקיד שונה, קבוצה שונה */

  var openF = b42Can()? b42OpenFaults().length : 0;
  var tabs = '<div class="tabs">'+
    '<button class="'+(ASSET_TAB==='carts'?'on':'')+'" onclick="b42SetTab(\'carts\')">עגלות</button>'+
    '<button class="'+(ASSET_TAB==='machines'?'on':'')+'" onclick="b42SetTab(\'machines\')">מכונות</button>'+
    (b42Can()?'<span class="tabsep"></span>'+
      '<button class="mnt '+(ASSET_TAB==='faults'?'on':'')+'" onclick="b42SetTab(\'faults\')">תקלות פתוחות'+
        (openF?'<span class="tabbadge">'+openF+'</span>':'')+'</button>'+
      '<button class="mnt '+(ASSET_TAB==='visits'?'on':'')+'" onclick="b42SetTab(\'visits\')">ביקורי טכנאי</button>':'')+
    '</div>';
  var body;
  if(ASSET_TAB==='machines')
    body = '<div class="section-title"><h2>מכונות</h2><button class="btn ghost sm" onclick="machForm()">+ מכונה</button></div>'+
      (DB.machines.length?'<div class="eqgrid">'+DB.machines.map(machCard).join('')+'</div>':'<div class="card empty">אין מכונות — לחץ "+ מכונה"</div>');

      (bad.length?'<div class="card" style="background:#FDECEA;border-color:var(--danger);padding:8px 10px;font-size:13px">⚠ '+bad.length+' עגלות מסומנות כלא תקינות: '+bad.map(c=>esc(c.id)).join(', ')+'</div>':'')+

  el('main').innerHTML = '<div class="section-title"><h2>עגלות ומכונות</h2></div>'+tabs+body;
}

/* ================= B42: תקלות, טיפולים וביקורי טכנאי =================
   חל על מכונות ועל עגלות כאחד. ההבדל היחיד ביניהן הוא שדה המצב:
     מכונה → status (פעילה/בתיקון/מושבתת)   עגלה → condition (תקינה/דורשת טיפול/מושבתת)
   כל הידע הזה מרוכז ב-b42Meta ואסור לפזר אותו במקומות נוספים.
   הרשאה: מנהל ומשרד בלבד. הסתרת הכפתורים כאן היא נוחות — האכיפה האמיתית בשרת. */
var B42_NEXT_STEPS = ['ממתין לטכנאי','הוזמן חלק חילוף','בטיפול פנימי','ממתין להצעת מחיר','ממתין להחלטת הנהלה','אחר'];
var B42_OUTCOMES = ['תוקנה','הושבתה סופית','לא הייתה תקלה'];
var B42_EXP_CATS = ['תחזוקה','רכש מלאי','כימיקלים','דלק ורכב','חשמל ומים','אחר'];
var B42_METHODS = ['העברה','אשראי','שיק','מזומן'];

function b42Can(){ return ROLE==='מנהל' || ROLE==='משרד'; }
function b42Meta(type){
  if(type==='עגלה') return {type:'עגלה', arr:'carts', field:'condition', states:['תקינה','דורשת טיפול','מושבתת'], onFault:'דורשת טיפול'};
  return {type:'מכונה', arr:'machines', field:'status', states:['פעילה','בתיקון','מושבתת'], onFault:'בתיקון'};
}
function b42Row(type,id){ return (DB[b42Meta(type).arr]||[]).find(function(x){ return String(x.id)===String(id); }); }
function b42Label(type,id){
  var r = b42Row(type,id);
  if(!r) return (type||'')+' '+(id||'');
  return type==='עגלה' ? ('עגלה '+r.id) : (String(r.type||'מכונה')+' '+r.id);
}
function b42State(type,id){ var r=b42Row(type,id); return r? String(r[b42Meta(type).field]||'') : ''; }
function b42Providers(){ return (DB.serviceProviders||[]).filter(function(x){ return x.active!=='לא'; }); }
function b42ProvName(id){
  var p=(DB.serviceProviders||[]).find(function(x){ return x.id===id; });
  if(!p) return '';
  return p.company ? (p.company + (p.name && p.name!==p.company ? ' · '+p.name : '')) : p.name;
}
function b42Faults(){ return (DB.assetFaults||[]).slice().sort(function(a,b){ return String(b.reported_at||'').localeCompare(String(a.reported_at||'')); }); }
function b42OpenFaults(){ return b42Faults().filter(function(f){ return f.status==='פתוחה'; }); }
function b42FaultOf(type,id){ return b42OpenFaults().find(function(f){ return f.asset_type===type && String(f.asset_id)===String(id); }); }
function b42Events(filter){
  return (DB.faultEvents||[]).filter(filter||function(){return true;})
    .slice().sort(function(a,b){ return String(b.ts||'').localeCompare(String(a.ts||'')); });
}
function b42AssetEvents(type,id){ return b42Events(function(e){ return e.asset_type===type && String(e.asset_id)===String(id); }); }
function b42Agor(v){ return ils((Number(v)||0)/100); }
function b42SumCost(evs){ return evs.reduce(function(s,e){ return s + (Number(e.cost_agorot)||0); },0); }
function b42Docs(ev){
  return String(ev.doc_urls||'').split('|').filter(Boolean).map(function(x){
    var q=x.split('::'); return {kind:q[0]||'כללי', name:q[1]||'מסמך', url:q[2]||''};
  });
}
async function b42Reload(){ var g = await api('getAll'); if(g && g.ok) DB = g.db; }

async function b42SaveProv(selId){
  var nm = (el(selId+'_nm').value||'').trim();
  if(!nm) return toast('שם איש הקשר חובה', true);
  var r = await apiBusy('b42SaveProvider',{
    name:nm, company:el(selId+'_co').value, domain:el(selId+'_dom').value,
    phone:el(selId+'_ph').value, email:el(selId+'_em').value, vat_id:el(selId+'_vat').value, notes:el(selId+'_nt').value
  });
  if(!r||!r.ok) return toast((r&&r.error)||'השמירה נכשלה', true);
  (DB.serviceProviders=DB.serviceProviders||[]).push(r.provider);
  if(r.supplier) (DB.suppliers=DB.suppliers||[]).push(r.supplier);
  var sel = el(selId);
  if(sel){
    var op=document.createElement('option');
    op.value=r.provider.id; op.textContent=(r.provider.company||r.provider.name)+(r.provider.domain?' · '+r.provider.domain:'');
    sel.insertBefore(op, sel.options[1]||null); sel.value=r.provider.id;
  }
  var box=el(selId+'_add'); if(box){ box.style.display='none'; box.innerHTML=''; }
  toast(r.supplier_linked ? 'נוסף וקושר לספק קיים באותו שם' : 'איש המקצוע נוסף (ונרשם גם כספק)');
}

/* ---------- בלוק עלות + מסמכים, משותף לכל הטפסים ---------- */

        '<input id="'+pfx+'_exdoc" type="file" accept="image/*,.pdf"></div>'+

function b42CostToggle(pfx){
  var v = Number((el(pfx+'_cost')||{}).value||0);
  var box = el(pfx+'_exp'); if(box) box.style.display = v>0 ? 'block' : 'none';
  if(v>0) b44ProvDue(pfx+'_prov');   /* B44: מרענן את המועד המוצע כשהבלוק נפתח */
}
function b42PaidToggle(pfx){
  var on = el(pfx+'_paid') && el(pfx+'_paid').checked;
  if(el(pfx+'_paidbox')) el(pfx+'_paidbox').style.display = on?'block':'none';
  if(el(pfx+'_unpaidbox')) el(pfx+'_unpaidbox').style.display = on?'none':'block';
}
function b42CostPayload(pfx){
  var v = Number((el(pfx+'_cost')||{}).value||0);
  if(!(v>0)) return {cost_agorot:0};
  var paid = !!(el(pfx+'_paid') && el(pfx+'_paid').checked);
  return {
    cost_agorot: Math.round(v*100),
    expense_category: (el(pfx+'_cat')||{}).value || 'תחזוקה',
    expense_paid: paid,
    expense_due_date: paid ? '' : ((el(pfx+'_due')||{}).value||''),
    expense_method: paid ? ((el(pfx+'_meth')||{}).value||'העברה') : '',
    expense_paid_at: paid ? ((el(pfx+'_paidat')||{}).value||'') : ''
  };
}
async function b42File64(f){
  return await new Promise(function(res){ var rd=new FileReader(); rd.onload=function(){ res(rd.result.split(',')[1]); }; rd.readAsDataURL(f); });
}
/* מעלה את מסמכי הטופס לאירוע שנוצר. כישלון בהעלאה לא מבטל את הרישום עצמו. */
async function b42UploadDocs(pfx, eventId){
  var jobs = [];
  var ex = el(pfx+'_exdoc');
  if(ex && ex.files && ex.files[0]) jobs.push({f:ex.files[0], kind:'הוצאה'});
  var gen = el(pfx+'_docs');
  if(gen && gen.files) for(var i=0;i<gen.files.length;i++) jobs.push({f:gen.files[i], kind:'כללי'});
  if(!jobs.length) return;
  for(var j=0;j<jobs.length;j++){
    var f = jobs[j].f;
    if(f.size > 4*1024*1024){ toast('הקובץ '+f.name+' גדול מ-4MB ולא הועלה', true); continue; }
    toast('מעלה '+f.name+'...');
    try{
      var b64 = await b42File64(f);
      var u = await api('b42UploadDoc',{event_id:eventId, base64:b64, mime:f.type, name:f.name, doc_kind:jobs[j].kind});
      if(!u || !u.ok) toast((u&&u.error)||'העלאת '+f.name+' נכשלה', true);
    }catch(e){ toast('העלאת '+f.name+' נכשלה', true); }
  }
}

/* ---------- תפריט "תיקונים / תקלות" מכרטיס הנכס ---------- */

  var open = b42FaultOf(type,id);

  var cost = b42SumCost(evs);
  openModal('<h2>תיקונים / תקלות — '+esc(b42Label(type,id))+'</h2>'+
    '<div class="sub" style="margin-bottom:10px">מצב נוכחי: <b>'+esc(b42State(type,id)||'—')+'</b>'+
      (evs.length?' · '+evs.length+' רישומים · סה\u0022כ עלויות '+b42Agor(cost):'')+'</div>'+
    (open?'<div class="card" style="background:#FDECEA;border-color:var(--danger);padding:10px;margin-bottom:10px">'+

/* ---------- כרטיס תקלה ---------- */
function b42FaultCard(fid){

  openModal('<div class="row" style="align-items:center;gap:10px"><div class="grow">'+
      '<h2 style="margin:0">תקלה — '+esc(b42Label(f.asset_type,f.asset_id))+'</h2>'+
      '<div class="sub">'+esc(f.id)+' · דווחה '+esc(f.reported_at||'')+' ע\u0022י '+esc(f.reported_by||'')+'</div></div>'+
      '<span class="chip" style="background:'+(openF?'var(--danger)':'var(--ok)')+'">'+esc(f.status)+'</span></div>'+
    '<table style="margin-top:12px">'+
      '<tr><th>פירוט</th><td style="white-space:pre-wrap">'+esc(f.description)+'</td></tr>'+
      '<tr><th>נעשה עד כה</th><td style="white-space:pre-wrap">'+esc(f.done_so_far)+'</td></tr>'+
      '<tr><th>שלב הבא</th><td>'+(openF?esc(f.next_step):'—')+'</td></tr>'+
      '<tr><th>מצב הנכס</th><td>'+esc(b42State(f.asset_type,f.asset_id)||'—')+'</td></tr>'+
      (openF?'':'<tr><th>תוצאה</th><td>'+esc(f.close_outcome||'')+' — '+esc(f.close_note||'')+
        '<div class="muted" style="font-size:12px">'+esc(f.closed_at||'')+' · '+esc(f.closed_by||'')+'</div></td></tr>')+
      '<tr><th>סה\u0022כ עלויות</th><td><b>'+b42Agor(cost)+'</b></td></tr>'+
    '</table>'+
    (openF?'<div class="actrow" style="margin-top:12px">'+
      '<button class="btn pri" onclick="b42EventForm({fault_id:\''+esc(f.id)+'\'})">הוסף שלב / תיקון</button>'+
      '<button class="btn ghost" onclick="b42CloseForm(\''+esc(f.id)+'\')">סגור תקלה</button>'+
      (f.task_id?'<button class="btn ghost" onclick="closeModal();go(\'tasks\');openTask(\''+esc(f.task_id)+'\')">פתח משימה</button>':'')+
      '</div>':'')+
    '<div class="section-title" style="margin-top:14px"><h3>מהלך הטיפול</h3></div>'+
    b42EventsHtml(evs));
}
function b42EventsHtml(evs){
  if(!evs.length) return '<div class="card empty">אין רישומים</div>';
  return evs.map(function(e){
    var docs = b42Docs(e);
    var col = e.event_type==='תקלה'?'var(--danger)':(e.event_type==='סגירה'?'var(--ok)':(e.event_type==='טיפול'?'var(--teal)':'var(--navy2)'));
    return '<div class="card" style="padding:10px"><div class="row" style="align-items:flex-start;gap:8px">'+
      '<span class="chip" style="background:'+col+'">'+esc(e.event_type)+'</span>'+
      '<div class="grow"><div style="white-space:pre-wrap">'+esc(e.description)+'</div>'+
      '<div class="muted" style="font-size:12px;margin-top:3px">'+esc(e.ts||'')+
        (e.user?' · '+esc(e.user):'')+
        (e.provider_id?' · '+esc(b42ProvName(e.provider_id)):'')+
        (e.other_subject?' · נושא: '+esc(e.other_subject):'')+
        (e.visit_id?' · ביקור '+esc(e.visit_id):'')+'</div>'+
      (docs.length?'<div class="row" style="gap:6px;margin-top:5px;flex-wrap:wrap">'+docs.map(function(d){
        return '<a class="btn ghost sm" target="_blank" href="'+esc(d.url)+'">'+(d.kind==='הוצאה'?'🧾 ':'📎 ')+esc(d.name)+'</a>'; }).join('')+'</div>':'')+
      (e.fexp_id&&!e.expense_id?'<div class="muted" style="font-size:12px;color:var(--amber);margin-top:3px">חוב שטרם שולם — מופיע בהוצאות עתידיות</div>':'')+
      (e.expense_id?'<div class="muted" style="font-size:12px;color:var(--ok);margin-top:3px">שולם — נרשם בהוצאות</div>':'')+
      '</div>'+
      (Number(e.cost_agorot)>0?'<div style="font-weight:700;white-space:nowrap">'+b42Agor(e.cost_agorot)+'</div>':'')+
      '</div></div>';
  }).join('');
}

/* opts: {fault_id} | {asset_type,asset_id} | {visit_id} | {other:true} */
function b42EventForm(opts){
  opts = opts||{};
  var f = opts.fault_id ? (DB.assetFaults||[]).find(function(x){ return x.id===opts.fault_id; }) : null;
  var title = f ? ('שלב חדש בתקלה — '+b42Label(f.asset_type,f.asset_id))
    : (opts.visit_id ? 'פעולה בביקור' : (opts.other ? 'פעולה בנושא אחר (תשתיות / מבנה)'
    : 'פעולה — '+b42Label(opts.asset_type,opts.asset_id)));
  var back = f ? 'b42FaultCard(\''+esc(f.id)+'\')' : (opts.visit_id ? 'b42VisitCard(\''+esc(opts.visit_id)+'\')'
    : (opts.other ? 'closeModal()' : 'b42Menu(\''+esc(opts.asset_type)+'\',\''+esc(opts.asset_id)+'\')'));
  var assetPick = '';
  if(opts.visit_id){
    var machs = (DB.machines||[]).map(function(m){ return '<option value="מכונה|'+esc(m.id)+'">'+esc(String(m.type||'מכונה')+' '+m.id)+'</option>'; }).join('');
    var carts = (DB.carts||[]).map(function(c){ return '<option value="עגלה|'+esc(c.id)+'">עגלה '+esc(c.id)+'</option>'; }).join('');
    assetPick = '<div class="frow"><label>על מה בוצעה הפעולה</label><select id="be_asset" onchange="b42EvtAssetChg()">'+
      '<option value="">— אחר: תשתיות / מבנה —</option>'+machs+carts+'</select></div>'+
      '<div class="frow" id="be_otherwrap"><label>נושא הפעולה</label><input id="be_other" placeholder="למשל: תאורה באזור הקיפול"></div>';
  } else if(opts.other){
    assetPick = '<div class="frow"><label>נושא הפעולה <b style="color:var(--danger)">*</b></label>'+
      '<input id="be_other" placeholder="למשל: דוד מים, תאורה, דלת המחסן"></div>';
  }
  openModal('<h2>'+esc(title)+'</h2>'+
    assetPick+
    '<div class="frow"><label>מה נעשה בשלב הזה <b style="color:var(--danger)">*</b></label>'+
      '<textarea id="be_desc" rows="3"></textarea></div>'+
    b42ProvPicker('be_prov','', 'איש מקצוע / חברת שירות (רשות)')+
    (f?'<div class="frow"><label>עדכון השלב הבא</label><select id="be_next">'+
      B42_NEXT_STEPS.map(function(s){ return '<option'+(f.next_step===s?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></div>':'')+
    b42CostHtml('be')+
    '<div class="row"><button class="btn" onclick=\'b42DoEvent('+JSON.stringify(opts).replace(/'/g,"&#39;")+')\'>שמור</button>'+
    '<button class="btn ghost" onclick="'+back+'">ביטול</button></div>');
}
function b42EvtAssetChg(){
  var v = (el('be_asset')||{}).value||'';
  var w = el('be_otherwrap'); if(w) w.style.display = v? 'none':'block';
}
async function b42DoEvent(opts){
  opts = opts||{};
  var desc=(el('be_desc').value||'').trim();
  if(desc.length<3) return toast('פירוט מה נעשה חובה', true);
  var pay = {event_type: opts.fault_id? 'שלב' : (opts.visit_id? 'ביקור':'טיפול'), description:desc,
    provider_id: (el('be_prov')||{}).value||''};
  if(opts.fault_id){ pay.fault_id=opts.fault_id; if(el('be_next')) pay.next_step=el('be_next').value; }
  if(opts.visit_id){
    pay.visit_id = opts.visit_id;
    var sel=(el('be_asset')||{}).value||'';
    if(sel){ var q=sel.split('|'); pay.asset_type=q[0]; pay.asset_id=q[1]; }
    else { pay.other_subject=(el('be_other')||{}).value||''; if(!String(pay.other_subject).trim()) return toast('נושא הפעולה חובה', true); }
  }
  if(opts.other){ pay.other_subject=(el('be_other')||{}).value||''; if(String(pay.other_subject).trim().length<2) return toast('נושא הפעולה חובה', true); }
  if(opts.asset_type){ pay.asset_type=opts.asset_type; pay.asset_id=opts.asset_id; }
  var cp = b42CostPayload('be');
  for(var k in cp) pay[k]=cp[k];
  var r = await act('b42AddEvent', pay, 'נרשם');
  if(!r) return;
  await b42UploadDocs('be', r.event.id);
  await b42Reload(); render();
  if(opts.fault_id) b42FaultCard(opts.fault_id);
  else if(opts.visit_id) b42VisitCard(opts.visit_id);
  else if(opts.asset_type) b42Menu(opts.asset_type, opts.asset_id);
  else closeModal();
}

  var map = {'תוקנה':meta.states[0], 'הושבתה סופית':'מושבתת', 'לא הייתה תקלה':(f.prev_state||meta.states[0])};

    '<div class="frow"><label>תוצאת הסגירה <b style="color:var(--danger)">*</b></label>'+
      '<select id="bc_out" onchange="b42CloseHint()">'+B42_OUTCOMES.map(function(o){ return '<option>'+o+'</option>'; }).join('')+'</select></div>'+
    '<div class="card" id="bc_hint" style="padding:8px 10px;font-size:13px;background:#F1F7F4;border-color:var(--ok)"></div>'+
    '<div class="frow" style="margin-top:8px"><label>פירוט הסגירה <b style="color:var(--danger)">*</b></label>'+

function b42CloseHint(){

async function b42DoClose(fid){

function b42Cuts(which){

function b42CutBody(){
  var evs = (DB.faultEvents||[]).filter(function(e){ return Number(e.cost_agorot)>0 || e.event_type!=='תקלה'; });
  var groups = {}, order = [];
  var keyOf = function(e){
    if(B42_CUT==='prov') return b42ProvName(e.provider_id) || 'ללא איש מקצוע';
    if(B42_CUT==='day')  return String(e.ts||'').substring(0,10) || '—';
    if(B42_CUT==='asset') return e.asset_id ? b42Label(e.asset_type,e.asset_id) : (e.other_subject||'תשתיות / אחר');
    return e.expense_id ? 'שולם' : (e.fexp_id ? 'חוב שטרם שולם' : 'ללא עלות');
  };
  evs.forEach(function(e){
    var k = keyOf(e);
    if(!groups[k]){ groups[k]={n:0,cost:0,rows:[]}; order.push(k); }
    groups[k].n++; groups[k].cost += (Number(e.cost_agorot)||0); groups[k].rows.push(e);
  });
  if(!order.length) return '<div class="card empty">אין עדיין נתוני תחזוקה להצגה</div>';
  order.sort(function(a,b){ return groups[b].cost - groups[a].cost; });
  var total = order.reduce(function(s,k){ return s+groups[k].cost; },0);
  return '<div class="sub" style="margin-bottom:8px">סה\u0022כ '+b42Agor(total)+' על פני '+evs.length+' רישומים</div>'+
    '<div style="overflow-x:auto"><table><tr><th>'+
      (B42_CUT==='prov'?'איש מקצוע':(B42_CUT==='day'?'תאריך':(B42_CUT==='asset'?'נכס':'מצב ההוצאה')))+
      '</th><th>רישומים</th><th>עלות</th></tr>'+
    order.map(function(k){
      return '<tr><td>'+esc(k)+'</td><td>'+groups[k].n+'</td><td><b>'+b42Agor(groups[k].cost)+'</b></td></tr>';
    }).join('')+'</table></div>';
}

/* ===== B34: אריזה ומידוף — חבילות עם ברקוד קבוע (מוצר+כמות), מארזים וליקוט =====
   גמישות הרצה: אפשר לארוז בלי מדף, לדלג על ברקוד חיצוני (יונפק אוטומטית), ולדלג על הכל. */
function b34PkgTypeOf(tid){ return (DB.packageTypes||[]).find(t=>t.id===tid); }
function b34NetOf(tid){
  return (DB.packageMoves||[]).filter(m=>String(m.type_id)===String(tid)).reduce(function(s,m){
    var c=Number(m.count)||0;
    if(m.move_type==='אריזה') return s+c;
    if(m.move_type==='ליקוט') return s-c;
    if(m.move_type==='התאמה') return s+c;
    return s;
  },0);
}
/* התרעת מלאי אבוד: אם סך היחידות הארוזות של פריט עולה על המלאי שאינו בכביסה — יש תיעוד חסר */
function b34ItemWarn(iid){
  var packedUnits = (DB.packageTypes||[]).filter(t=>t.item_id===iid && t.active!=='לא')
    .reduce((s,t)=>s + b34NetOf(t.id)*Number(t.qty||0), 0);
  if(!packedUnits) return '';
  var stock = (DB.stockMoves||[]).filter(m=>m.item_id===iid).reduce((s,m)=>s+Number(m.qty||0),0);
  var wash = (DB.laundryTasks||[]).filter(t=>t.item_id===iid && t.stage!=='מוכן').reduce((s,t)=>s+Number(t.qty||0),0);
  var free = stock - wash;
  if(packedUnits > free) return '⚠ רשומות '+packedUnits+' יח\' ארוזות אבל במלאי (מחוץ לכביסה) רק '+free+' — ייתכן מלאי אבוד או תיעוד חסר';
  return '';
}

/* ============================================================
   B35: ניהול מחסן ומיקומים
   כל היתרות מחושבות מ-DB.packageMoves — בדיוק אותה נוסחה כמו בשרת.
   מדף ריק ('') = מלאי לא ממודף. זה מצב חוקי ומכוון: אפשר לארוז, ללקט ולשלוח בלי מדף.
   ============================================================ */
function b35Map(tid){
  var m={};
  var add=function(k,n){ k=String(k||''); m[k]=(m[k]||0)+n; if(!m[k]) delete m[k]; };
  (DB.packageMoves||[]).filter(function(x){ return String(x.type_id)===String(tid); }).forEach(function(x){
    var c=Number(x.count)||0, to=String(x.shelf_code||''), fr=String(x.from_shelf||'');
    if(x.move_type==='אריזה') add(to,c);
    else if(x.move_type==='ליקוט') add(to,-c);
    else if(x.move_type==='התאמה') add(to,c);
    else if(x.move_type==='מידוף'){ add(fr,-c); add(to,c); }
  });
  return m;
}
function b35Shelves(){ return (DB.shelves||[]).filter(function(s){ return s.active!=='לא'; }); }
function b35ShelfBy(code){ var c=String(code||'').trim(); if(!c) return null;
  return (DB.shelves||[]).find(function(s){ return String(s.code)===c||String(s.barcode)===c; })||null; }
function b35TypeBy(key){ var k=String(key||'').trim(); if(!k) return null;
  return (DB.packageTypes||[]).find(function(t){ return t.id===k||String(t.barcode)===k; })||null; }
function b35Types(){ return (DB.packageTypes||[]).filter(function(t){ return t.active!=='לא'; }); }
function b35TypeLabel(t){ if(!t) return ''; var it=(DB.items||[]).find(function(i){ return i.id===t.item_id; })||{};
  return t.qty+' × '+(it.name||'')+(it.color?' '+it.color:''); }
function b35ShelfContents(code){
  var c=String(code||''), out=[];
  (DB.packageTypes||[]).forEach(function(t){
    var q=b35Map(t.id)[c]||0; if(!q) return;
    var it=(DB.items||[]).find(function(i){ return i.id===t.item_id; })||{};
    out.push({type_id:t.id,barcode:t.barcode,item_id:t.item_id,item_name:it.name||'',color:it.color||'',
      per_pkg:Number(t.qty)||0,packages:q,units:q*(Number(t.qty)||0)});
  });
  return out.sort(function(a,b){ return b.units-a.units; });
}
function b35TypeLocs(tid){
  var m=b35Map(tid);
  return Object.keys(m).filter(function(k){ return m[k]; })
    .map(function(k){ return {shelf:k,packages:m[k]}; }).sort(function(a,b){ return b.packages-a.packages; });
}
/* מיקומי פריט — איחוד כל סוגי החבילות של אותו פריט לפי מדף */
function b35ItemLocs(iid){
  var agg={};
  (DB.packageTypes||[]).filter(function(t){ return t.item_id===iid; }).forEach(function(t){
    var m=b35Map(t.id);
    Object.keys(m).forEach(function(k){
      if(!m[k]) return;
      agg[k]=agg[k]||{packages:0,units:0};
      agg[k].packages+=m[k]; agg[k].units+=m[k]*(Number(t.qty)||0);
    });
  });
  return Object.keys(agg).map(function(k){ return {shelf:k,packages:agg[k].packages,units:agg[k].units}; })
    .sort(function(a,b){ return b.units-a.units; });
}

}
function b35StSetShelf(silent){
  var inp = el('st_shelf'); if(!inp) return;
  var raw = (inp.value||'').trim();
  if(!raw){ B35_ST.shelf=''; el('st_shelfInfo').innerHTML=''; b35StFromOptions(); return; }
  var sh = b35ShelfBy(raw);
  if(!sh){
    B35_ST.shelf='';
    el('st_shelfInfo').innerHTML='<span style="color:var(--danger)">מדף לא מזוהה — סרוק את המדבקה שהודפסה מהמערכת</span>';
    b35StFromOptions();
    if(!silent) toast('מדף לא נמצא', true);
    return;
  }
  B35_ST.shelf = String(sh.code); inp.value = String(sh.code);
  var cont = b35ShelfContents(sh.code);
  el('st_shelfInfo').innerHTML = (sh.location?esc(sh.location)+' · ':'')+
    (cont.length? 'כרגע על המדף: '+cont.reduce(function(a,x){return a+x.packages;},0)+' חבילות · '+cont.length+' סוגים' : 'המדף ריק');

function b35StRender(){
  var box = el('st_list'); if(!box) return;
  if(!B35_ST.lines.length){ box.innerHTML='<div class="empty" style="margin:8px 0">טרם נסרקה חבילה</div>'; return; }
  box.innerHTML = '<table style="margin:8px 0"><tr><th>חבילה</th><th>זמין במקור</th><th>כמות</th><th></th></tr>'+
    B35_ST.lines.map(function(L,i){
      var t=b35TypeBy(L.type_id)||{};
      var avail = b35Map(L.type_id)[B35_ST.from]||0;
      var over = L.count>avail;
      return '<tr><td>'+esc(b35TypeLabel(t))+'<div class="muted" style="font-size:11px">'+esc(t.barcode||'')+'</div></td>'+
        '<td'+(over?' style="color:var(--danger);font-weight:700"':'')+'>'+avail+'</td>'+
        '<td><input type="number" min="1" value="'+L.count+'" style="width:70px" '+
          'onchange="B35_ST.lines['+i+'].count=Math.max(1,Math.round(Number(this.value)||1));b35StRender()"></td>'+
        '<td><button class="btn ghost sm" onclick="B35_ST.lines.splice('+i+',1);b35StRender()">✕</button></td></tr>';
    }).join('')+'</table>'+
    (B35_ST.lines.some(function(L){ return L.count>(b35Map(L.type_id)[B35_ST.from]||0); })
      ? '<div class="chip" style="background:var(--danger);color:#fff;display:block;padding:8px;margin-bottom:8px">יש שורה שחורגת מהזמין ב'+esc(b35SrcName(B35_ST.from))+' — תקן לפני הרישום</div>' : '');
}
function b35StAdd(tid,n){
  var ex = B35_ST.lines.find(function(x){ return x.type_id===tid; });
  if(ex) ex.count += n; else B35_ST.lines.push({type_id:tid,count:n});
  if(navigator.vibrate) navigator.vibrate(40);
  b35StRender();
}
function b35StScan(){
  var inp = el('st_pkg'); var bc=(inp.value||'').trim(); inp.value=''; if(!bc) return;
  var sh = b35ShelfBy(bc);
  if(sh){ el('st_shelf').value=sh.code; b35StSetShelf(); return toast('מדף היעד עודכן ל'+sh.code); }
  var t = b35TypeBy(bc);
  if(!t) return toast('הברקוד לא מזוהה כחבילה במערכת', true);
  b35StAdd(t.id,1);
  inp.focus();
}
function b35StManual(){
  var tid = el('st_type').value, n = Math.round(Number(el('st_qty').value)||0);
  if(!tid) return toast('בחר סוג חבילה', true);
  if(!(n>0)) return toast('הזן כמות', true);
  b35StAdd(tid,n); el('st_qty').value=1;
}
async function b35StSubmit(){
  if(!B35_ST.shelf) return toast('סרוק או הקלד מדף יעד', true);
  if(!B35_ST.lines.length) return toast('לא נסרקה אף חבילה', true);
  var r = await apiBusy('b35ShelveBatch',{to_shelf:B35_ST.shelf, from_shelf:B35_ST.from, lines:B35_ST.lines.slice()});
  if(!r) return;
  if(!r.ok) return toast(r.error||'שגיאה', true);
  var moved = B35_ST.lines.reduce(function(a,x){ return a+x.count; },0);
  B35_ST.lines = [];
  await b35Refresh(); b35Repaint();
  b35StSetShelf(true); b35StRender();
  toast('מודפו '+moved+' חבילות למדף '+B35_ST.shelf);
  var pk = el('st_pkg'); if(pk) pk.focus();
}

/* ---------- העברת שורה בודדת בין מדפים ---------- */
function b35MoveForm(fromCode, tid){
  if(!b35CanWh()) return toast('אין הרשאה לפעולות מחסן', true);
  var t = b35TypeBy(tid); if(!t) return;
  var have = b35Map(tid)[String(fromCode||'')]||0;
  var targets = b35Shelves().filter(function(s){ return String(s.code)!==String(fromCode||''); });
  if(!targets.length && fromCode==='') return toast('אין מדף יעד', true);
  openModal('<h2>העברה מ'+esc(b35SrcName(fromCode))+'</h2>'+
    '<p class="muted" style="font-size:13px">'+esc(b35TypeLabel(t))+' · זמין כאן: <b>'+have+'</b> חבילות</p>'+
    '<div class="frow"><label>מדף יעד</label><select id="mv_to">'+
      (fromCode?'<option value="__free">החזרה למלאי לא ממודף</option>':'')+
      targets.map(function(s){ return '<option value="'+esc(s.code)+'">'+esc(s.code)+(s.location?' · '+esc(s.location):'')+'</option>'; }).join('')+'</select></div>'+
    '<div class="frow"><label>כמות חבילות</label><input id="mv_n" type="number" min="1" max="'+have+'" value="'+have+'"></div>'+
    '<button class="btn grow" style="width:100%" onclick="b35DoMove(\''+esc(String(fromCode||''))+'\',\''+tid+'\')">בצע העברה</button>');
}
async function b35DoMove(fromCode, tid){
  var to = el('mv_to').value, n = Math.round(Number(el('mv_n').value)||0);
  if(!(n>0)) return toast('הזן כמות', true);
  var r;
  if(to==='__free'){
    r = await apiBusy('b35ShelfClear',{shelf_code:fromCode, type_id:tid, note:'החזרה למלאי לא ממודף'});
  } else {
    r = await apiBusy('b35ShelveBatch',{to_shelf:to, from_shelf:fromCode, lines:[{type_id:tid,count:n}], note:'העברה בין מיקומים'});
  }
  if(!r) return;
  if(!r.ok) return toast(r.error||'שגיאה', true);
  closeModal(); await b35Refresh(); b35Repaint(); toast('ההעברה נרשמה');
}

var SHELF_Q = '';
function rShelves(){
  if(!DB.shelves) DB.shelves = [];
  var q = SHELF_Q.trim().toLowerCase();
  var all = (DB.shelves||[]);
  var rows = all.map(function(sh){
    var cont = b35ShelfContents(sh.code);
    return {sh:sh, cont:cont,
      packages:cont.reduce(function(a,x){return a+x.packages;},0),
      units:cont.reduce(function(a,x){return a+x.units;},0)};
  });
  if(q) rows = rows.filter(function(r){

async function saveShelf(id){
  if(!el('fs_code').value) return toast('קוד מדף חובה', true);
  var row = {code:el('fs_code').value,location:el('fs_loc').value,
    warehouse_id:el('fs_wh').value,notes:el('fs_notes').value,active:el('fs_active').value};
  var r = id? await act('update',{table:'shelves',id:id,row:row},'עודכן') : await act('create',{table:'shelves',row:row},'המדף נוסף');
  if(r){
    closeModal();
    /* B34a: מדף חדש (או ותיק שקיבל ברקוד עכשיו) — פותחים מיד את הדפסת המדבקה */
    if(r.row && r.row.barcode && (!id || !(DB.shelves||[]).find(s=>s.id===id && s.barcode)))
      b34PrintShelfLabel(r.row.barcode, r.row.code+(r.row.location?' · '+r.row.location:''));
  }
}
/* B34a: הדפסת מדבקת ברקוד למדף */
function b34PrintShelfLabel(code, label){
  if(!code) return toast('למדף אין ברקוד — פתח עריכה ושמור כדי להנפיק', true);
  var w = window.open('','_blank');
  w.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:Arial;display:flex;flex-wrap:wrap;gap:6px;padding:8px}.lbl{border:1px dashed #999;padding:8px;text-align:center;font-size:12px;page-break-inside:avoid}</style></head><body>'+
    '<div class="lbl">'+safeBarcode(String(code))+'<div><b>מדף '+esc(label||'')+'</b></div></div>'+
    '<script>window.onload=function(){window.print();}<\/script></body></html>');
  w.document.close();
}

function empTabAttendance(eid){
  var rows = (DB.attendance||[]).filter(a=>a.employee_id===eid).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  var totalHours = Math.round(rows.reduce((s,a)=>s+(Number(a.hours)||0),0)*100)/100;
  var effHours = Math.round(rows.reduce((s,a)=>s+attEff(a),0)*100)/100;
  var voidHours = Math.round(rows.reduce((s,a)=>s+attVoid(a),0)*100)/100;
  return '<div class="card"><b>סה"כ שעות שנרשמו: </b>'+totalHours+' · <b>מזכות בשכר: </b>'+effHours+
    (voidHours>0?' · <span style="color:var(--danger)"><b>נפסלו: </b>'+voidHours+'</span>':'')+'</div>'+
    (rows.length? '<div class="card"><table><tr><th>תאריך</th><th>כניסה</th><th>יציאה</th><th>שעות</th><th>פסילה</th></tr>'+
    rows.map(function(a){var dts=a.in_date?(esc(a.in_date)+(a.out_date&&a.out_date!==a.in_date?' ← '+esc(a.out_date):'')):esc(a.date);
      var v=attVoid(a);
      var hc=(a.hours!==''&&a.hours!==undefined)?(v>0?'<span style="text-decoration:line-through;color:var(--muted)">'+(Number(a.hours)||0)+'</span> <b>'+attEff(a)+'</b>':String(a.hours)):'—';
      return '<tr><td>'+dts+'</td><td>'+esc(a.in_time)+'</td><td>'+esc(a.out_time||'—')+'</td><td>'+hc+'</td><td>'+(v>0?'<span class="chip" style="background:var(--danger)">'+v+'</span> <span class="muted" style="font-size:11px">'+esc(a.void_reason||'')+'</span>':'<span class="muted">—</span>')+'</td></tr>';}).join('')+'</table></div>'
    : '<div class="card empty">אין רישומי נוכחות</div>');
}
function empTabPayroll(eid){

// F2: סיסמה אקראית בת 8 תווים — ללא תווים דו-משמעיים (0/O, 1/l/I)
function genPassword(){
  var CH = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '';
  var a = new Uint32Array(8); crypto.getRandomValues(a);
  for(var i=0;i<8;i++) out += CH.charAt(a[i] % CH.length);
  return out;
}

/* ============================================================
   B44 — גשר ליקוט מכרטיס ההזמנה · מועדי יעד מתנאי ספק · אבחון כפילות איסופים
   כל הנתונים כאן נגזרים ממה שכבר טעון ב-DB (order_lines · packageMoves ·
   packageTypes · cases · suppliers). אין פעולת שרת חדשה: הליקוט והשיוך
   עוברים ב-casePick הקיים, וחישוב מועדי היעד ב-b43DueFrom הקיימת.
   ============================================================ */
var B44_PICK_STATUSES = ['מאושרת','סופקה'];

/* ---------- 1. ליקוט ואריזה בכרטיס ההזמנה ---------- */

/* כמה יחידות מכל פריט כבר לוקטו להזמנה: תנועות 'ליקוט' × הכמות שבחבילה.
   אותה נוסחה כמו b35Map בשרת ובממשק — רק מקובצת לפי פריט במקום לפי סוג אריזה. */
function b44PickedByItem(oid){
  var m = {};
  (DB.packageMoves||[]).forEach(function(mv){
    if(mv.move_type!=='ליקוט') return;
    if(String(mv.order_id||'')!==String(oid)) return;
    var t = (DB.packageTypes||[]).find(function(x){ return x.id===mv.type_id; });
    if(!t) return;
    m[t.item_id] = (m[t.item_id]||0) + (Number(mv.count)||0) * (Number(t.qty)||0);
  });
  return m;
}
function b44OrderCases(oid){
  return (DB.cases||[]).filter(function(c){ return c.active!=='לא' && String(c.order_id||'')===String(oid); });
}
function b44CaseChip(c){
  var bg = c.delivery_id? 'var(--ok)' : (c.status==='משויך'? 'var(--navy2)' : 'var(--muted)');
  return '<span class="chip" style="background:'+bg+';color:#fff;margin:2px">'+esc(c.barcode)+
    ' · '+esc(c.status||'')+(c.delivery_id?' · נסרק להעמסה':'')+'</span>';
}
function b44PickBlockHtml(oid){
  var o = (DB.orders||[]).find(function(x){ return x.id===oid; }); if(!o) return '';
  if(['בוטלה','הצעת מחיר'].indexOf(o.status)>-1) return '';
  var lines = (DB.orderLines||[]).filter(function(l){ return l.order_id===oid; });
  if(!lines.length) return '';
  var picked = b44PickedByItem(oid);
  var cs = b44OrderCases(oid);
  var canPick = B44_PICK_STATUSES.indexOf(o.status)>-1;
  var left = 0;
  var rows = lines.map(function(l){
    var need = Number(l.qty)||0, got = Number(picked[l.item_id]||0);
    var rem = Math.max(0, need-got);
    left += rem;
    var done = need>0 && rem===0;
    return '<tr'+(done?' style="background:#EAF7EF"':'')+'><td>'+esc(item(l.item_id))+'</td>'+
      '<td>'+need+'</td><td>'+got+'</td>'+
      '<td style="font-weight:700;color:'+(done?'var(--ok)':'var(--danger)')+'">'+(done?'✓':rem)+'</td></tr>';
  }).join('');
  return '<h3 style="margin-top:14px">ליקוט ואריזה</h3>'+
    '<table><tr><th>מוצר</th><th>הוזמן</th><th>לוקט</th><th>נותר</th></tr>'+rows+'</table>'+
    '<div class="muted" style="font-size:12.5px;margin:6px 0">'+
      (left===0? '<span style="color:var(--ok);font-weight:600">כל הפריטים לוקטו.</span>'
               : 'נותרו '+left+' יחידות ללקט.')+
      ' הכמות מחושבת מתנועות הליקוט בפועל (חבילה × כמות בחבילה).</div>'+
    (cs.length
      ? '<div style="margin:6px 0">'+cs.map(b44CaseChip).join(' ')+'</div>'
      : '<div class="muted" style="font-size:12.5px;margin:6px 0">טרם שויך מארז להזמנה.</div>')+
    (CAN_EDIT
      ? (canPick
          ? '<div class="row" style="gap:6px;margin:8px 0">'+
              '<button class="btn ghost sm" onclick="b34PickForm(\''+oid+'\')">ליקוט למארז</button>'+
              '<button class="btn ghost sm" onclick="b44OrderScanForm(\''+oid+'\')">סריקת חבילות להזמנה</button></div>'
          : '<div class="card" style="background:#FFF3CD;border-color:#E8A33D;font-size:13px;margin:8px 0;padding:9px 11px">'+
              'ליקוט אפשרי רק בהזמנה בסטטוס <b>מאושרת</b> או <b>סופקה</b>. ההזמנה הזו בסטטוס <b>'+esc(o.status)+'</b> — '+
              (o.status==='טיוטה'?'לחץ על "אשר (בדיקת מלאי)" למעלה כדי לפתוח את הליקוט.':'לא ניתן ללקט אליה כרגע.')+'</div>')
      : '');
}

/* ברקוד מארז = ברקוד ייחודי → סריקה חוזרת שלו היא טעות ומקבלת אזהרה גלויה.
   ברקוד סוג-חבילה = משותף למאות חבילות זהות → סריקה חוזרת היא ספירה תקינה ומגדילה מונה. */
var B44_OSCAN = null;
function b44OScanMsg(txt, bad){
  var m = el('os_msg'); if(!m) return;

    '<div id="os_list" style="margin:6px 0"></div>'+

      '<button class="btn ghost grow" onclick="window.FLOOR_CAM=function(t){el(\'os_bc\').value=t;b44OrderScanAdd();};startCam()">סרוק במצלמה</button>'+
      '<button class="btn grow" onclick="b44OrderScanSave()">שמור ליקוט</button></div>');
  b44OrderScanRender();
  setTimeout(function(){ var i=el('os_bc'); if(i) i.focus(); },100);
}
function b44OrderScanRender(){
  var box = el('os_list'); if(!box) return;
  var S = B44_OSCAN; if(!S) return;
  var parts = [];
  S.cases.forEach(function(cid,i){
    var c = (DB.cases||[]).find(function(x){ return x.id===cid; })||{};
    parts.push('<span class="chip" style="background:var(--navy2);margin:2px">מארז '+esc(c.barcode||cid)+
      ' <a style="cursor:pointer;color:#fff;font-weight:700" onclick="B44_OSCAN.cases.splice('+i+',1);b44OrderScanRender()">✕</a></span>');
  });
  S.picks.forEach(function(x,i){
    var t = (DB.packageTypes||[]).find(function(y){ return y.id===x.type_id; })||{};
    var it = (DB.items||[]).find(function(y){ return y.id===t.item_id; })||{};
    parts.push('<span class="chip" style="background:var(--teal);margin:2px">'+x.count+' × ['+esc(t.qty||'')+' '+esc(it.name||'')+']'+
      ' <a style="cursor:pointer;color:#fff;font-weight:700" onclick="B44_OSCAN.picks.splice('+i+',1);b44OrderScanRender()">✕</a></span>');
  });
  box.innerHTML = parts.length? parts.join(' ') : '<span class="muted">טרם נסרק דבר</span>';
}
function b44OrderScanAdd(){
  var inp = el('os_bc'); var bc = inp? inp.value.trim() : '';
  if(inp){ inp.value=''; inp.focus(); }
  if(!bc) return;
  var S = B44_OSCAN; if(!S) return;
  var cs = (DB.cases||[]).find(function(c){ return c.active!=='לא' && (String(c.barcode)===bc || String(c.id)===bc); });
  if(cs){
    if(cs.order_id && String(cs.order_id)!==String(S.oid))
      return b44OScanMsg('✕ המארז '+cs.barcode+' משויך כבר להזמנה אחרת — שחרר אותו קודם', true);
    if(S.cases.indexOf(cs.id)>-1)
      return b44OScanMsg('⚠ המארז '+cs.barcode+' כבר ברשימה — לא נוסף פעם שנייה', true);
    S.cases.push(cs.id);
    b44OScanMsg('✓ מארז '+cs.barcode+' נוסף לרשימה');
    return b44OrderScanRender();
  }
  var pt = (DB.packageTypes||[]).find(function(t){ return t.active!=='לא' && String(t.barcode)===bc; });
  if(pt){
    var it = (DB.items||[]).find(function(y){ return y.id===pt.item_id; })||{};
    var ex = S.picks.find(function(x){ return x.type_id===pt.id; });
    if(ex){ ex.count++; b44OScanMsg('✓ '+esc(it.name||'')+' — סה"כ '+ex.count+' חבילות'); }
    else { S.picks.push({type_id:pt.id, count:1}); b44OScanMsg('✓ נוספה חבילה: '+(it.name||'')); }
    return b44OrderScanRender();
  }
  b44OScanMsg('✕ הברקוד '+bc+' אינו מוכר במערכת — לא נוסף. המשך לסרוק.', true);
}
async function b44OrderScanSave(){
  var S = B44_OSCAN; if(!S) return;
  if(!CAN_EDIT) return toast('למשתמש זה הרשאת צפייה בלבד', true);
  if(!S.cases.length && !S.picks.length) return toast('לא נסרק דבר', true);
  var target = el('os_case')? el('os_case').value : '';
  if(S.picks.length && !target) return toast('בחר מארז יעד לחבילות שנסרקו', true);
  if(S.picks.length && S.cases.indexOf(target)===-1) S.cases.push(target);
  if(BUSY) return null;
  BUSY = true; showBusy(true);
  var ok = 0, err = 0;
  try{
    for(var i=0;i<S.cases.length;i++){
      var cid = S.cases[i];
      var picks = (cid===target)? S.picks.slice() : [];
      var r = await api('casePick',{case_id:cid, order_id:S.oid, picks:picks});
      if(r && r.ok) ok++; else { err++; toast((r&&r.error)||'שגיאה בשיוך מארז', true); }
    }
  } finally { BUSY = false; showBusy(false); }
  var g = await api('getAll'); if(g && g.ok) DB = g.db;
  B44_OSCAN = null; closeModal();
  toast(err? ('נשמרו '+ok+' · '+err+' נכשלו') : ('הליקוט נשמר — '+ok+' מארזים'));
  openOrder(S.oid);
}

/* ---------- 5. מועד יעד מוצע מתנאי הספק ---------- */
/* הכרעת אבי: הימים נספרים מיום הרישום במערכת. זו הצעה בלבד — המשתמש רשאי לשנות.
   הלוגיקה עצמה היא b43NormTerms/b43DueFrom הקיימות — אין כאן חישוב תאריכים שני. */
function b44SupDueHint(terms){
  return 'מוצע לפי תנאי התשלום של הספק ('+esc(terms)+') מיום הרישום — ניתן לשנות לפני השמירה.';
}
function b44TermsOfSupplier(sid){
  var sup = sid? (DB.suppliers||[]).find(function(s){ return s.id===sid; }) : null;
  return b43NormTerms(sup && sup.payment_terms) || b43DefaultTerms();
}
/* טופס הוצאה עתידית */
function b44FexpSupDue(){
  var sel = el('f_fesup'), due = el('f_fedate'), hint = el('f_fedue_hint');
  if(!sel || !due) return;
  if(!sel.value){ if(hint) hint.innerHTML=''; return; }
  var terms = b44TermsOfSupplier(sel.value);
  var d = b43DueFrom(ymdLocal(), terms);
  if(!d) return;
  due.value = d;
  if(hint) hint.innerHTML = b44SupDueHint(terms);
}
/* בלוק העלות של B42 — איש המקצוע מקושר לספק, והספק קובע את התנאים */
function b44ProvDue(selId){
  var pfx = String(selId||'').replace(/_prov$/,'');
  var due = el(pfx+'_due'); if(!due) return;
  var hint = el(pfx+'_duehint');
  var pid = (el(selId)||{}).value || '';
  if(!pid){ if(hint) hint.innerHTML=''; return; }
  var prov = (DB.serviceProviders||[]).find(function(x){ return x.id===pid; });
  var terms = b44TermsOfSupplier(prov && prov.supplier_id);
  var d = b43DueFrom(ymdLocal(), terms);
  if(!d) return;
  due.value = d;
  if(hint) hint.innerHTML = b44SupDueHint(terms);
}

/* ---------- 4ב. אבחון: הזמנה עם יותר מרשומת איסוף אחת ---------- */
/* קריאה בלבד. לא נוגע בסטטוסים ולא מוחק דבר — רק מציף למנהל/משרד את מקור
   הכפילות, שהיא הסיבה לכך שאותו איסוף נראה גם ב"היום" וגם בהיסטוריה. */
function b44DupPickups(){
  var m = {};
  (DB.deliveries||[]).forEach(function(d){
    if(!isPickup(d) || !d.order_id) return;
    (m[d.order_id] = m[d.order_id] || []).push(d);
  });
  return Object.keys(m).filter(function(k){ return m[k].length>1; })
    .map(function(k){ return {order_id:k, rows:m[k]}; });
}
function b44DupPickupHtml(){
  if(['מנהל','משרד'].indexOf(ROLE)===-1) return '';
  var dups = b44DupPickups();
  if(!dups.length) return '';
  return '<div class="card" style="border-right:5px solid var(--amber);background:#FFF8E8;margin-top:14px">'+
    '<b style="color:var(--amber)">⚠ '+dups.length+' הזמנות עם יותר מרשומת איסוף אחת</b>'+
    '<div class="muted" style="font-size:12.5px;margin:4px 0 8px">רשומת איסוף כפולה גורמת לאותו איסוף להיראות פעמיים. '+
      'סגור את הרשומות התקועות בכפתורים שבבלוק "איסופים תקועים" למעלה. אם הכפילות חוזרת אחרי סגירה — '+
      'סימן שהמקור עדיין פעיל וצריך לטפל בו, לא בתצוגה.</div>'+
    dups.slice(0,12).map(function(x){
      var o = (DB.orders||[]).find(function(y){ return y.id===x.order_id; })||{};
      return '<div class="row" style="padding:3px 0;font-size:13px;cursor:pointer" onclick="openOrder(\''+esc(x.order_id)+'\')">'+
        '<div class="grow">#'+esc(o.order_number||x.order_id)+' · '+esc(cust(o.customer_id))+'</div>'+
        '<span class="muted">'+x.rows.length+' רשומות · '+x.rows.map(function(r){ return esc(r.status); }).join(' · ')+'</span></div>';
    }).join('')+'</div>';
}
</script>
