<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MAPA·NOBLE — מערכת ניהול</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316324F'/%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='none' stroke='%230E7C86' stroke-width='3'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EMN%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<!-- B18: שלד PWA — קריאה בלבד, ראה sw.js -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16324F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAPA-NOBLE">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --linen:#F7F8FA; --ink:#1F2A37; --navy:#16324F; --navy2:#1E4260;
  --teal:#0E7C86; --teal-d:#0A6470; --amber:#B7791F; --danger:#B42318;
  --ok:#1E7E4E; --line:#E6E9EF; --card:#FFFFFF; --muted:#64748B;
  --sb:#12263A; --sb-hi:rgba(255,255,255,.04); --sb-tx:#AEBACB; --sb-mut:#6C7A8F;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--linen);color:var(--ink);min-height:100vh;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none}
/* Task 9: any disabled button turns gray with a default cursor — applied globally while a save is in flight */
button:disabled{opacity:.5;cursor:default;filter:saturate(.4)}
/* Task 8: visual hierarchy in detail views — body text dominant, metadata subdued */
.doc-body{font-size:16px;font-weight:600;line-height:1.7;color:var(--ink);white-space:pre-wrap;margin:4px 0 10px}
.doc-meta{font-size:12px;color:var(--muted);font-weight:400}
button svg,a svg{vertical-align:-3px}
input,select{font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid #D7DEE8;border-radius:6px;background:#fff;width:100%;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,134,.12)}
h1,h2,h3{font-weight:600;color:var(--navy)}
/* ===== מסך כניסה ===== */
#login{position:fixed;inset:0;background:var(--linen);display:flex;align-items:center;justify-content:center;z-index:100}
#login .box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:42px 36px;width:min(390px,92vw);text-align:center;box-shadow:0 1px 3px rgba(16,24,40,.06)}
#login .logo{font-size:23px;font-weight:700;color:var(--navy);letter-spacing:2.5px}
#login .logo span{color:var(--teal)}
#login p{color:var(--muted);font-size:13.5px;margin:8px 0 26px}
#login input{margin-bottom:12px;text-align:center}
#login button{width:100%;background:var(--navy);color:#fff;padding:11px;border-radius:6px;font-size:15px;font-weight:600}
#login button:hover{background:#0F2438}
#loginErr{color:var(--danger);font-size:13.5px;min-height:18px;margin-top:10px}
#app{display:none}
/* ===== סרגל עליון ===== */
header{background:var(--sb);color:#fff;height:54px;padding:0 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.06)}
header .logo{font-weight:600;font-size:16px;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
header .logo span{color:#7FB0B6}
header .who{margin-inline-start:auto;font-size:12.5px;color:var(--sb-mut)}
header .btn,header .btn.sm{background:transparent;border:1px solid rgba(255,255,255,.2);color:#D6DEE7;font-weight:400;border-radius:6px;padding:6px 14px;font-size:13px}
header .btn:hover,header .btn.sm:hover{background:rgba(255,255,255,.07);color:#fff}
header .brandimg{max-height:28px;border-radius:4px}
header .qnav{display:flex;gap:6px}
header .qnav button{background:transparent;border:1px solid rgba(255,255,255,.14);border-radius:6px;width:32px;height:32px;color:#B9C4D0;display:inline-flex;align-items:center;justify-content:center;padding:0}
header .qnav button:hover{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.28)}
nav{display:flex;background:var(--sb);border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto;position:sticky;top:54px;z-index:19;-webkit-overflow-scrolling:touch}
main{padding:20px;max-width:1080px;margin:0 auto;padding-bottom:48px}
/* ===== כרטיסים ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:600;color:var(--navy)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted);font-size:13.5px}
.big{font-size:21px;font-weight:700}
/* ===== תגיות סטטוס — מילון אחיד (E9) ===== */
.chip{display:inline-block;padding:4px 12px;border-radius:5px;font-size:12px;font-weight:600;color:#fff;background:#94A3B8}
/* טיוטה → אפור */
.chip.טיוטה{background:rgba(100,116,139,.12);color:#475569}
/* בתהליך → כחול */
.chip.מאושרת,.chip.הוחזרה,.chip.מתוכנן{background:rgba(30,66,96,.12);color:#1E4260}
/* ממתין → כתום */
.chip.סופקה,.chip.פתוחה{background:rgba(183,121,31,.13);color:#8A5A17}
/* הושלם → ירוק */
.chip.הושלמה,.chip.שולמה,.chip.בוצע,.chip.התקבלה{background:rgba(30,126,78,.12);color:#1B6B44}
/* חריגה/בוטל → אדום */
.chip.בוטלה,.chip.בוטל{background:rgba(180,35,24,.1);color:#9A1F15}
/* ===== כפתורים ===== */
.btn{background:var(--navy);color:#fff;padding:9px 18px;border-radius:6px;font-size:14px;font-weight:600;transition:background .15s}
.btn:hover{background:#0F2438}
.btn.ghost{background:#fff;color:#344054;border:1px solid #D7DEE8}
.btn.ghost:hover{background:#F5F7FA;border-color:#C3CCD9}
.btn.warn{background:var(--amber)}
.btn.warn:hover{background:#96621A}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#9A1F15}
.btn.sm{padding:6px 13px;font-size:13px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px;flex-wrap:wrap;gap:8px}
.section-title h2{font-size:18px;font-weight:600;color:var(--navy)}
/* ===== B32: שפת עיצוב אחידה — היררכיה, רצועת סטטוס, תפריט "עוד" =====
   כללית לכל התוכנה. עיקרון: דבר ראשי אחד בכל תצוגה, פרטים בטקסט אפור,
   עד שלושה כפתורים גלויים והשאר בתפריט שלוש הנקודות. */
.card.banded{padding:0!important;overflow:visible}
.card.banded>.bd{padding:15px 16px 16px}
.hdr-band{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:#fff;padding:11px 15px;border-radius:7px 7px 0 0}
.hdr-band .hb-t{font-size:15.5px;font-weight:600;letter-spacing:.2px}
.hdr-band .hb-s{font-size:12px;color:#A8B4C6;font-weight:600}
.hdr-band.ok{background:var(--ok)}
.hdr-band.warn{background:var(--amber)}
.hdr-band.bad{background:var(--danger)}
.hdr-band.calm{background:var(--navy2)}
.lead{font-size:19px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.35}
.sub{font-size:14px;color:var(--muted);line-height:1.7}
.sub a,.sub .lnk{color:var(--navy2);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.actrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.actrow .pri{flex:1;min-width:120px;text-align:center}
.actrow .ico{padding:9px 13px;line-height:1}
.more-wrap{position:relative;display:inline-block}
.more-pop{position:absolute;z-index:70;left:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 26px rgba(16,24,40,.16);padding:6px;min-width:200px;display:none;text-align:right}
.more-pop.on{display:block}
.more-pop .btn,.more-pop a.btn{display:block;width:100%;text-align:right;margin:2px 0;background:#fff;color:#344054;border:none;font-weight:500;padding:9px 12px}
.more-pop .btn:hover,.more-pop a.btn:hover{background:#F5F7FA}
.more-pop .btn.dng{color:var(--danger)}
.stop-done{opacity:.6}
.stop-done .lead{font-size:15px;font-weight:500;color:var(--muted)}
.route-prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.route-prog>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.doc-quiet{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
body.driver-mode .card.banded>.bd{padding:16px}
body.driver-mode .more-pop{left:auto;right:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
/* ===== B41b: אריחי ציוד — ריבועים במקום מלבנים רחבים ===== */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:14px}
.eqtile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);cursor:pointer;text-align:center;aspect-ratio:1/1;padding:14px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;
  transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease}
.eqtile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(15,35,60,.14);border-color:var(--eqc,var(--line))}
.eqtile::before{content:'';position:absolute;top:0;inset-inline-start:0;width:100%;height:4px;background:var(--eqc,var(--line))}
.eqtile .eq-ic{color:var(--eqc,var(--navy2,#1F4E78));line-height:0;margin-bottom:8px}
.eqtile .eq-t{font-weight:700;font-size:15px;color:var(--navy);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqtile .eq-s{color:var(--muted);font-size:11.5px;line-height:1.4;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqtile .eq-b{margin-top:9px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.eqtile .eq-chip{font-size:10.5px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;white-space:nowrap}
.eqtile .eq-flag{position:absolute;top:9px;inset-inline-end:10px;font-size:14px;line-height:1}
@media(max-width:420px){.eqgrid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:10px}
  .eqtile{border-radius:14px;padding:10px 8px}.eqtile .eq-t{font-size:13.5px}}
/* ===== KPI ===== */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;text-align:start;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:27px;font-weight:700;color:var(--navy);line-height:1.15;order:2}
.kpi .l{font-size:12.5px;color:var(--muted);order:1}
.kpi .ico{display:none}
.kpi.alert .v::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-inline-start:7px;vertical-align:middle}
.kpi.click{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.kpi.click:hover{border-color:#C9D3E0;box-shadow:0 2px 8px rgba(16,24,40,.08)}
/* ===== קנבן ===== */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:230px;flex:1;background:#F1F4F8;border:1px solid var(--line);border-radius:8px;padding:10px}
.kcol h3{font-size:13px;color:var(--navy);margin-bottom:8px;display:flex;justify-content:space-between}
.kcol h3 .cnt{background:#E2E8F0;color:#334155;border-radius:4px;padding:0 8px;font-size:12px;font-weight:600}
.ktask{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;font-size:13.5px;box-shadow:var(--shadow)}
.ktask .t{font-weight:600}
/* ===== מודלים ===== */
#modalBg{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:641px){#modalBg{align-items:center}}
#modal{background:#fff;border-radius:8px 8px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:24px;position:relative;border:1px solid var(--line)}
@media(min-width:641px){#modal{border-radius:8px}}
#modal h2{margin-bottom:14px;color:var(--navy);font-size:19px}
.mclose{position:absolute;top:12px;left:12px;background:#F1F4F8;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;font-size:14px;color:#475569;font-weight:600}
.mclose:hover{background:#E6EBF2}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#344054}
/* ===== טבלאות ===== */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;background:#F8FAFC;color:#64748B;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:10px 12px;border-bottom:1px solid #EEF1F5}
tr:hover td{background:#F8FAFC}
#toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:6px;font-size:14px;display:none;z-index:99;max-width:90vw;box-shadow:0 4px 16px rgba(16,24,40,.22)}
#toast.err{background:var(--danger)}
#busy{position:fixed;top:62px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:6px 16px;border-radius:6px;font-size:13px;display:none;z-index:98;box-shadow:0 2px 8px rgba(16,24,40,.2)}
#busy .dot{display:inline-block;animation:blink 1s infinite;font-size:9px;vertical-align:1px}
@keyframes blink{50%{opacity:.2}}
/* ===== B10/E10: Undo Toast ===== */
.undo-box{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:10px 12px 10px 16px;border-radius:6px;font-size:14px;z-index:100;max-width:92vw;box-shadow:0 4px 16px rgba(16,24,40,.22);display:flex;align-items:center;gap:12px}
.undo-box button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:5px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.undo-box button:hover{background:rgba(255,255,255,.26)}
/* ===== B10/E5: תג מונה בתפריט ===== */
.navbadge{display:inline-block;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;margin-inline-start:4px;vertical-align:2px}
/* ===== B10/E11: הצעת כפילות בהקמת לקוח ===== */
.dupe-hint{background:#FFF7ED;border:1px solid #FED7AA;border-radius:6px;padding:7px 10px;font-size:12.5px;color:#9A5B13;margin-top:-6px;margin-bottom:10px}
.dupe-hint b{cursor:pointer;text-decoration:underline}
/* ===== B11a/E1: שרשרת מסמכים — פס עליון בכל רשומה ===== */
.doc-chain{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin-bottom:12px}
.dc-node{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:6px;white-space:nowrap}
.dc-node.dc-filled{background:var(--navy2);color:#fff;cursor:pointer}
.dc-node.dc-filled:hover{background:var(--navy)}
.dc-node.dc-active{background:var(--teal);box-shadow:0 0 0 2px var(--teal-d) inset}
.dc-node.dc-empty{background:#EEF1F5;color:var(--muted);cursor:default}
.dc-badge{background:rgba(255,255,255,.28);border-radius:8px;padding:0 6px;font-size:10.5px;margin-inline-start:3px}
.dc-sep{color:var(--line);font-size:15px;margin:0 4px;user-select:none}
@media(min-width:900px){
  nav{position:fixed;top:54px;right:0;bottom:0;width:228px;flex-direction:column;border-bottom:none;overflow-y:auto;overflow-x:hidden;padding-top:10px}
  main{margin-right:228px;max-width:none;padding:26px 32px;padding-bottom:52px}
}
/* ===== יומן ===== */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead{text-align:center;font-weight:600;color:var(--muted);font-size:12px;padding:4px 0}
.calday{background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:86px;padding:4px;font-size:11px;cursor:pointer;overflow:hidden}
.calday.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.calday.other{opacity:.4}
.calday .dnum{font-weight:600;font-size:13px;color:var(--navy)}
.calday .dheb{color:var(--muted);font-size:10px}
.calev{border-radius:3px;color:#fff;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calshab{display:block;color:var(--muted);font-size:9px;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#camOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
#camOverlay video{width:min(94vw,560px);border-radius:8px}
.empty{text-align:center;color:var(--muted);padding:28px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid #D7DEE8;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600;color:#475569}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* B42: טאבי התחזוקה נבדלים ויזואלית מטאבי הציוד — קבוצה אחרת, תפקיד אחר */
.tabs .tabsep{width:1px;background:#CDD5E0;margin:2px 8px;align-self:stretch}
.tabs button.mnt{background:#F1F8F9;border-color:#B8D6DA;color:var(--teal-d)}
.tabs button.mnt.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tabs .tabbadge{display:inline-block;min-width:18px;padding:0 5px;margin-right:5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center}
.scanbox{font-size:22px;text-align:center;letter-spacing:2px}
/* ===== פעולות בתוך שורה ===== */
.rowact{display:inline-flex;gap:6px;align-items:center}
.rowact button{background:#fff;border:1px solid #D7DEE8;border-radius:6px;width:30px;height:30px;color:#475569;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.rowact button:hover{background:#F5F7FA;border-color:#C3CCD9;color:var(--navy)}
.rowact button.del:hover{background:rgba(180,35,24,.06);border-color:var(--danger);color:var(--danger)}
/* ===== כפתורי קשר מהיר ===== */
.cbtns{display:inline-flex;gap:5px;vertical-align:middle}
.cbtns a{text-decoration:none;background:#fff;border:1px solid #D7DEE8;border-radius:6px;width:29px;height:29px;color:#475569;display:inline-flex;align-items:center;justify-content:center}
.cbtns a:hover{background:#F5F7FA;color:var(--navy);border-color:#C3CCD9}
/* ===== דשבורד ===== */
.gridkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:900px){.gridkpi{grid-template-columns:repeat(6,1fr)}}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:760px){.chartgrid{grid-template-columns:1fr}}
.attn-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #EEF1F5;cursor:pointer;font-size:14px;flex-wrap:wrap}
.attn-row:last-child{border-bottom:none}
.attn-row:hover{background:#F8FAFC}

<div id="app">
  <header>
    <button class="nav-toggle" id="btnMenu" onclick="toggleNavPanel()" title="תפריט"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg> תפריט</button>

<div id="modalBg" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>

<!-- B10/E10: Undo Toast — מוצג לפני שליחת פעולה הרסנית לשרת, עם 5 שניות לביטול -->

<!-- E6: כפתור יצירה מהירה -->
<div id="quickCreateMenu" class="quick-create-menu" style="display:none">
  <button onclick="quickCreate('customer')">+ לקוח חדש</button>
  <button onclick="quickCreate('order')">+ הזמנה חדשה</button>

<script>
/* ================= הגדרות ================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbyAFqEJrLLbRT-o5D7slN9lieaIjR8YKFiToy20iHgjS5F4QbDptfD-7al2Ywhs6WA1Hg/exec';
var PASS = '', USER = '', ROLE = '', CAN_EDIT = true, USER_VIEWS = '';
var APPROVALS_COUNT = 0; // B10/E5: מונה מרכז אישורים — מוצג כתג בתפריט למנהל/משרד
var BI_TAB = 'overview', BI_REV_MODE = 'month', BI_DATA = null; // B14: לוח בקרה עסקי — טאב פעיל, מצב תצוגת הכנסות, מטמון תשובת שרת
var TOKEN = ''; // F2: טוקן סשן — מחליף את סיסמת המערכת בכל בקשה
var IS_SUPER_ADMIN = false; // B7: מנהל ראשי — מגיע מהשרת (ScriptProperties), לא נקבע בממשק
var DB = null, VIEW = 'dash', FIN_TAB = 'flow', ORD_TAB = 'open';   // B43: מסך הכספים נפתח על תזרים ותשלומים
var ORD_CLOSED_STATUSES = ['הושלמה','בוטלה']; // B16b: הגדרת "סגורה" — אושר עם אבי
var STAGES = ['התקבל','בכביסה','בייבוש','בגיהוץ וקיפול','מוכן'];
/* NC1: זרימת מכבסת NOBLE — נפרדת מ-STAGES של כביסת השכרה (מוגן רגרסיה) */
var NOBLE_STAGES = ['התקבל','בכביסה','בייבוש','בגיהוץ וקיפול','באריזה','מוכן','במשלוח','נמסר'];
var NOBLE_MACHINE_STAGES = ['בכביסה','בייבוש','בגיהוץ וקיפול','באריזה'];

/* ================= E7: תצוגות שמורות (localStorage) ================= */
// שמירת שילוב פילטרים בשם
function savedViews(){ return JSON.parse(localStorage.getItem('mn_views')||'{}'); }
function saveView(name, filters){ var v=savedViews(); v[name]=filters; localStorage.setItem('mn_views',JSON.stringify(v)); toast('תצוגה שמורה: '+name); }
function delView(name){ var v=savedViews(); delete v[name]; localStorage.setItem('mn_views',JSON.stringify(v)); }

/* ================= E8: נצפו לאחרונה (localStorage) ================= */
// מעקב אחרי 5 הרשומות האחרונות שנפתחו
function trackRecent(type, id, name){ 
  var r=JSON.parse(localStorage.getItem('mn_recent')||'[]');
  r=r.filter(x=>!(x.type===type&&x.id===id)); // הסרה אם כבר קיים
  r.unshift({type,id,name,at:new Date().getTime()});
  localStorage.setItem('mn_recent',JSON.stringify(r.slice(0,5)));
}
function getRecent(){ return JSON.parse(localStorage.getItem('mn_recent')||'[]'); }

/* ================= E6: כפתור יצירה מהירה ================= */
/* B40b (באג ותיק): הפונקציה קראה ל-openForm שמעולם לא הייתה קיימת בקוד,
   ולכן כל ארבעת הכפתורים בתפריט היצירה המהירה לא עשו כלום (שגיאה שקטה
   בקונסול). עכשיו כל אחד פותח את הטופס האמיתי שלו. תרשומת תמיד נתלית על
   רשומה קיימת ולכן אין לה טופס עצמאי — היא מנווטת ליומן התרשומות. */
function quickCreate(what){
  var menu = el('quickCreateMenu'); if(menu) menu.style.display='none';
  if(what==='customer'){ go('customers'); return custForm(); }
  if(what==='order'){ go('orders'); return newOrderForm(false); }
  if(what==='task'){ go('tasks'); return taskForm(); }
  if(what==='note'){ go('notes'); return toast('תרשומת נפתחת מתוך הרשומה עצמה — לקוח, הזמנה, פריט או משימה'); }
}

/* ================= API ================= */
// F2: קריאת רשת גולמית — כשיש טוקן סשן הוא נשלח בתוך ה-payload במקום סיסמת המערכת.
// פעולות פורטל (portal*) ציבוריות — נשלחות תמיד ללא טוקן.
async function apiRaw(action, payload){
  payload = payload || {};
  var body = { user: USER, action: action, payload: payload };
  if (TOKEN && String(action).indexOf('portal') !== 0) payload.token = TOKEN;
  else body.password = PASS; // ללא טוקן — התנהגות ישנה (פורטל / טרום-כניסה)
  var res = await fetch(API_URL, { method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)});
  return res.json();
}
// F2: שמירת פרטי הסשן מתשובת login / resumeSession
function applyLogin(lg){
  USER = lg.user; ROLE = lg.role; CAN_EDIT = lg.can_edit !== false; USER_VIEWS = lg.views || '';
  IS_SUPER_ADMIN = lg.is_super_admin === true; // B7
  if (lg.token){ TOKEN = lg.token; sessionStorage.setItem('mn_token', TOKEN); }
  sessionStorage.setItem('mn_sess', JSON.stringify({ user: USER, role: ROLE, views: USER_VIEWS, can_edit: CAN_EDIT, is_super_admin: IS_SUPER_ADMIN }));

}
// F2: ניסיון חידוש שקוף מטוקן המכשיר ("זכור אותי") — מנפיק טוקן סשן טרי
async function tryResume(){
  var dt = localStorage.getItem('mn_devtoken');
  if (!dt) return false;
  try{
    var r = await apiRaw('loginByRemember', { remember_token: dt });
    if (r && r.ok){ applyLogin(r); return true; }
  }catch(e){ return false; } // תקלת רשת — לא מוחקים את טוקן המכשיר

async function ensureFullTexts(table, recs){

  if(!need.length) return;

  if(!r || !r.ok){ toast(r && r.error ? r.error : 'שגיאה בטעינת הטקסט המלא', true); return; }

    fields.forEach(function(f){ if(t[f]!==undefined){ rec[f]=t[f]; delete rec[f+'_trunc']; } });
  });

    else if(action==='b5MarkInTransit' && r.delivery){ var arrD=DB.deliveries||[]; var iD=arrD.findIndex(x=>x.id===r.delivery.id); if(iD>-1) arrD[iD]=r.delivery; else arrD.push(r.delivery); }

function fmtTs(ts){
  var s = String(ts==null?'':ts);

  if(m) return m[1]+' '+m[2];
  var m2 = s.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}:\d{2})/); // תאריך רווח שעה

   toISOString מחזיר תאריך UTC. בישראל השעון מקדים ב-2 או 3 שעות,
   ולכן בין חצות לשלוש לפנות בוקר הממשק חישב את התאריך של אתמול —
   בעוד השרת (Utilities.formatDate לפי אזור הזמן של הסקריפט) כתב את של היום.
   התוצאה: משלוחי היום נעלמו מהמסך, ואפילו בלוקי האזהרה לא הופיעו,
   כי גם הם השוו מול אותו תאריך שגוי. */
function ymdLocal(d){
  d = d || new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function ymLocal(d){ return ymdLocal(d).slice(0,7); }
/* B38b: נרמול ערך תאריך לפני השוואה.
   שדה תאריך בגיליון עלול לחזור כמחרוזת 'yyyy-mm-dd', כאובייקט תאריך,
   כמחרוזת ISO מלאה עם שעה, או בפורמט dd/mm/yyyy. השוואת מחרוזות ישירה
   בין פורמטים שונים נכשלת בשקט — והמשלוח פשוט לא מופיע. */
function dYmd(v){
  if(v===null || v===undefined || v==='') return '';
  if(v instanceof Date) return isNaN(v.getTime())? '' : ymdLocal(v);
  var t = String(v).trim();
  if(/[TZ]/.test(t)){ var dt=new Date(t); if(!isNaN(dt.getTime())) return ymdLocal(dt); }
  var m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m = t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if(m) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  var d2 = new Date(t);
  return isNaN(d2.getTime())? t : ymdLocal(d2);
}
function nowTs(){ var d=new Date(); return ymdLocal(d)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

/* ===== ברקוד Code128 — עבר בדיקות תקן ===== */
// Code128-B — מחולל תקני
var C128 = ('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 '+
'221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 '+
'221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 '+
'212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 '+
'231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 '+
'231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 '+
'314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 '+
'112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 '+
'111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 '+
'214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 '+
'114131 311141 411131 211412 211214 211232').split(' ');
var C128_STOP = '2331112';

function code128Widths(text) {
  var vals = [104]; // Start-B
  for (var i = 0; i < text.length; i++) {
    var v = text.charCodeAt(i) - 32;
    if (v < 0 || v > 94) throw new Error('תו לא נתמך בברקוד: ' + text[i]);
    vals.push(v);
  }
  var sum = vals[0];
  for (var j = 1; j < vals.length; j++) sum += vals[j] * j;
  vals.push(sum % 103); // checksum
  var widths = '';
  vals.forEach(function(v){ widths += C128[v]; });
  return widths + C128_STOP;
}

function code128Svg(text, h) {
  h = h || 46;
  var w = code128Widths(text);
  var scale = 2, x = 0, bars = '';
  for (var i = 0; i < w.length; i++) {
    var ww = Number(w[i]) * scale;
    if (i % 2 === 0) bars += '<rect x="'+x+'" y="0" width="'+ww+'" height="'+h+'" fill="#000"/>';
    x += ww;
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+x+'" height="'+(h+16)+'" viewBox="0 0 '+x+' '+(h+16)+'">'+bars+
    '<text x="'+(x/2)+'" y="'+(h+13)+'" text-anchor="middle" font-family="monospace" font-size="12">'+text+'</text></svg>';
}



/* ===== B16b: תמונת חתימה דיגיטלית במסמכים מודפסים =====
   signature_url הוא קישור צפייה של Drive (file/d/ID/view) — לא נטען כ-img.
   ממירים לקישור thumbnail ישיר שכן נטען כתמונה, בלי לשנות את השרת. */
function driveThumbUrl(url){
  var m = String(url||'').match(/\/d\/([^/]+)/);
  return m ? 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400' : '';
}
function signatureBlockHtml(url){

/* ===== B10/E10: Undo Toast — דוחה שליחת פעולה הרסנית לשרת ב-5 שניות, עם אפשרות "בטל" ===== */
var UNDO_PENDING = null; // {timer, commit}
function undoToast(msg, commitFn){
  // undo קודם שעוד פתוח מתבצע מיד (לא מצטבר) — לפני שמתחילים המתנה חדשה
  if(UNDO_PENDING){ clearTimeout(UNDO_PENDING.timer); UNDO_PENDING.commit(); }
  var box = el('undoBox');
  box.innerHTML = '<span>'+esc(msg)+'</span><button onclick="undoCancel()">בטל</button>';
  box.style.display = 'flex';
  var done = false;
  var run = function(){ if(done) return; done=true; box.style.display='none'; UNDO_PENDING=null; commitFn(); };
  var timer = setTimeout(run, 5000);
  UNDO_PENDING = { timer: timer, commit: run };
}
function undoCancel(){
  if(!UNDO_PENDING) return;
  clearTimeout(UNDO_PENDING.timer); UNDO_PENDING = null;
  el('undoBox').style.display = 'none';

/* B28: שני חלונות כספיים בלוח הבקרה — הוצאות 30 הימים האחרונים והוצאות צפויות.
   קריאה בלבד מ-DB, שניהם לחיצים למסך כספים. מוצגים רק למי שמורשה לראות כספים. */
function dashMoneyCards(today){
  if(!allowedViews().some(v=>v[0]==='finance')) return '';
  var from = ymdLocal(new Date(Date.now()-29*864e5));
  var last = (DB.expenses||[]).filter(x=>String(x.date||'')>=from && String(x.date||'')<=today);
  var lastTot = last.reduce((s,x)=>s+Number(x.amount||0)+Number(x.vat||0),0);
  var byCat = {};
  last.forEach(function(x){ var k=x.category||'אחר'; byCat[k]=(byCat[k]||0)+Number(x.amount||0)+Number(x.vat||0); });
  var cats = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]).slice(0,5);

  var open = fexpOpen();
  var openTot = open.reduce((s,x)=>s+fexpRemain(x),0);
  function inDays(n){
    var lim = ymdLocal(new Date(Date.now()+n*864e5));
    return open.filter(x=>x.due_date && x.due_date<=lim).reduce((s,x)=>s+fexpRemain(x),0);
  }
  var overdue = open.filter(x=>x.due_date && x.due_date<today).reduce((s,x)=>s+fexpRemain(x),0);
  var noDate = open.filter(x=>!x.due_date).reduce((s,x)=>s+fexpRemain(x),0);
  var line = function(l,v,color){
    return '<div class="row" style="padding:6px 2px;border-bottom:1px solid #EEF1F5"><span class="grow">'+l+'</span>'+
      '<b'+(color?' style="color:'+color+'"':'')+'>'+ils(v)+'</b></div>';
  };
  return '<div class="chartgrid" style="margin-top:14px">'+
    '<div class="card" style="cursor:pointer" onclick="goFin(\'expenses\')" title="לחץ למסך כספים">'+
      '<div class="row" style="align-items:center;margin-bottom:6px"><h3 class="grow">הוצאות — 30 הימים האחרונים</h3>'+
      '<span class="tot" style="font-size:20px">'+ils(lastTot)+'</span></div>'+
      (cats.length? cats.map(c=>line(esc(c),byCat[c],'')).join('')
        : '<div class="empty">לא נרשמו הוצאות ב-30 הימים האחרונים</div>')+
      '<div class="muted" style="font-size:12px;margin-top:6px">'+last.length+' רשומות · כולל מע"מ · לחץ למסך כספים</div></div>'+
    '<div class="card" style="cursor:pointer" onclick="goFin(\'future\')" title="לחץ למסך הוצאות עתידיות">'+
      '<div class="row" style="align-items:center;margin-bottom:6px"><h3 class="grow">הוצאות צפויות</h3>'+
      '<span class="tot" style="font-size:20px'+(openTot>0?';color:var(--danger)':'')+'">'+ils(openTot)+'</span></div>'+
      (open.length?
        (overdue>0? line('באיחור',overdue,'var(--danger)'):'')+
        line('עד 30 יום',inDays(30),'')+
        line('עד 60 יום',inDays(60),'')+
        line('עד 90 יום',inDays(90),'')+
        (noDate>0? line('ללא תאריך יעד',noDate,'var(--amber)'):'')
        : '<div class="empty">אין הוצאות עתידיות פתוחות</div>')+
      '<div class="muted" style="font-size:12px;margin-top:6px">'+open.length+' רשומות פתוחות · לחץ לפירוט</div></div>'+
    '</div>';
}

    '</div></div>';

/* גרף עמודות הכנסות — SVG טהור, ללא ספריות */
function revenueChartSvg(){
  var months = [], now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2));
  }
  var sums = months.map(function(mk){
    return (DB.invoices||[]).filter(v=>v.status!=='בוטלה' && String(v.date||'').slice(0,7)===mk)
      .reduce((s,v)=>s+Number(v.subtotal||0),0);
  });
  var max = Math.max.apply(null, sums);
  if(!(max>0)) return '<div class="empty">אין נתונים עדיין — הפק חשבונית ראשונה והגרף יתמלא</div>';
  var HEB_M = ['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];
  var W=480, H=210, pad=10, bw=Math.floor((W-2*pad)/6);
  var bars = months.map(function(mk,idx){
    var v = sums[idx], bh = Math.round((H-64)*v/max), x = pad+idx*bw+9, y = H-32-bh;
    var lbl = HEB_M[Number(mk.slice(5,7))-1]+' '+mk.slice(2,4);
    // NC4 (משימה 5): כל עמודה לחיצה — פותחת פירוט חשבוניות של אותו חודש
    return '<g style="cursor:pointer" onclick="revMonthDetail(\''+mk+'\')"><title>לחץ לפירוט '+lbl+'</title>'+
      '<rect x="'+(pad+idx*bw)+'" y="0" width="'+bw+'" height="'+(H-32)+'" fill="transparent"/>'+
      '<rect x="'+x+'" y="'+y+'" width="'+(bw-18)+'" height="'+Math.max(bh,2)+'" rx="3" fill="'+(idx===5?'var(--teal)':'var(--navy2)')+'" opacity="'+(idx===5?'1':'.72')+'"/>'+
      '<text x="'+(x+(bw-18)/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+(v?'₪'+Math.round(v).toLocaleString('he-IL'):'')+'</text>'+
      '<text x="'+(x+(bw-18)/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+lbl+'</text></g>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="הכנסות 6 חודשים">'+
    '<line x1="'+pad+'" y1="'+(H-32)+'" x2="'+(W-pad)+'" y2="'+(H-32)+'" stroke="var(--line)" stroke-width="1.5"/>'+bars+'</svg>';
}
/* דונאט הזמנות לפי סטטוס — SVG טהור */
function ordersDonutSvg(){
  var COLORS = {'הצעת מחיר':'#CBD5E1','טיוטה':'#94A3B8','מאושרת':'var(--teal)','סופקה':'var(--amber)','הוחזרה':'var(--navy2)','הושלמה':'var(--ok)','בוטלה':'var(--danger)'};
  var counts = {};
  (DB.orders||[]).forEach(function(o){ var st=o.status||'אחר'; counts[st]=(counts[st]||0)+1; });
  var keys = Object.keys(counts);
  var total = keys.reduce((s,k)=>s+counts[k],0);
  if(!total) return '<div class="empty">אין נתונים עדיין — צור הזמנה ראשונה והגרף יתמלא</div>';
  var R=70, C=2*Math.PI*R, off=0, segs='';
  keys.forEach(function(k){
    var len = counts[k]/total*C;
    segs += '<circle r="'+R+'" cx="100" cy="100" fill="none" stroke="'+(COLORS[k]||'#94A3B8')+'" stroke-width="30" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 100 100)"/>';
    off += len;
  });
  var legend = keys.map(k=>'<div style="display:flex;align-items:center;gap:7px;padding:3px 0;font-size:13px;cursor:pointer" title="לחץ לפירוט ההזמנות בסטטוס זה" onclick="ordersStatusDetail(\''+k+'\')">'+
    '<span style="width:13px;height:13px;border-radius:4px;background:'+(COLORS[k]||'#94A3B8')+';flex:none"></span>'+esc(k)+' — <b>'+counts[k]+'</b></div>').join('');
  return '<div class="row" style="align-items:center">'+
    '<svg viewBox="0 0 200 200" style="width:165px;height:165px;flex:none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="הזמנות לפי סטטוס">'+segs+
    '<text x="100" y="97" text-anchor="middle" font-size="27" font-weight="700" fill="var(--navy)">'+total+'</text>'+
    '<text x="100" y="117" text-anchor="middle" font-size="12" fill="var(--muted)">הזמנות</text></svg>'+
    '<div class="grow" style="min-width:130px">'+legend+'</div></div>';
}

  var rows = list.map(function(o){
    var urgent = o.payment_status==='ממתין לאישור חריגה';
    return '<div class="attn-row" style="cursor:pointer" onclick="openOrder(\''+o.id+'\')"><span class="tag" style="background:'+(urgent?'var(--danger)':'var(--amber)')+'">'+esc(o.payment_status)+'</span>'+
      '<div class="grow">'+(o.order_number?'הזמנה #'+esc(o.order_number)+' · ':'')+esc(cust(o.customer_id))+' · '+ils(orderTotal(o.id))+'</div>'+
      '<span class="muted">'+esc(o.start_date)+'</span></div>';
  }).join('');
  return '<div class="section-title"><h2>הזמנות פורטל הממתינות לטיפול ('+list.length+')</h2></div><div class="card">'+rows+'</div>';
}
/* B3-3: וידג'ט אישורי ערבות ממתינים בדשבורד המנהל — מבוסס credit_profiles.approval_pending */
function b3ApprovalsWidget(){

function kpi(v,l,alert,view,ico){
  var canGo = view && allowedViews().some(function(x){ return x[0]===view; });
  return '<div class="kpi'+(alert?' alert':'')+(canGo?' click':'')+'"'+(canGo?' onclick="go(\''+view+'\')" title="לחץ למעבר למסך"':'')+'>'+
    (ico?'<div class="ico">'+ico+'</div>':'')+'<div class="v">'+v+'</div><div class="l">'+l+'</div></div>';
}
function custBalance(cid){
  var b = DB.orders.filter(o=>o.customer_id===cid && !['בוטלה','טיוטה','הצעת מחיר'].includes(o.status)).reduce((s,o)=>s+orderBalance(o.id),0);
  // NC3: חשבוניות מכבסה מרוכזות (ללא הזמנה) נכנסות ליתרת הלקוח
  DB.invoices.filter(v=>v.customer_id===cid && !v.order_id && v.status!=='בוטלה').forEach(function(v){
    var paid = DB.payments.filter(p=>p.invoice_id===v.id).reduce((s,p)=>s+Number(p.amount||0),0);
    b += Math.max(0, Number(v.total)-paid);
  });
  return b;
}
/* ===== B31: גביה מלקוח — פירוט חוב + גביה בפועל =====
   מסלולי הכסף:
   • חוב כולל  → b2ProcessPayment (הקצאה FIFO, קבלה אחת, idempotency)
   • מסמך בודד → הזמנה דרך b2ProcessPayment עם order_id, חשבונית מכבסה דרך addPayment
   אמצעי גביה: אשראי / העברה / מזומן. בהעברה — אסמכתא חובה (נאכף גם בשרת). */
function collectListModal(){
  var rows = DB.customers.map(c=>({c:c, b:custBalance(c.id)})).filter(x=>x.b>0.01).sort((a,b)=>b.b-a.b);
  var tot = rows.reduce((s,x)=>s+x.b,0);
  openModal('<h2>סכומים לגבייה</h2>'+
    (rows.length? '<div class="card"><table><tr><th>לקוח</th><th>חוב</th><th></th></tr>'+
      rows.map(x=>'<tr><td style="cursor:pointer" onclick="collectCustModal(\''+x.c.id+'\')"><span style="color:var(--navy2);text-decoration:underline">'+esc(x.c.name)+'</span>'+(x.c.phone?' <span class="muted" style="font-size:11px">'+esc(x.c.phone)+'</span>':'')+'</td>'+
        '<td style="color:var(--danger);font-weight:700">'+ils(x.b)+'</td>'+
        '<td>'+(CAN_EDIT?'<button class="btn sm" onclick="collectPayForm(\''+x.c.id+'\')">גבה</button>':'')+'</td></tr>').join('')+
      '<tr><td><b>סה"כ</b></td><td><b>'+ils(tot)+'</b></td><td></td></tr></table></div>'
      +'<div class="muted" style="font-size:12px;margin-top:6px">לחיצה על שם הלקוח — פירוט החוב. "גבה" — רישום קבלה מיידי.</div>'
    : '<div class="card empty">אין חובות פתוחים — הכל נגבה 🎉</div>')+
    '<div style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">סגור</button></div>');
}
/* שורות החוב של לקוח, מהישן לחדש — אותה הקצאה שהשרת עושה */
function collectDocRows(cid){
  var rows = [];
  DB.orders.filter(o=>o.customer_id===cid && !['בוטלה','טיוטה','הצעת מחיר'].includes(o.status)).forEach(function(o){
    var b = orderBalance(o.id);
    if(b>0.01) rows.push({kind:'order', id:o.id, label:'הזמנה '+(o.order_number?'#'+o.order_number:o.id)+' · '+(o.start_date||''), b:b, sort:String(o.created_at||o.start_date||''), click:"openOrder('"+o.id+"')"});
  });
  DB.invoices.filter(v=>v.customer_id===cid && !v.order_id && v.status!=='בוטלה').forEach(function(v){
    var paid = DB.payments.filter(p=>p.invoice_id===v.id).reduce((s,p)=>s+Number(p.amount||0),0);
    var b = Math.max(0, Number(v.total)-paid);
    if(b>0.01) rows.push({kind:'invoice', id:v.id, label:'חשבונית מכבסה '+v.number+' · '+(v.date||''), b:b, sort:String(v.date||''), click:"openInvoice('"+v.id+"')"});
  });
  rows.sort((a,b)=> a.sort<b.sort? -1 : 1);
  return rows;
}
function collectCustModal(cid){
  var c = DB.customers.find(x=>x.id===cid)||{};
  var rows = collectDocRows(cid);
  var tot = rows.reduce((s,x)=>s+x.b,0);
  openModal('<h2>חוב לגבייה — '+esc(c.name||'')+'</h2>'+
    (rows.length? '<div class="card"><table><tr><th>מסמך</th><th>יתרה</th><th></th></tr>'+
      rows.map(x=>'<tr><td style="cursor:pointer" onclick="closeModal();'+x.click+'"><span style="color:var(--navy2);text-decoration:underline">'+esc(x.label)+'</span></td>'+
        '<td style="color:var(--danger);font-weight:700">'+ils(x.b)+'</td>'+
        '<td>'+(CAN_EDIT?'<button class="btn sm" onclick="collectPayForm(\''+cid+'\',\''+x.kind+'\',\''+x.id+'\')">גבה</button>':'')+'</td></tr>').join('')+
      '<tr><td><b>סה"כ</b></td><td><b>'+ils(tot)+'</b></td><td></td></tr></table></div>'
      +'<div class="muted" style="font-size:12px;margin-top:6px">"גבה" בשורה — גביה כנגד אותו מסמך בלבד. לחיצה על שם המסמך פותחת אותו.</div>'
    : '<div class="card empty">אין יתרות פתוחות ללקוח זה</div>')+
    '<div class="row" style="margin-top:12px;gap:6px">'+
      (rows.length&&CAN_EDIT?'<button class="btn" onclick="collectPayForm(\''+cid+'\')">גבה על כל החוב</button>':'')+
      '<button class="btn ghost" onclick="collectListModal()">חזרה לרשימה</button> '+
      '<button class="btn ghost" onclick="closeModal();openCust(\''+cid+'\',\'finance\')">כרטיס הלקוח</button></div>');
}
/* ===== B31c: בחירת מסמך בכל גביה =====
   ברירת המחדל היא "חשבונית מס", והיא מופקת רק ברגע התשלום — לא לפניו.
   בכל גביה המערכת שואלת מה להפיק, כולל האפשרות לא להפיק כלום. */
var COLLECT_DOC = 'חשבונית מס';
var PAY_DOC = 'חשבונית מס', PAY_DOC_TYPE = '', PAY_DOC_URL = '', PAY_SKIP = {};
var DOC_OPTS = [
  ['חשבונית מס',      'חיוב מלא. הקבלה מופקת בנפרד על הסכום שנגבה בפועל.'],
  ['חשבונית מס-קבלה', 'מסמך אחד לחיוב ולקבלה. אפשרי רק כשהתשלום סוגר את מלוא היתרה — ואז לא מופקת קבלה נפרדת.'],
  ['חשבונית עסקה',    'דרישת תשלום בלבד. אינה מסמך מס ואינה מזכה את הלקוח במע"מ.'],
  ['ללא',             'לא להפיק מסמך כעת. הגביה תירשם, אך לא תיכנס ל"הכנסות" עד שיופק מסמך.']
];
function docOptsHtml(id, cur, onchg, allowCombined){
  var opts = DOC_OPTS.filter(o=>allowCombined || o[0]!=='חשבונית מס-קבלה');
  var d = (DOC_OPTS.find(o=>o[0]===cur)||DOC_OPTS[0])[1];
  return '<div class="frow"><label>מסמך להפקה</label>'+
    '<select id="'+id+'" onchange="'+onchg+'">'+
      opts.map(o=>'<option value="'+o[0]+'"'+(cur===o[0]?' selected':'')+'>'+o[0]+'</option>').join('')+
    '</select>'+
    '<div class="muted" style="font-size:11.5px;margin-top:3px">'+esc(d)+'</div></div>';
}
/* הזמנות בעלות יתרה שטרם הופק להן מסמך */
function collectMissingInv(cid, docKind, docId){
  if(docKind==='invoice') return [];
  var os = DB.orders.filter(o=>o.customer_id===cid && !['בוטלה','טיוטה','הצעת מחיר'].includes(o.status) && orderBalance(o.id)>0.01);
  if(docKind==='order') os = os.filter(o=>String(o.id)===String(docId));
  return os.filter(o=>!DB.invoices.some(v=>v.order_id===o.id && v.status!=='בוטלה'));
}
function vatRateFE(){ var v=parseFloat(setting('vat_rate')); return (v>0&&v<1)? v : VAT_RATE; }
function projInvTotal(oid){ return Math.round(orderTotal(oid)*(1+vatRateFE())*100)/100; }

/* חלון הגביה. docKind ריק = כל החוב (FIFO); אחרת מסמך בודד. */
var COLLECT_CTX = null;
function collectPayForm(cid, docKind, docId){
  var c = DB.customers.find(x=>x.id===cid); if(!c) return toast('לקוח לא נמצא', true);
  var rows = collectDocRows(cid);
  var target = null;
  if(docKind && docId){ target = rows.find(x=>x.kind===docKind && String(x.id)===String(docId)); if(!target) return toast('המסמך כבר נסגר — רענן', true); }
  var pend = collectMissingInv(cid, docKind, docId);
  var pendIds = pend.map(o=>String(o.id));
  var willIssue = pend.length>0 && COLLECT_DOC!=='ללא';
  var shown = (target? [target] : rows).map(function(x){
    var isP = (x.kind==='order' && pendIds.indexOf(String(x.id))>-1);
    return {label:x.label, pend:isP, b:(isP&&willIssue)? Math.max(0, projInvTotal(x.id)-orderPaid(x.id)) : x.b};
  });
  var max = Math.round(shown.reduce((s,x)=>s+x.b,0)*100)/100;
  if(max<=0.01) return toast('אין יתרה לגביה', true);
  COLLECT_CTX = {cid:cid, kind:(docKind||''), id:(docId||''), txn:genTxnId(), max:max};

  var alloc = '<div class="card" style="margin-bottom:10px"><table><tr><th>מסמך</th><th>יתרה לגביה</th></tr>'+
    shown.map(x=>'<tr><td>'+esc(x.label)+(x.pend&&willIssue?' <span class="muted" style="font-size:11px">· כולל מע"מ לאחר ההפקה</span>':'')+'</td><td>'+ils(x.b)+'</td></tr>').join('')+
    '<tr><td><b>סה"כ</b></td><td><b>'+ils(max)+'</b></td></tr></table>'+
    (target?'':'<div class="muted" style="font-size:12px;margin-top:6px">הסכום מוקצה אוטומטית לחובות הישנים קודם.</div>')+'</div>';

  // מסמך מאוחד אפשרי רק בגביה ממוקדת על הזמנה אחת
  var allowComb = (docKind==='order' && pend.length===1);
  if(!allowComb && COLLECT_DOC==='חשבונית מס-קבלה') COLLECT_DOC='חשבונית מס';
  var docSel = pend.length? docOptsHtml('cp_doc', COLLECT_DOC,
      "COLLECT_DOC=this.value;collectPayForm('"+cid+"','"+(docKind||'')+"','"+(docId||'')+"')", allowComb) : '';

  openModal('<h2>גביית תשלום — '+esc(c.name||'')+'</h2>'+ alloc + docSel +
    '<div class="grid2">'+
      '<div class="frow"><label>סכום לגביה (₪)</label><input id="cp_amt" type="number" min="0" step="0.01" max="'+max+'" value="'+max+'"></div>'+
      '<div class="frow"><label>תאריך</label><input id="cp_date" type="date" value="'+ymdLocal()+'"></div>'+
      '<div class="frow"><label>אמצעי גביה</label><select id="cp_method" onchange="cpMethodChg()"><option>אשראי</option><option>העברה</option><option>מזומן</option></select></div>'+
    '</div>'+
    '<div class="frow"><label id="cp_reflbl">אסמכתא / הערה</label><input id="cp_ref" placeholder="מספר אסמכתא, בנק, פרטי התשלום"></div>'+
    '<div id="cp_hint" class="muted" style="font-size:12px;margin-bottom:8px"></div>'+
    '<button class="btn" onclick="doCollectPay()">בצע גביה ורשום קבלה</button>');
  cpMethodChg();
}
function cpMethodChg(){
  var m = el('cp_method').value, isT = m.indexOf('העברה')>-1;
  el('cp_reflbl').textContent = isT? 'מספר אסמכתא / הערה (חובה)' : 'אסמכתא / הערה (רשות)';
  el('cp_hint').textContent = isT
    ? 'בהעברה חובה אסמכתא או הערה. מיד לאחר השמירה ייפתח חלון לצירוף צילום/קובץ.'
    : (m==='אשראי' ? 'סליקת האשראי תוטמע בהמשך — בשלב זה זהו רישום ידני של תשלום שהתקבל.'
                   : 'גביית מזומן נכנסת אוטומטית לקופת המזומן.');
}
async function doCollectPay(){
  if(!COLLECT_CTX) return;
  var amt = Number(el('cp_amt').value)||0;
  var method = el('cp_method').value;
  var ref = String(el('cp_ref').value||'').trim();
  var dt = el('cp_date').value;
  if(amt<=0) return toast('סכום לא תקין', true);
  if(method.indexOf('העברה')>-1 && !ref) return toast('בהעברה חובה לרשום מספר אסמכתא או הערה', true);
  var cid=COLLECT_CTX.cid, kind=COLLECT_CTX.kind, id=COLLECT_CTX.id, mx=COLLECT_CTX.max, txn=COLLECT_CTX.txn;
  var pend = collectMissingInv(cid, kind, id);
  var doc = pend.length? COLLECT_DOC : '';
  var combined = (doc==='חשבונית מס-קבלה');
  if(combined){
    if(kind!=='order' || pend.length!==1) return toast('חשבונית מס-קבלה אפשרית רק בגביה על הזמנה אחת', true);
    if(amt < mx-0.01) return toast('חשבונית מס-קבלה מופקת רק כשהתשלום סוגר את מלוא היתרה ('+ils(mx)+')', true);
  }
  var docUrl = '';
  if(doc && doc!=='ללא'){
    var e = await act('b31EnsureInvoice', (kind==='order'&&id)? {order_id:id, invoice_type:doc} : {customer_id:cid, invoice_type:doc});
    if(!e) return;
    if(e.docs && e.docs.length) docUrl = e.docs[0].url || '';
    if(e.created) toast('הופקו '+e.created+' מסמכים · '+doc);
  }
  var r=null, pid='';
  if(kind==='invoice'){
    r = await act('addPayment',{invoice_id:id, amount:amt, method:method, note:ref, date:dt});
    if(!r) return;
    pid = r.row? r.row.id : '';
    toast('קבלה '+(r.row?r.row.receipt_number:'')+' נרשמה · '+ils(amt));
  } else {
    var pl = {customer_id:cid, method:method, note:ref, date:dt, txn_id:txn};
    if(kind==='order'){ pl.order_id=id; pl.order_amount_ag=toAg(amt); pl.debt_amount_ag=0; }
    else { pl.order_id=''; pl.order_amount_ag=0; pl.debt_amount_ag=toAg(amt); }
    if(combined){ pl.receipt_doc=false; pl.doc_url=docUrl; }
    r = await act('b2ProcessPayment', pl);
    if(!r) return;
    pid = (r.pay_ids && r.pay_ids.length)? r.pay_ids[0] : '';
    toast(r.duplicate? 'התשלום כבר נרשם — קבלה '+r.receipt_number
        : (combined? 'חשבונית מס-קבלה הופקה · '+ils(amt) : 'קבלה '+r.receipt_number+' הופקה · '+ils(amt)));
  }
  COLLECT_CTX = null;
  if(pid && method.indexOf('העברה')>-1) payDocsForm('payment', pid, 'collect', cid);
  else collectCustModal(cid);
}
/* בחירת מסמך לפני מסך התשלום של ההזמנה */
function payDocChooser(oid){
  var proj = Math.max(0, projInvTotal(oid)-orderPaid(oid));
  openModal('<h2>מסמך לפני תשלום</h2>'+
    '<div class="card" style="margin-bottom:10px">להזמנה זו טרם הופק מסמך.'+
      '<div style="margin-top:6px">יתרה כיום: <b>'+ils(orderBalance(oid))+'</b></div>'+
      '<div>לאחר הפקת חשבונית: <b>'+ils(proj)+'</b> · כולל מע"מ '+Math.round(vatRateFE()*100)+'%</div></div>'+
    docOptsHtml('pd_doc', PAY_DOC, "PAY_DOC=this.value;payDocChooser('"+oid+"')", true)+
    '<div class="row" style="margin-top:10px;gap:6px">'+
      '<button class="btn" onclick="payDocGo(\''+oid+'\')">המשך לתשלום</button>'+
      '<button class="btn ghost" onclick="closeModal()">ביטול</button></div>');
}
async function payDocGo(oid){
  PAY_DOC_TYPE=''; PAY_DOC_URL='';
  if(PAY_DOC==='ללא'){ PAY_SKIP[oid]=true; }
  else {
    var e = await act('b31EnsureInvoice',{order_id:oid, invoice_type:PAY_DOC});
    if(!e) return;
    PAY_DOC_TYPE = PAY_DOC;
    PAY_DOC_URL = (e.docs && e.docs.length)? (e.docs[0].url||'') : '';
    if(e.created) toast(PAY_DOC+' הופקה');
  }
  paymentScreen(oid);
}

/* ===== B2: אשראי ותשלומים (D9/D7/D15) — חישובים באגורות ===== */
function toAg(n){ return Math.round(Number(n||0)*100); }
function fromAg(ag){ return Math.round(Number(ag||0))/100; }
function genTxnId(){ return 'TXN-'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*9000+1000); }
// מצב אשראי מקומי לתצוגה (מקור האמת: השרת — b2CreditStatus)
function creditStatus(cid){
  var c = DB.customers.find(x=>x.id===cid)||{};
  var limitAg = toAg(c.credit_limit), usedAg = toAg(custBalance(cid));
  var pct = limitAg>0? Math.round(usedAg*100/limitAg) : (usedAg>0?100:0);
  return {limit_ag:limitAg, used_ag:usedAg, available_ag:limitAg-usedAg, pct:pct};
}
// D9: גרף ניצול מסגרת — ירוק<70%, כתום 70–90%, אדום>90%
function creditBarHtml(cr){
  var pct = Math.max(0, Math.min(100, Number(cr.pct)||0));
  var color = cr.pct>90?'var(--danger)':(cr.pct>=70?'var(--amber)':'var(--ok)');
  return '<div style="margin:8px 0">'+
    '<div style="font-size:12.5px;margin-bottom:3px">ניצול מסגרת אשראי: <b style="color:'+color+'">'+(Number(cr.pct)||0)+'%</b>'+
    ' · מסגרת '+ils(fromAg(cr.limit_ag))+' · חוב '+ils(fromAg(cr.used_ag))+' · פנוי <b style="color:'+(cr.available_ag<0?'var(--danger)':'var(--ink)')+'">'+ils(fromAg(cr.available_ag))+'</b></div>'+

function docChainHtml(oid, active){
  var o = DB.orders.find(x=>x.id===oid); if(!o) return '';
  var supplies = DB.deliveries.filter(d=>d.order_id===oid && d.kind==='אספקה').slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  var returns  = DB.deliveries.filter(d=>d.order_id===oid && d.kind==='איסוף').slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  var inv = DB.invoices.find(v=>v.order_id===oid && v.status!=='בוטלה');
  var pays = DB.payments.filter(p=>p.order_id===oid || (inv && p.invoice_id===inv.id));
  function node(key, label, list, openFn){
    if(!list || !list.length) return '<div class="dc-node dc-empty">'+esc(label)+'</div>';
    return '<div class="dc-node dc-filled'+(active===key?' dc-active':'')+'" onclick="'+openFn+'(\''+list[0].id+'\')">'+esc(label)+(list.length>1?' <span class="dc-badge">×'+list.length+'</span>':'')+'</div>';
  }
  var orderNode = '<div class="dc-node dc-filled'+(active==='order'?' dc-active':'')+'" onclick="openOrder(\''+oid+'\')">הזמנה'+(o.order_number?' #'+esc(o.order_number):'')+'</div>';
  var invNode = inv? '<div class="dc-node dc-filled'+(active==='invoice'?' dc-active':'')+'" onclick="openInvoice(\''+inv.id+'\')">חשבונית '+esc(inv.number)+'</div>' : '<div class="dc-node dc-empty">חשבונית</div>';
  var sortedPays = pays.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  var recNode = sortedPays.length? '<div class="dc-node dc-filled'+(active==='receipt'?' dc-active':'')+'" onclick="openReceipt(\''+sortedPays[0].id+'\')">קבלה'+(sortedPays.length>1?' <span class="dc-badge">×'+sortedPays.length+'</span>':'')+'</div>' : '<div class="dc-node dc-empty">קבלה</div>';
  return '<div class="doc-chain">'+orderNode+'<span class="dc-sep">·</span>'+
    node('delivery','משלוח',supplies,'openDelivery')+'<span class="dc-sep">·</span>'+
    node('return','החזרה',returns,'openDelivery')+'<span class="dc-sep">·</span>'+
    invNode+'<span class="dc-sep">·</span>'+recNode+'</div>';
}
function docChainHtmlLaundry(v, active){
  var pays = DB.payments.filter(p=>p.invoice_id===v.id).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  var recNode = pays.length? '<div class="dc-node dc-filled'+(active==='receipt'?' dc-active':'')+'" onclick="openReceipt(\''+pays[0].id+'\')">קבלה'+(pays.length>1?' <span class="dc-badge">×'+pays.length+'</span>':'')+'</div>' : '<div class="dc-node dc-empty">קבלה</div>';
  return '<div class="doc-chain"><div class="dc-node dc-empty">קליטות מכבסה (ללא הזמנה)</div><span class="dc-sep">·</span>'+
    '<div class="dc-node dc-filled'+(active==='invoice'?' dc-active':'')+' dc-active" onclick="openInvoice(\''+v.id+'\')">חשבונית '+esc(v.number)+'</div><span class="dc-sep">·</span>'+recNode+'</div>';
}

/* B2: מסך תשלום D9 — סכום הזמנה, חוב קודם, גרף ניצול, קיזוז חוב אופציונלי, קבלה מיידית (D15) */
var PAY_CTX = null;
async function paymentScreen(oid){
  var o = DB.orders.find(x=>x.id===oid); if(!o) return;
  // B31c: אין מסמך להזמנה — שואלים מה להפיק לפני התשלום (ברירת מחדל: חשבונית מס).
  if(orderBalance(oid)>0.01 && !PAY_SKIP[oid] && !DB.invoices.some(v=>v.order_id===oid && v.status!=='בוטלה'))
    return payDocChooser(oid);
  var ctx = await api('b2PaymentContext',{order_id:oid});
  if(!ctx.ok) return toast(ctx.error, true);
  // txn_id נוצר עם פתיחת המסך — לחיצה כפולה/שליחה חוזרת לא תחייב פעמיים (idempotency בשרת)
  PAY_CTX = {oid:oid, cid:ctx.customer_id, txn:genTxnId()};
  var bal = fromAg(ctx.order_balance_ag), debt = fromAg(ctx.prior_debt_ag);
  openModal('<h2>תשלום — הזמנה '+(o.order_number||oid)+'</h2>'+
    '<div class="row" style="padding:4px 0"><div class="grow">סכום ההזמנה (יתרה):</div><b>'+ils(bal)+'</b></div>'+

    creditBarHtml(ctx.credit)+
    '<div class="grid2"><div class="frow"><label>תשלום על ההזמנה (₪)</label><input id="b2_ord" type="number" min="0" step="0.01" value="'+bal+'" oninput="b2Sum()"></div>'+
    (debt>0.001?'<div class="frow"><label>תשלום נוסף לקיזוז חוב (רשות, עד '+ils(debt)+')</label><input id="b2_debt" type="number" min="0" step="0.01" value="0" oninput="b2Sum()"></div>':'')+
    '<div class="frow"><label>אמצעי תשלום</label><select id="b2_method" onchange="b2MethodChg()"><option>אשראי</option><option>העברה</option><option>מזומן</option></select></div></div>'+
    '<div class="frow"><label id="b2_reflbl">אסמכתא / הערה</label><input id="b2_ref" placeholder="מספר אסמכתא, בנק, פרטי התשלום"></div>'+
    '<div id="b2_hint" class="muted" style="font-size:12px;margin-bottom:6px"></div>'+
    '<div class="row" style="padding:8px 0;border-top:1px solid var(--line);font-size:16px"><div class="grow"><b>סכום לתשלום:</b></div><b id="b2_total">'+ils(bal)+'</b></div>'+
    '<button class="btn" onclick="doB2Pay()">בצע תשלום ורשום קבלה</button>'+
    '<p class="muted" style="font-size:12px;margin-top:8px">הקבלה מופקת מיד ונשמרת לצמיתות — זמינה גם בפורטל הלקוח. החישוב באגורות (ללא שגיאות עיגול).</p>');
  b2MethodChg();

/* B31: בהעברה — אסמכתא חובה (נאכף גם בשרת) */
function b2MethodChg(){
  var m = el('b2_method').value, isT = m.indexOf('העברה')>-1;
  el('b2_reflbl').textContent = isT? 'מספר אסמכתא / הערה (חובה)' : 'אסמכתא / הערה (רשות)';
  el('b2_hint').textContent = isT
    ? 'בהעברה חובה אסמכתא או הערה. לאחר השמירה ייפתח חלון לצירוף צילום/קובץ.'
    : (m==='אשראי' ? 'סליקת האשראי תוטמע בהמשך — בשלב זה זהו רישום ידני של תשלום שהתקבל.'
                   : 'גביית מזומן נכנסת אוטומטית לקופת המזומן.');
}
function b2Sum(){
  var t = (Number(el('b2_ord').value)||0) + (el('b2_debt')?(Number(el('b2_debt').value)||0):0);
  el('b2_total').textContent = ils(t);

async function doB2Pay(){
  var ordAmt = Number(el('b2_ord').value)||0;
  var debtAmt = el('b2_debt')? (Number(el('b2_debt').value)||0) : 0;
  if(ordAmt+debtAmt<=0) return toast('סכום חובה', true);
  if(ordAmt<0||debtAmt<0) return toast('סכום שלילי אינו חוקי', true);
  var mtd = el('b2_method').value, ref = String(el('b2_ref').value||'').trim();
  if(mtd.indexOf('העברה')>-1 && !ref) return toast('בהעברה חובה לרשום מספר אסמכתא או הערה', true);
  var oid = PAY_CTX.oid, cid = PAY_CTX.cid;
  // B31c: חשבונית מס-קבלה — רק אם התשלום סוגר את מלוא יתרת ההזמנה, ואז אין קבלה נפרדת
  var comb = (PAY_DOC_TYPE==='חשבונית מס-קבלה');
  if(comb && ordAmt < orderBalance(oid)-0.01)
    return toast('חשבונית מס-קבלה הופקה — יש לגבות את מלוא יתרת ההזמנה ('+ils(orderBalance(oid))+')', true);
  var pl = {customer_id:cid, order_id:oid,
    order_amount_ag:toAg(ordAmt), debt_amount_ag:toAg(debtAmt),
    method:mtd, note:ref, txn_id:PAY_CTX.txn};
  if(comb){ pl.receipt_doc=false; pl.doc_url=PAY_DOC_URL; }
  var r = await act('b2ProcessPayment', pl);
  if(r){
    toast(r.duplicate?'התשלום כבר נרשם — קבלה '+r.receipt_number:'קבלה מספר '+r.receipt_number+' הופקה · '+ils(r.total));
    PAY_DOC_TYPE=''; PAY_DOC_URL=''; delete PAY_SKIP[oid];
    var pid = (r.pay_ids && r.pay_ids.length)? r.pay_ids[0] : '';
    if(pid && mtd.indexOf('העברה')>-1) payDocsForm('payment', pid, 'collect', cid);
    else { closeModal(); openOrder(oid); }
  }
}

/* ============================================================
   B41 — קליטת החזרה שלא עברה דרך הנהג
   נסיעת איסוף נחשבת "טופלה ע"י הנהג" רק אם הנהג אישר אותה בשטח: סריקה
   (scan_status='נסרק') או צילום האיסוף (photo_url) — בדיוק מה שמסך הנהג
   דורש לפני סימון "נאסף". אחרת ההנהלה קולטת בלי שהנהג נגע בזה: מותר,
   אבל חובה לפרט סיבה. ההגדרות כאן זהות לאלה שבשרת — האכיפה עצמה בשרת.
   ============================================================ */
/* B41b (הכרעת אבי): רק הנהג המשובץ עצמו, מהחשבון שלו. צילום או סריקה של
   ההנהלה אינם תיעוד איסוף. רשומה ותיקה בלי photo_by/scan_by = לא מתועדת. */
function b41DriverHandled(d){
  var drv = String(d.driver||'').trim(); if(!drv) return false;
  var scanned = String(d.scan_status||'')==='נסרק' && String(d.scan_by||'').trim()===drv;
  var shot = String(d.photo_url||'').trim()!=='' && String(d.photo_by||'').trim()===drv;
  return scanned || shot;
}
function b41IntakeState(oid){
  var o = (DB.orders||[]).find(x=>x.id===oid)||{};
  var expects = b38PlannedForOrder(o).some(pl=>pl.kind==='איסוף');
  var picks = (DB.deliveries||[]).filter(d=>d.order_id===oid && d.kind==='איסוף');
  var anyHandled = picks.some(b41DriverHandled);
  return {expects:expects, picks:picks, anyHandled:anyHandled, needsReason: expects && !anyHandled};
}
/* איסוף שנקלט בפועל — או שנסגר, או שההזמנה כבר הוחזרה/הושלמה.
   התנאי השני מכסה רשומות שנשארו פתוחות מלפני תיקון B39. */
function b41PickupReceived(d){
  if(d.status==='בוצע') return true;
  var oo = (DB.orders||[]).find(x=>x.id===d.order_id);
  return !!oo && (oo.status==='הוחזרה' || oo.status==='הושלמה');
}

/* B41b: מסביר בדיוק למה הנסיעה אינה נחשבת מתועדת — כדי שלא ייראה שרירותי */
function b41WhyNotHandled(d){
  var drv = String(d.driver||'').trim();
  if(!drv) return 'לנסיעת האיסוף לא שובץ נהג כלל.';

      (B5_OPEN_STATUSES.includes(d.status) || (d.status==='בוצע' && dYmd(d.date)===t))).sort(byDrv);
  /* B39 (ליקוי 2): החזרה שכבר נקלטה יורדת מהרשימה הפעילה ועוברת לבלוק מקופל.

     הוחזרה/הושלמה — התנאי השני מכסה רשומות ישנות שנשארו פתוחות מלפני התיקון. */
  var back = backAll.filter(d=>!b41PickupReceived(d));       /* B41: הבדיקה עברה לפונקציה משותפת */
  var backDone = backAll.filter(b41PickupReceived);
  var collectedOf = function(d){ return d.status==='בוצע' || !!d.photo_url; }; /* B30: נאסף = צולם ע"י הנהג או נקלט */
  var card = function(d, mode){

    var backChip = doneP? '<span class="chip" style="background:var(--ok,#3a9d5c);color:#fff">✔ נקלט בשקילה</span>'
      : colP? '<span class="chip" style="background:#8a5a1f;color:#fff">🚚 נאסף — בדרך חזרה</span>'
      : '<span class="chip" style="background:var(--danger);color:#fff">✖ טרם נאסף</span>';
    return '<div class="card" style="cursor:pointer;border-right:5px solid '+(mode==='load'?'var(--teal,#1f7a6b)':(doneP?'var(--ok,#3a9d5c)':(colP?'#8a5a1f':'var(--danger)')))+'" onclick="openDelivery(\''+d.id+'\')">'+
      '<div class="row"><div class="grow"><b>'+esc(cust(o.customer_id))+'</b>'+(o.order_number?' · הזמנה #'+esc(o.order_number):'')+
      /* B33: שם הנהג בשורה מודגשת משלו, כמו בכרטיס "כל המשלוחים" */
      (d.driver?'<div style="margin-top:3px;font-weight:700;color:var(--navy)">נהג: '+esc(d.driver)+'</div>'
              :'<div style="margin-top:3px;font-weight:700;color:var(--danger)">טרם שובץ נהג</div>')+
      b41ManualLine(d)+
      '<div class="muted">'+esc(d.date||'')+(late?' <span style="color:var(--danger)">· באיחור</span>':'')+'</div></div>'+
      (mode==='back'? backChip
                    : '<span class="chip '+esc(d.status)+'">'+esc(d.status)+'</span>')+
      '</div>'+(mode==='load'? dispatchLinesHtml(d.order_id):'')+'</div>';
  };
  return '<div class="section-title"><h3>➡ להעלות לרכב עכשיו</h3><span class="muted">'+load.length+' משלוחים</span></div>'+
    (load.length? load.map(d=>card(d,'load')).join('') : '<div class="card empty">אין משלוחים להעמסה היום</div>')+
    '<div class="section-title"><h3>⬅ אמור לחזור היום</h3><span class="muted">'+
      (back.length? 'ממתינות לקליטה: '+back.length+' · נאספו בשטח '+back.filter(collectedOf).length : 'אין ממתינות')+
      (backDone.length? ' · ✔ נקלטו: '+backDone.length : '')+'</span></div>'+
    (back.length? back.map(d=>card(d,'back')).join('') : '<div class="card empty">אין החזרות שממתינות לקליטה</div>')+
    /* B39: מה שכבר נקלט לא נעלם — הוא מקופל, וההיסטוריה המלאה בטאב "כל המשלוחים" */
    (backDone.length? '<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--ok,#3a9d5c);font-weight:600;font-size:13px">✔ '+backDone.length+' החזרות נקלטו — הצג</summary>'+
      backDone.map(d=>card(d,'back')).join('')+'</details>' : '')+
    b38UnassignedHtml()+
    b41StaleHtml()+
    b38UnsyncedReturnsHtml();
}
/* ============================================================
   B38 — תיקון "אמור לחזור היום"
   הרשימה נבנית מרשומות האיסוף, לא מההזמנות. לכן הזמנה שהחזרה שלה היום
   נעלמה מהמסך בשני מקרים:
   (1) אין לה בכלל רשומת איסוף — הזמנה ותיקה שאושרה לפני האוטומציה,
       או הזמנת כביסה (רשומות משלוח נוצרות אוטומטית להשכרה בלבד).
   (2) יש רשומת איסוף, אבל תאריך ההחזרה בהזמנה שונה מאז והרשומה נשארה
       בתאריך הישן.
   הבלוק הזה מציג בדיוק את המקרים האלה, כדי ששום החזרה לא תהיה בלתי נראית.
   הכפתור מפעיל
   b38FixPickups
   בשרת — מנהל בלבד. */
/* B38: אותה הגדרה בדיוק כמו בשרת — אילו נסיעות מגיעות להזמנה.
   השכרה: אספקה בהתחלה, איסוף בהחזרה.
   כביסה עם שינוע: איסוף בהתחלה (מהלקוח), אספקה בהחזרה (הנקי חזרה).
   כביסה באיסוף עצמי: אין נסיעות כלל. */
function b38PlannedForOrder(o){
  if(String(o.type)==='השכרה') return [{kind:'אספקה',date:o.start_date},{kind:'איסוף',date:o.end_date}];
  if(String(o.type)==='כביסה' && Number(o.delivery_fee||0)>0)
    return [{kind:'איסוף',date:o.start_date},{kind:'אספקה',date:o.end_date}];
  return [];
}
function b38ReturnsNeedingAttention(){
  var t = todayYMD();
  var OPEN = ['מתוכנן','בדרך'];
  var out = [];
  (DB.orders||[]).forEach(function(o){
    if(['מאושרת','סופקה'].indexOf(String(o.status))===-1) return;
    b38PlannedForOrder(o).forEach(function(pl){
      var plD = dYmd(pl.date);
      if(!plD || plD > t) return;                          // עדיין לא הגיע המועד
      var recs = (DB.deliveries||[]).filter(function(d){ return d.order_id===o.id && String(d.kind)===pl.kind; });
      if(!recs.length){
        out.push({order:o, date:pl.date, kind:pl.kind, reason:'אין רשומת '+pl.kind+' להזמנה'});
        return;
      }
      var open = recs.filter(function(d){ return OPEN.indexOf(String(d.status))>-1; });
      if(!open.length) return;                            // כבר בוצע — תקין
      if(open.some(function(d){ return dYmd(d.date)!=='' && dYmd(d.date) <= t; })) return;  // כבר מופיע ברשימה
      out.push({order:o, date:pl.date, kind:pl.kind,
                reason:'רשומת ה'+pl.kind+' בתאריך '+esc(open[0].date||'—')+' ולא בתאריך המתוכנן'});
    });
  });
  return out.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
}
/* B38: נסיעות של היום שאיש לא שובץ אליהן — הסיבה שהנהג לא ראה את ההחזרה
   במסלול שלו. מסלול הנהג נבנה לפי שם הנהג ברשומת המשלוח, ורשומות שנוצרות
   אוטומטית נוצרות בלי נהג. */
function b38UnassignedToday(){
  var t = todayYMD();
  return (DB.deliveries||[]).filter(function(d){
    return B5_OPEN_STATUSES.includes(d.status) && dYmd(d.date)!=='' && dYmd(d.date)<=t && !String(d.driver||'').trim();
  }).sort(function(a,b){ return String(a.date||'').localeCompare(String(b.date||'')); });
}
function b38UnassignedHtml(){
  var rows = b38UnassignedToday();
  if(!rows.length) return '';
  return '<div class="section-title" style="margin-top:16px"><h3 style="color:var(--danger)">⚠ טרם שובץ נהג</h3>'+
    '<span class="muted">'+rows.length+'</span></div>'+
    '<div class="muted" style="margin-bottom:6px">נסיעות שהמועד שלהן היום או עבר ואין להן נהג. הנהג לא רואה אותן במסלול שלו עד שישובץ.</div>'+
    rows.map(function(d){
      var o = (DB.orders||[]).find(x=>x.id===d.order_id)||{};
      return '<div class="card" style="border-right:5px solid var(--danger)">'+
        '<div class="row"><div class="grow" style="cursor:pointer" onclick="openDelivery(\''+d.id+'\')"><b>'+esc(cust(o.customer_id))+'</b>'+
        (o.order_number?' · הזמנה #'+esc(o.order_number):'')+
        '<div class="muted">'+esc(d.kind||'')+' · '+esc(d.date||'')+'</div></div>'+
        '<button class="btn sm" onclick="driverForm(\''+d.id+'\')">שבץ נהג</button></div></div>';
    }).join('');
}
/* B41: איסוף שההזמנה שלו כבר הוחזרה/הושלמה אבל רשומת הנסיעה נשארה פתוחה.
   נוצר לפני תיקון B39 (אז נסגרו רק איסופים בסטטוס 'מתוכנן', ואיסוף שהנהג
   כבר סימן כנאסף נשאר ב'בדרך'). התוצאה: הנסיעה ממשיכה להופיע כאן וגם
   במסלול של הנהג. הכפתור סוגר אותן ומנפיק מספר תעודה — בלי לגעת בהזמנה. */
function b41StalePickups(){
  return (DB.deliveries||[]).filter(d=>isPickup(d) && B5_OPEN_STATUSES.includes(d.status) && b41PickupReceived(d))
    .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
}
function b41StaleHtml(){
  var rows = b41StalePickups();
  if(!rows.length) return '';
  return '<div class="section-title" style="margin-top:16px"><h3 style="color:var(--amber)">⚠ איסופים שנקלטו אך נשארו פתוחים</h3>'+
    (ROLE==='מנהל'?'<button class="btn" onclick="b41CloseStale()">סגור אותם</button>':'<span class="muted">'+rows.length+'</span>')+'</div>'+
    '<div class="muted" style="margin-bottom:6px">ההחזרה כבר נקלטה וההזמנה סגורה, אבל רשומת האיסוף נשארה פתוחה — ולכן היא ממשיכה להופיע כאן ובמסלול של הנהג. הסגירה מנפיקה מספר תעודה ואינה נוגעת בנתוני ההזמנה או במלאי.</div>'+
    rows.map(delivCard).join('');
}
async function b41CloseStale(){
  if(!confirm('לסגור '+b41StalePickups().length+' נסיעות איסוף שההחזרה שלהן כבר נקלטה?')) return;
  var r = await act('b41CloseStalePickups',{});
  if(r) toast('נסגרו '+r.closed+' נסיעות איסוף');
}
function b38UnsyncedReturnsHtml(){
  var rows = b38ReturnsNeedingAttention();
  var canFix = ROLE==='מנהל';
  if(!rows.length) return '';
  return '<div class="section-title" style="margin-top:16px"><h3 style="color:var(--danger)">⚠ נסיעות שלא מופיעות ברשימה</h3>'+
    (canFix?'<button class="btn" onclick="b38FixPickups()">סנכרן נסיעות</button>':'<span class="muted">'+rows.length+'</span>')+'</div>'+
    '<div class="muted" style="margin-bottom:6px">הזמנות שמועד הנסיעה שלהן היום או עבר, ורשומת המשלוח שלהן חסרה או יושבת בתאריך אחר.</div>'+
    rows.map(function(r){
      var o = r.order;
      return '<div class="card" style="cursor:pointer;border-right:5px solid var(--amber)" onclick="openOrder(\''+o.id+'\')">'+
        '<div class="row"><div class="grow"><b>'+esc(cust(o.customer_id))+'</b>'+(o.order_number?' · הזמנה #'+esc(o.order_number):'')+
        '<div class="muted">'+esc(r.kind)+': '+esc(r.date||'')+' · '+esc(o.type||'')+'</div>'+
        '<div style="color:var(--danger);font-size:12.5px">'+r.reason+'</div></div>'+
        '<span class="chip '+esc(o.status)+'">'+esc(o.status)+'</span></div></div>';
    }).join('');
}
async function b38FixPickups(){
  var r = await act('b38FixPickups',{});
  if(!r) return;
  toast('נוצרו '+r.created+' רשומות משלוח · תוקנו '+r.fixed+' תאריכים');
  var g = await api('getAll'); if(g && g.ok) DB = g.db;
  render();
}
var DELIV_TAB = 'today';
function rDeliveries(){
  if(ROLE==='נהג') return rDriverRoute(); // B5: Driver-Lite — הנהג רואה רק את המסלול שלו
  /* B19d (L5): הרשימה הפתוחה כוללת גם משלוחים "בדרך" — לא רק "מתוכנן" */
  var OPEN_ST = ['מתוכנן','בדרך'];
  var openSup = DB.deliveries.filter(d=>OPEN_ST.includes(d.status) && !isPickup(d)).sort((a,b)=>a.date>b.date?1:-1);
  /* B41: איסוף שההזמנה שלו כבר הוחזרה אינו "פתוח" — הוא יורד לבלוק הריפוי מטה, אחרת
     הוא נשאר בתצוגה לנצח (וגם במסלול של הנהג) גם אחרי שההחזרה כבר נקלטה. */
  var openPickAll = DB.deliveries.filter(d=>OPEN_ST.includes(d.status) && isPickup(d)).sort((a,b)=>a.date>b.date?1:-1);
  var openPick = openPickAll.filter(d=>!b41PickupReceived(d));
  var done = DB.deliveries.filter(d=>!OPEN_ST.includes(d.status)).slice(-15).reverse();
  var tb = function(k,l){ return '<button class="btn '+(DELIV_TAB===k?'':'ghost')+' grow" onclick="DELIV_TAB=\''+k+'\';rDeliveries()">'+l+'</button>'; };
  var body;
  if(DELIV_TAB==='today') body = dispatchTodayHtml();
  else body = '<div class="section-title"><h3>➡ אספקות פתוחות</h3><span class="muted">'+openSup.length+'</span></div>'+
      (openSup.length? openSup.map(delivCard).join(''):'<div class="card empty">אין אספקות פתוחות</div>')+
      '<div class="section-title"><h3>⬅ איסופים פתוחים (החזרות)</h3><span class="muted">'+openPick.length+'</span></div>'+
      (openPick.length? openPick.map(delivCard).join(''):'<div class="card empty">אין איסופים פתוחים</div>')+
      b41StaleHtml()+
      b44DupPickupHtml()+
      (done.length?'<div class="section-title"><h3>אחרונים</h3></div>'+done.map(delivCard).join(''):'');
  var canPlan = ['מנהל','משרד'].includes(ROLE);
  el('main').innerHTML = '<div class="section-title"><h2>משלוחים</h2>'+
    (canPlan?'<button class="btn" onclick="b34TripForm()">+ תכנון נסיעה</button>':'<span class="muted">נוצרים אוטומטית באישור הזמנה</span>')+'</div>'+
    (canPlan? b34TripsTodayHtml() : '')+
    '<div class="row" style="margin:8px 0;gap:6px">'+tb('today','היום — העמסה ואיסוף')+tb('all','כל המשלוחים')+'</div>'+body;
}
/* ===== B34: נסיעות חלוקה — תכנון בהנהלה ===== */
function b34TripsTodayHtml(){
  var t = todayYMD();
  var trips = (DB.deliveryTrips||[]).filter(x=>String(x.date)>=t && x.status!=='בוטלה')
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)) || Number(a.seq||0)-Number(b.seq||0)).slice(0,12);
  if(!trips.length) return '';
  return '<div class="card" style="margin:8px 0"><b>נסיעות מתוכננות</b><table style="margin-top:6px"><tr><th>תאריך</th><th>נסיעה</th><th>נהג</th><th>יציאה</th><th>משלוחים</th><th>סטטוס</th><th></th></tr>'+
    trips.map(function(tr){
      var drv = (DB.employees||[]).find(e=>e.id===tr.driver_id)||{};
      var cnt = (DB.deliveries||[]).filter(d=>String(d.trip_id)===String(tr.id)).length;
      return '<tr><td>'+esc(tr.date)+'</td><td>'+esc(tr.seq)+'</td><td>'+esc(drv.name||'')+'</td><td>'+esc(tr.planned_time||'—')+'</td><td>'+cnt+'</td>'+
        '<td><span class="chip" style="background:'+(tr.status==='יצאה'?'var(--navy)':tr.status==='הסתיימה'?'var(--ok)':'var(--navy2)')+';color:#fff">'+esc(tr.status)+'</span></td>'+
        '<td class="row" style="gap:4px"><button class="btn ghost sm" onclick="b34TripAssignForm(\''+tr.id+'\')">שיבוץ</button>'+
        (tr.status==='מתוכננת'?'<button class="btn ghost sm" onclick="b34DoTripStatus(\''+tr.id+'\',\'יצאה\')">יצאה</button>':'')+
        (tr.status==='יצאה'?'<button class="btn ghost sm" onclick="b34DoTripStatus(\''+tr.id+'\',\'הסתיימה\')">סיום</button>':'')+
        (tr.status==='מתוכננת'?'<button class="btn ghost sm" style="color:var(--danger)" onclick="b34DoTripStatus(\''+tr.id+'\',\'בוטלה\')">בטל</button>':'')+
        '</td></tr>';
    }).join('')+'</table></div>';
}
function b34TripForm(){

  if(!drivers.length) return toast('אין נהגים פעילים במערכת', true);
  var vehicles = (DB.vehicles||[]).filter(v=>v.active!=='לא' && (!v.status || v.status==='פעיל'));
  openModal('<h2>תכנון נסיעה</h2>'+
    '<div class="grid2">'+
    '<div class="frow"><label>תאריך</label><input id="tp_date" type="date" value="'+todayYMD()+'"></div>'+
    '<div class="frow"><label>שעת יציאה מתוכננת</label><input id="tp_time" type="time"></div>'+
    '<div class="frow"><label>נהג</label><select id="tp_driver">'+drivers.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('')+'</select></div>'+

    '<button class="btn grow" style="width:100%" onclick="b34DoTripCreate()">צור נסיעה והמשך לשיבוץ</button>');
}
async function b34DoTripCreate(){
  var r = await act('tripCreate',{date:el('tp_date').value, planned_time:el('tp_time').value, driver_id:el('tp_driver').value, vehicle_id:el('tp_vehicle').value, notes:el('tp_notes').value});
  if(!r) return;

function b34TripAssignForm(tid){
  var tr = (DB.deliveryTrips||[]).find(x=>x.id===tid); if(!tr) return;
  var drv = (DB.employees||[]).find(e=>e.id===tr.driver_id)||{};
  /* משלוחים פתוחים לתאריך הנסיעה (או בלי נסיעה, או כבר בנסיעה זו) */
  var cands = (DB.deliveries||[]).filter(d=>['מתוכנן','בדרך'].includes(d.status) && String(d.date||'')<=String(tr.date) &&
    (!d.trip_id || String(d.trip_id)===String(tid)));
  var cur = cands.filter(d=>String(d.trip_id)===String(tid)).map(d=>String(d.id));
  openModal('<h2>שיבוץ משלוחים — נסיעה '+esc(tr.seq)+' · '+esc(drv.name||'')+'</h2>'+
    '<p class="muted" style="font-size:13px">סמן את המשלוחים לנסיעה זו. משלוח שישובץ יקבל את הנהג של הנסיעה.</p>'+
    (cands.length? cands.map(function(d){
      var o = d.order_id? (DB.orders||[]).find(x=>x.id===d.order_id) : null;
      var c = o? (DB.customers||[]).find(x=>x.id===o.customer_id) : null;
      return '<label style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer">'+
        '<input type="checkbox" class="tpa_cb" value="'+esc(d.id)+'" style="width:auto"'+(cur.includes(String(d.id))?' checked':'')+'>'+
        '<span class="grow">'+esc(c?c.name:'—')+(o?' · #'+esc(o.order_number||o.id):'')+' · '+esc(isPickup(d)?'איסוף':'אספקה')+' · '+esc(d.date||'')+
        (d.driver&&d.driver!==drv.name?' · <span style="color:var(--amber)">כרגע: '+esc(d.driver)+'</span>':'')+'</span></label>';
    }).join('') : '<div class="empty">אין משלוחים פתוחים מתאימים</div>')+
    '<button class="btn grow" style="width:100%;margin-top:10px" onclick="b34DoTripAssign(\''+tid+'\')">שמור שיבוץ</button>');

async function b34DoTripAssign(tid){

async function b34DoTripStatus(tid, st){
